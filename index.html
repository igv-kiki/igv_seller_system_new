b:[U([[`Use a unique password for iGV and for the registered email.`,`为 iGV 账号和注册邮箱分别设置独立密码。`],[`Only talk to buyers in the order message system. Requests to move to another app are a warning sign.`,`只通过订单消息系统与买家沟通。要求转到其他软件沟通是风险信号。`],[`Do not ask buyers for personal or game account information that the delivery does not need.`,`不要向买家索取交付不需要的个人信息或游戏账号信息。`],[`Check the sender before acting on any email that claims to be from iGV.`,`对自称来自 iGV 的邮件，先核对发件人再操作。`]]),
N(`note`,`If you think someone else has accessed your account, change both passwords and contact support immediately.`,`如怀疑账号被他人登录，请立即修改两处密码并联系客服。`)],
r:[`no-code`,`prohibited`,`contact-buyer`]},

/* ---------- listing ---------- */
{id:`what-can-sell`,c:`listing`,ty:`rule`,u:`2026-09-02`,
t:[`What can I sell on iGV?`,`在 iGV 可以销售哪些商品？`],
s:[`Game accounts, in-game currency, items, top-ups, boosting services and account rentals, within the game categories opened for your store.`,`游戏账号、游戏币、道具、充值、代练服务与账号租赁，范围以你店铺已开通的游戏类目为准。`],
k:`products allowed categories accounts gold coins items boosting top-up rental 可售 商品类型 类目 游戏币 账号 代练 充值 租号`,
b:[T([[`Product type`,`商品类型`],[`How it is delivered`,`交付方式`]],[[[`In-game currency & items`,`游戏币与道具`],[`To the buyer's game account`,`交付至买家游戏账号`]],[[`Game accounts`,`游戏账号`],[`Account details sent through iGV on-site messaging`,`通过 iGV 站内消息发送账号信息`]],[[`Top-ups, boosting, rentals`,`充值、代练、租号`],[`As described in the listing`,`按商品描述约定的方式`]]]),
H(`Listing requirements`,`上架要求`),
U([[`Sell only products and services permitted under the Seller Secure Transaction Agreement.`,`仅可销售《卖家安全交易协议》允许的商品与服务。`],[`Stock and price must be accurate at all times.`,`库存与价格须始终保持准确。`],[`The listing must be placed in the correct game, category and brand.`,`商品须发布在正确的游戏、类目与品牌下。`]])],
r:[`create-listing`,`category-brand`,`prohibited`]},

{id:`create-listing`,c:`listing`,ty:`guide`,u:`2026-10-20`,p:1,
t:[`How do I publish a listing?`,`如何发布商品？`],
s:[`Pick the game and category, fill in price, stock, delivery time and (for accounts) a warranty period, then submit. The commission rate for that game is shown on the posting page.`,`选择游戏与类目，填写价格、库存、交付时效，账号类商品还需选择保修期，然后提交。该游戏的佣金比例会显示在发布页面。`],
k:`post product offer new listing upload 上架 发布 新增商品 刊登`,
a:[`Open product posting page`,`前往商品发布页`],
b:[S([[`Choose the <b>game</b>, then the <b>category and brand</b> that match your product.`,`选择<b>游戏</b>，再选择与商品相符的<b>类目与品牌</b>。`],[`Enter title, description, <b>price</b> and <b>stock</b>.`,`填写标题、描述、<b>价格</b>与<b>库存</b>。`],[`Set a <b>delivery time</b> you can always meet. Late delivery is penalised.`,`设置你能稳定做到的<b>交付时效</b>。超时交付会被处罚。`],[`For account listings, choose a <b>warranty period</b> and complete account verification.`,`账号类商品需选择<b>保修期</b>并完成账号验证。`],[`Check the <b>commission rate</b> shown on the page, then submit.`,`核对页面显示的<b>佣金比例</b>后提交。`]]),
N(`tip`,`Your payout per order = sold price − commission. Check it before you set the price.`,`每单到账金额 = 成交价 − 佣金。定价前请先确认。`)],
r:[`category-brand`,`verification-method`,`warranty-setting`,`fees`]},

{id:`category-brand`,c:`listing`,ty:`guide`,u:`2026-10-09`,p:1,
t:[`How do I choose the right category and brand for my listing?`,`如何为商品选择正确的类目和品牌？`],
s:[`Choose the game first, then the category that describes what the buyer receives (account, currency, item, service). A wrong category hides your listing from the buyers looking for it.`,`先选游戏，再选择与买家实际收到内容相符的类目（账号、游戏币、道具、服务）。类目选错会导致目标买家搜不到你的商品。`],
k:`category brand wrong classification 类目 品牌 分类 选错`,
b:[U([[`<b>Category</b> = what is delivered. An account with currency on it is still an account listing.`,`<b>类目</b>按交付物判断。带有游戏币的账号仍属于账号类商品。`],[`<b>Brand</b> = the exact game or version, including region or server where the game separates them.`,`<b>品牌</b>对应具体游戏或版本；游戏区分地区或服务器时需一并选对。`],[`If no option fits, do not pick the closest popular one. Contact support to request the category.`,`没有合适选项时，不要选择相近的热门类目，请联系客服申请新增。`]]),
N(`warn`,`Listings in the wrong category may be removed.`,`发布在错误类目的商品可能被下架。`)],
r:[`create-listing`,`what-can-sell`,`auto-listing-error`]},

{id:`verification-method`,c:`listing`,ty:`guide`,u:`2026-11-12`,
t:[`Client-based or web-based verification: which should I use?`,`客户端验证和网页验证，应该选哪种？`],
s:[`Use client-based verification when you can: it is faster and your listings rank higher in search. Web-based verification needs no install but may queue.`,`条件允许时优先使用客户端验证：速度更快，商品搜索排名更高。网页验证无需安装，但可能需要排队。`],
k:`comfortable listing client setup download verify account 放心挂 客户端 验号 验证 安装 升级`,
a:[`Download the listing client`,`下载上架客户端`],
b:[T([[``,``],[`Client-based`,`客户端验证`],[`Web-based`,`网页验证`]],[[[`Speed`,`速度`],[`Faster`,`更快`],[`May require queuing`,`可能需要排队`]],[[`Search ranking`,`搜索排名`],[`Higher`,`更高`],[`Standard`,`标准`]],[[`Setup`,`准备工作`],[`Install the client`,`需安装客户端`],[`None`,`无需安装`]]]),
H(`If you use the old client`,`如果你在使用旧版客户端`),
P(`The verification system has been upgraded. The old client can no longer be downloaded by new users; update to the current client to keep verifying accounts.`,`验证系统已全面升级。新用户已无法下载旧版客户端，请更新到当前版本以继续验证账号。`)],
r:[`auto-listing-error`,`create-listing`,`category-brand`]},

{id:`auto-listing-error`,c:`listing`,ty:`fix`,u:`2026-11-05`,p:1,
t:[`My automated account listing failed. What should I check?`,`账号自动上架失败，应该检查什么？`],
s:[`Read the error shown next to the failed listing, fix that item, then retry. Most failures are login or verification problems on the game account itself.`,`查看失败商品旁显示的错误提示，针对性修正后重试。多数失败源于游戏账号本身的登录或验证问题。`],
k:`automatic listing error failed verification queue 自动上架 上架失败 报错 验证失败`,
a:[`View failed listings`,`查看失败的商品`],
b:[S([[`Confirm the game account can log in normally and is not locked or restricted.`,`确认游戏账号可以正常登录，未被锁定或限制。`],[`Check that the game, category and brand match the account.`,`检查所选游戏、类目和品牌是否与账号相符。`],[`Make sure you are on the current listing client, or switch to web-based verification.`,`确认使用的是当前版本客户端，或改用网页验证。`],[`Retry. If the same error returns, send support the error text and the listing ID.`,`重新提交。若错误重复出现，请将错误信息与商品编号发给客服。`]])],
r:[`verification-method`,`category-brand`,`listing-processing`]},

{id:`listing-processing`,c:`listing`,ty:`fix`,u:`2026-08-21`,
t:[`Why is my listing stuck in “Processing”?`,`为什么我的商品一直显示“处理中”？`],
s:[`A buyer has placed an order but not paid yet. If payment is not made within 60 minutes the order is cancelled automatically and the listing goes back on sale.`,`有买家下单但尚未付款。若 60 分钟内未付款，订单会自动取消，商品恢复在售状态。`],
k:`processing state locked unpaid order not paid malicious 处理中 锁定 未付款 恶意拍单`,
b:[P(`While an unpaid order exists, the item is reserved for that buyer and cannot be bought by anyone else.`,`存在未付款订单时，商品会为该买家保留，其他人无法购买。`),
N(`warn`,`Many of your listings locked by unpaid orders at once can be malicious competition. Contact online support so the orders can be investigated.`,`如果大量商品同时被未付款订单锁定，可能是恶意竞争。请联系在线客服进行排查。`)],
r:[`order-status`,`auto-listing-error`,`create-listing`]},

{id:`warranty-setting`,c:`listing`,ty:`faq`,u:`2026-09-25`,
t:[`How do I choose a warranty period for account listings?`,`账号类商品的保修期应该怎么选？`],
s:[`You select the warranty period when you list an account. The order amount can be withdrawn only after that period ends without problems, so a longer warranty means later payout.`,`保修期在发布账号商品时选择。订单款项需在保修期结束且无问题后才可提现，因此保修期越长，回款越晚。`],
k:`warranty period insurance guarantee days 保修期 质保 售后期`,
b:[U([[`Warranty periods differ by game.`,`不同游戏的保修期不同。`],[`During the warranty period you must help the buyer with any problem caused by the seller side.`,`保修期内，凡因卖家原因导致的问题，卖家必须协助买家处理。`],[`When the period ends with no open issue, the amount becomes withdrawable.`,`保修期结束且没有未解决问题时，款项转为可提现。`]])],
r:[`when-withdraw`,`warranty-issue`,`create-listing`]},

/* ---------- orders ---------- */
{id:`order-status`,c:`orders`,ty:`faq`,u:`2026-10-15`,p:1,
t:[`What do the order statuses mean?`,`各个订单状态分别是什么意思？`],
s:[`Each status tells you who needs to act next. “Processing” and “Frozen” are the two that most often need your attention.`,`每个状态都对应“下一步该谁操作”。其中“处理中”和“冻结”最常需要你关注。`],
k:`status processing delivered completed cancelled frozen 订单状态 处理中 已交付 已完成 已取消 冻结`,
a:[`Open order list`,`前往订单列表`],
b:[T([[`Status`,`状态`],[`Meaning`,`含义`],[`Your next step`,`你需要做什么`]],[
[[`Processing (unpaid)`,`处理中（未付款）`],[`Buyer ordered but has not paid`,`买家已下单未付款`],[`Wait; auto-cancels after 60 minutes`,`等待；60 分钟后自动取消`]],
[[`Awaiting delivery`,`待交付`],[`Payment received`,`买家已付款`],[`Deliver within the guaranteed time`,`在承诺时效内交付`]],
[[`Delivered`,`已交付`],[`You confirmed delivery`,`你已确认交付`],[`Wait for buyer confirmation`,`等待买家确认`]],
[[`Completed`,`已完成`],[`Order closed normally`,`订单正常结束`],[`Funds unlock after the warranty period`,`保修期结束后款项可提现`]],
[[`Frozen`,`冻结`],[`A claim or review is open`,`存在申诉或审核`],[`Reply to the claim before the deadline`,`在时限内回复申诉`]],
[[`Cancelled`,`已取消`],[`Order ended without delivery`,`订单未交付即结束`],[`Check whether a penalty applies`,`确认是否产生处罚`]]])],
r:[`deliver-order`,`order-frozen`,`listing-processing`]},

{id:`deliver-order`,c:`orders`,ty:`guide`,u:`2026-10-22`,
t:[`How do I deliver an order?`,`如何交付订单？`],
s:[`Deliver within the guaranteed time using the method the buyer chose, upload screenshots as proof, and only then confirm delivery.`,`按买家选择的交付方式在承诺时效内完成交付，上传截图凭证，然后再点击确认交付。`],
k:`delivery deliver goods send trade confirm 发货 交付 交货 确认交付`,
a:[`Open orders awaiting delivery`,`前往待交付订单`],
b:[S([[`Open the order and read the buyer's delivery information.`,`打开订单，查看买家填写的交付信息。`],[`If anything is unclear, ask the buyer in the <b>order message system</b>.`,`如有疑问，通过<b>订单消息系统</b>向买家确认。`],[`Take a screenshot <b>before</b> the trade.`,`交易<b>前</b>截图。`],[`Deliver: in-game goods go to the buyer's game account; account details are sent through iGV on-site messaging.`,`执行交付：游戏内商品交付至买家游戏账号；账号信息通过 iGV 站内消息发送。`],[`Take a screenshot <b>after</b> the trade and upload your proof to the order.`,`交易<b>后</b>截图，并将凭证上传到订单。`],[`Click <b>Confirm delivery</b>.`,`点击<b>确认交付</b>。`]]),
N(`warn`,`Never confirm delivery before the buyer has actually received the goods. False confirmation is treated as fraud.`,`买家实际收到商品前，切勿点击确认交付。虚假确认交付按欺诈处理。`)],
r:[`evidence`,`contact-buyer`,`cant-deliver`,`late-penalty`]},

{id:`evidence`,c:`orders`,ty:`guide`,u:`2026-10-22`,
t:[`What delivery proof should I keep, and how do I upload it?`,`需要保留哪些交付凭证？如何上传？`],
s:[`Upload screenshots taken before and after the trade (up to 8 once the order is completed) and keep any video for at least one month. This proof is what arbitration relies on.`,`上传交易前后的截图（订单完成后最多 8 张），视频凭证至少保留一个月。仲裁时将以这些凭证为重要依据。`],
k:`evidence proof screenshot certificate video upload failed unable 凭证 截图 证据 交易凭证 上传失败 无法上传 录屏`,
a:[`Upload proof to an order`,`为订单上传凭证`],
b:[H(`What counts as good proof`,`什么是有效凭证`),
U([[`Before and after screenshots that show the buyer's character or account name and the amount traded.`,`交易前后截图，需显示买家角色名或账号名以及交易数量。`],[`The game clock or system time visible where possible.`,`尽量显示游戏内时间或系统时间。`],[`Video of the full trade for high-value orders.`,`高金额订单建议全程录屏。`]]),
H(`If the upload fails`,`如果上传失败`),
S([[`Check the file is an image and try a smaller file.`,`确认文件为图片格式，并尝试压缩后上传。`],[`Refresh the order page or try another browser.`,`刷新订单页面或更换浏览器。`],[`Still failing? Send the screenshots to support with the order ID so they are on record.`,`仍然失败？请将截图连同订单号发给客服留档。`]])],
r:[`deliver-order`,`dispute`,`arbitration`]},

{id:`buyer-no-confirm`,c:`orders`,ty:`fix`,u:`2026-09-30`,p:1,
t:[`The buyer hasn't confirmed receipt. What should I do?`,`买家迟迟不确认收货怎么办？`],
s:[`Make sure your proof is uploaded, message the buyer in the order, and contact support with the order ID if there is still no response.`,`先确认凭证已上传，再通过订单消息提醒买家；仍无回应时，携带订单号联系客服处理。`],
k:`buyer not confirm received delivered waiting 未确认 不确认收货 不点收货`,
a:[`Open delivered orders`,`前往已交付订单`],
b:[S([[`Check that before/after screenshots are attached to the order.`,`检查订单中是否已上传交易前后截图。`],[`Send the buyer a short, polite reminder in the order message system.`,`通过订单消息系统向买家发送简短、礼貌的提醒。`],[`If the buyer stays silent, contact support. With valid proof, iGV can decide the delivery status.`,`买家仍无回应时请联系客服。凭证有效的情况下，平台可判定交付状态。`]]),
N(`warn`,`Do not contact the buyer outside iGV or pressure them in-game. Both break platform rules.`,`不要在平台外联系买家，也不要在游戏内催促施压，这两种行为都违反平台规则。`)],
r:[`evidence`,`contact-buyer`,`when-withdraw`]},

{id:`contact-buyer`,c:`orders`,ty:`guide`,u:`2026-08-05`,
t:[`How do I contact the buyer?`,`如何联系买家？`],
s:[`Use the order message system on the order page. Do not use in-game chat or any outside app to discuss the order.`,`使用订单页面的订单消息系统。不要通过游戏内聊天或任何站外软件沟通订单。`],
k:`message chat buyer contact communicate 联系买家 聊天 消息 沟通`,
a:[`Open order messages`,`前往订单消息`],
b:[U([[`Keep every message polite and about the order.`,`保持礼貌，沟通内容仅围绕订单。`],[`Do not share or request personal contact details.`,`不要提供或索取个人联系方式。`],[`Do not ask the buyer to cancel the order.`,`不要要求买家取消订单。`],[`Messages in the order are evidence in a dispute; in-game chat is not.`,`订单消息可作为争议证据，游戏内聊天则不能。`]])],
r:[`deliver-order`,`prohibited`,`buyer-no-confirm`]},

{id:`cant-deliver`,c:`orders`,ty:`fix`,u:`2026-10-02`,p:1,
t:[`I can't deliver on time or I'm out of stock. What should I do?`,`无法按时交付或缺货了，怎么办？`],
s:[`Tell the buyer and contact support before the delivery time runs out. Do not ask the buyer to cancel. Then correct your stock so it does not happen again.`,`在交付时效到期前告知买家并联系客服，不要要求买家取消订单。之后立即修正库存，避免再次发生。`],
k:`late delay out of stock cannot deliver timeout 超时 缺货 延迟 无法交付 发不了货`,
a:[`Update stock`,`修改库存`],
b:[S([[`Message the buyer in the order with an honest new delivery time.`,`通过订单消息如实告知买家新的预计交付时间。`],[`Contact support with the order ID before the guaranteed delivery time expires.`,`在承诺交付时效到期前，携带订单号联系客服。`],[`Update stock and delivery time on the affected listings.`,`修改相关商品的库存与交付时效。`]]),
N(`warn`,`If the order is cancelled or moved to another seller because you ran out of time, a penalty applies.`,`订单因你超时而被取消或转给其他卖家时，将产生处罚。`)],
r:[`late-penalty`,`buyer-caused`,`contact-buyer`]},

{id:`buyer-caused`,c:`orders`,ty:`fix`,u:`2026-09-11`,p:1,
t:[`The order can't be completed because of the buyer`,`因买家原因导致订单无法完成怎么办？`],
s:[`Record what happened in the order messages, keep screenshots, and ask support to handle the order so it is not treated as your late delivery.`,`在订单消息中记录情况并保留截图，请客服介入处理，避免被判定为你的超时未交付。`],
k:`buyer offline wrong info no response buyer fault 买家原因 买家不在线 信息错误 联系不上`,
b:[H(`Typical cases`,`常见情况`),
U([[`The buyer gave a wrong character name, server or account detail.`,`买家填写的角色名、服务器或账号信息有误。`],[`The buyer is offline or does not reply.`,`买家不在线或不回复。`],[`The buyer asks to change the order after paying.`,`买家付款后要求更改订单内容。`]]),
H(`What to do`,`处理方式`),
S([[`Message the buyer in the order and screenshot your attempts.`,`通过订单消息联系买家，并对联系记录截图。`],[`Contact support with the order ID and screenshots.`,`携带订单号与截图联系客服。`],[`Wait for support's instruction. Do not confirm delivery and do not ask the buyer to cancel.`,`等待客服处理结果。不要确认交付，也不要要求买家取消订单。`]])],
r:[`cant-deliver`,`contact-buyer`,`late-penalty`]},

/* ---------- money ---------- */
{id:`fees`,c:`money`,ty:`rule`,u:`2026-10-18`,
t:[`What fees and commission does iGV charge?`,`iGV 收取哪些佣金和费用？`],
s:[`iGV charges a commission on each completed order. The rate depends on the game and business type, and the exact rate is shown on the product posting page.`,`iGV 对每笔已完成订单收取佣金。比例因游戏与业务类型而异，具体比例显示在商品发布页面。`],
k:`commission fee rate charge cost settlement 佣金 手续费 费率 抽成 结算 费用`,
a:[`Check rates on the posting page`,`在发布页查看佣金比例`],
b:[N(`note`,`<b>Amount added to your balance = sold price − commission</b>`,`<b>计入余额的金额 = 成交价 − 佣金</b>`),
H(`Other amounts that can be deducted`,`其他可能产生的扣款`),
U([[`<b>Penalties</b> for late delivery, or for orders refunded because of a seller error.`,`<b>处罚金</b>：超时交付，或因卖家过错导致退款的订单。`],[`<b>Withdrawal costs</b> charged by the payment method you choose.`,`<b>提现成本</b>：由所选提现渠道收取。`]]),
P(`Your balance is credited when the order is completed, and becomes withdrawable after the warranty period.`,`订单完成后款项计入余额，保修期结束后方可提现。`)],
r:[`when-withdraw`,`late-penalty`,`create-listing`]},

{id:`when-withdraw`,c:`money`,ty:`faq`,u:`2026-10-18`,
t:[`When can I withdraw the money from an order?`,`订单款项什么时候可以提现？`],
s:[`After the order's warranty period ends with no open problem. Until then the amount is in your balance but not yet withdrawable.`,`订单保修期结束且没有未解决问题之后。在此之前，款项已计入余额但暂不可提现。`],
k:`available balance pending hold unlock release 可提现 冻结金额 待结算 到期 解冻`,
a:[`View balance`,`查看余额`],
b:[S([[`Buyer purchases your listing.`,`买家购买你的商品。`],[`You deliver and the order is completed; iGV deducts commission.`,`你完成交付，订单完成，平台扣除佣金。`],[`The warranty period runs. You must help with any issue caused by the seller side.`,`进入保修期。因卖家原因导致的问题需由你协助处理。`],[`No problem by the end of the period: the amount becomes withdrawable.`,`保修期结束且无问题：款项转为可提现。`]]),
N(`tip`,`Warranty periods differ by game, and for account listings you choose the period yourself when listing.`,`不同游戏保修期不同；账号类商品的保修期由你在发布时选择。`)],
r:[`warranty-setting`,`withdraw-steps`,`cant-withdraw`]},

{id:`add-method`,c:`money`,ty:`guide`,u:`2026-09-08`,p:1,
t:[`How do I add a withdrawal method?`,`如何添加提现方式？`],
s:[`Add a payment account on the Withdraw page. Use a verified account in your own name, in a country the payment method supports.`,`在提现页面添加收款账户。请使用本人名下、已完成认证且所在国家受该渠道支持的账户。`],
k:`payment method paypal skrill bank transfer payee account none available 提现方式 收款账户 绑定 银行卡 没有可用`,
a:[`Open Withdraw page`,`前往提现页面`],
b:[S([[`Open the <b>Withdraw</b> page and choose <b>Add method</b>.`,`打开<b>提现</b>页面，选择<b>添加提现方式</b>。`],[`Select a method such as PayPal, Skrill or bank transfer.`,`选择渠道，例如 PayPal、Skrill 或银行转账。`],[`Enter the account details exactly as they appear with your payment provider.`,`按支付机构登记的信息准确填写账户资料。`],[`Confirm with the code sent to your registered email.`,`使用发送到注册邮箱的验证码确认。`]]),
N(`warn`,`Most failed withdrawals come from a payment account that is not verified with the provider. Log in to the provider and check before you add it.`,`多数提现失败是因为收款账户未在支付机构完成认证。添加前请先登录该机构确认。`),
H(`No method works in my country`,`我所在的国家没有可用的提现方式`),
P(`Contact support with your country and the methods you can receive. Do not use another person's account.`,`请联系客服并说明所在国家及你可使用的收款渠道。不要使用他人账户收款。`)],
r:[`withdraw-steps`,`cant-withdraw`,`kyc`]},

{id:`withdraw-steps`,c:`money`,ty:`guide`,u:`2026-09-08`,p:1,
t:[`How do I withdraw my balance?`,`如何提现余额？`],
s:[`Open the Withdraw page, choose a method and amount within your withdrawable balance, and submit. Each request gets a withdrawal ID you can track.`,`打开提现页面，选择提现方式，输入不超过可提现余额的金额并提交。每笔申请都会生成可追踪的提现单号。`],
k:`payout cash out request payment 提款 取现 提现步骤 申请提现`,
a:[`Open Withdraw page`,`前往提现页面`],
b:[S([[`Open the <b>Withdraw</b> page and check your <b>withdrawable balance</b>.`,`打开<b>提现</b>页面，查看<b>可提现余额</b>。`],[`Choose the withdrawal method and currency.`,`选择提现方式与币种。`],[`Enter the amount and submit.`,`输入金额并提交。`],[`Note the <b>withdrawal ID</b>. Its status shows progress.`,`记录<b>提现单号</b>，可通过其状态查看进度。`]]),
N(`tip`,`Submit on a working day. Requests made on weekends or public holidays are processed on the next working day.`,`建议在工作日提交。周末与公共假期提交的申请会在下一个工作日处理。`)],
r:[`arrive-time`,`add-method`,`cant-withdraw`]},

{id:`arrive-time`,c:`money`,ty:`faq`,u:`2026-09-08`,
t:[`When will my withdrawal arrive?`,`提现多久到账？`],
s:[`On working days, PayPal and Skrill usually take 24 to 48 hours and bank transfer takes 3 to 5 days.`,`工作日提交时，PayPal 与 Skrill 通常 24–48 小时到账，银行转账需 3–5 天。`],
k:`how long processing time arrival payout days 到账时间 多久 几天 处理时间`,
a:[`Track a withdrawal`,`查看提现进度`],
b:[T([[`Submitted`,`提交时间`],[`PayPal / Skrill`,`PayPal / Skrill`],[`Bank transfer`,`银行转账`]],[[[`Working day`,`工作日`],[`24–48 hours`,`24–48 小时`],[`3–5 days`,`3–5 天`]],[[`Weekend`,`周末`],[`Usually Monday or Tuesday`,`通常周一或周二`],[`Around Thursday`,`预计周四前后`]]]),
P(`Public holidays and payment-gateway maintenance add time. Requests are processed on normal business days.`,`公共假期与支付渠道维护会延长时间，申请将在正常工作日处理。`)],
r:[`not-arrived`,`withdraw-steps`,`cant-withdraw`]},

{id:`not-arrived`,c:`money`,ty:`fix`,u:`2026-11-03`,
t:[`My withdrawal hasn't arrived`,`提现一直没有到账怎么办？`],
s:[`First compare the normal arrival time with your submission date. If it is overdue, check the withdrawal status and whether your payment provider is waiting for you to accept the payment.`,`先对照正常到账时间与提交日期。如已超时，请查看提现状态，并确认支付机构是否在等待你接收款项。`],
k:`not received missing delayed payout masspay deposited 未到账 没收到 延迟 提现没到`,
a:[`Check withdrawal status`,`查看提现状态`],
b:[T([[`What you see`,`现象`],[`Cause`,`原因`],[`What to do`,`处理方式`]],[
[[`Submitted on a weekend or holiday`,`周末或假期提交`],[`Processed on working days only`,`仅在工作日处理`],[`Wait until the next working day`,`等待下一个工作日`]],
[[`PayPal shows “MassPay”`,`PayPal 显示“MassPay”`],[`Payment is waiting for acceptance`,`款项等待接收`],[`Log in to PayPal and accept it`,`登录 PayPal 接收款项`]],
[[`Status stays “Processing” past the normal time`,`超过正常时间仍为“处理中”`],[`Technical issue with the payment method`,`支付渠道出现技术问题`],[`Contact support to cancel, then use another method`,`联系客服取消后改用其他渠道`]],
[[`Status is “Failure”`,`状态为“失败”`],[`Request failed; amount returned to balance`,`申请失败，金额已退回余额`],[`Fix the account and withdraw again`,`修正收款账户后重新提现`]]]),
N(`note`,`When you contact support, include the withdrawal ID, method and submission date.`,`联系客服时请提供提现单号、提现方式与提交日期。`)],
r:[`arrive-time`,`cant-withdraw`,`add-method`]},

{id:`cant-withdraw`,c:`money`,ty:`fix`,u:`2026-11-03`,
t:[`Why can't I withdraw my balance?`,`为什么我的余额无法提现？`],
s:[`Either the funds are still inside a warranty period, or the request failed because of account details, available balance or the payment gateway. A failed amount always returns to your balance.`,`要么款项仍在保修期内，要么申请因账户信息、可用余额或支付渠道问题而失败。失败金额会自动退回余额。`],
k:`cannot submit withdrawal failed cancelled error abnormal payment request 无法提现 提现失败 提现被取消 不能提交 异常`,
a:[`Open Withdraw page`,`前往提现页面`],
b:[H(`The amount is not withdrawable yet`,`金额暂不可提现`),
P(`Order amounts unlock only after the warranty period ends without an open issue. Frozen orders stay locked until the claim is resolved.`,`订单款项需在保修期结束且无未解决问题后才可提现。被冻结订单在申诉解决前保持锁定。`),
H(`The withdrawal failed or was cancelled`,`提现失败或被取消`),
T([[`Cause`,`原因`],[`Fix`,`解决办法`]],[
[[`Incorrect account information`,`收款账户信息有误`],[`Update the details, then withdraw again`,`更正信息后重新提现`]],
[[`Payment account not verified, or restricted in your country`,`收款账户未认证，或在你所在国家受限`],[`Verify it with the provider or use another method`,`在支付机构完成认证，或更换渠道`]],
[[`Insufficient available balance`,`可用余额不足`],[`Lower the amount or withdraw in another currency`,`调整金额或更换币种提现`]],
[[`Technical issue with the payment gateway`,`支付渠道技术问题`],[`Withdraw again; it is processed on the normal schedule`,`重新提交，将按正常周期处理`]]]),
N(`tip`,`A failed withdrawal ID changes to “Failure” and the amount goes back to your iGV balance automatically.`,`提现失败后，该提现单状态会变为“失败”，金额自动退回 iGV 余额。`)],
r:[`when-withdraw`,`not-arrived`,`order-frozen`]},

/* ---------- after ---------- */
{id:`warranty-issue`,c:`after`,ty:`guide`,u:`2026-10-06`,
t:[`A buyer reported a problem during the warranty period`,`保修期内买家反馈商品有问题，如何处理？`],
s:[`Reply in the order before the deadline in the notice and help fix the problem. If the issue comes from the seller side, you are responsible for resolving it.`,`在通知注明的时限内于订单中回复并协助解决。凡因卖家原因导致的问题，由卖家负责处理。`],
k:`warranty claim after sale account recovered problem 保修 售后 找回 账号被找回 问题`,
a:[`Open after-sales orders`,`前往售后订单`],
b:[S([[`Read the buyer's claim and the deadline in the iGV email or order notice.`,`查看买家申诉内容，以及 iGV 邮件或订单通知中的处理时限。`],[`Reply in the order message system with what you found.`,`通过订单消息系统回复你的核实结果。`],[`Fix it: replace, re-deliver or restore access, depending on the product.`,`解决问题：根据商品类型进行更换、补发或恢复账号访问。`],[`Attach proof of the fix to the order.`,`将处理结果的凭证上传到订单。`]]),
N(`warn`,`Ignoring a claim does not make it go away. If you do not respond by the deadline, iGV may treat the claim as accepted.`,`不回复并不会让申诉消失。若未在时限内回应，平台可视为你已接受该申诉。`)],
r:[`dispute`,`missed-deadline`,`warranty-setting`]},

{id:`dispute`,c:`after`,ty:`guide`,u:`2026-10-06`,
t:[`How do I handle a buyer dispute?`,`如何处理买家争议？`],
s:[`Talk to the buyer first. If that fails, respond in the iGV Order Dispute Resolution System within 72 hours of the claim and attach your delivery proof.`,`先与买家沟通。若无法解决，请在对方提出申诉后 72 小时内，通过 iGV 订单争议处理系统回应并提交交付凭证。`],
k:`dispute claim complaint refund chargeback conflict 争议 纠纷 申诉 退款 投诉`,
a:[`Open dispute centre`,`前往争议处理`],
b:[S([[`<b>Contact the buyer</b> in the order messages. iGV recommends resolving it directly first.`,`通过订单消息<b>联系买家</b>。平台建议优先由双方直接协商解决。`],[`<b>Respond within 72 hours</b> of the buyer's claim in the Order Dispute Resolution System.`,`在买家提出申诉后 <b>72 小时内</b>，通过订单争议处理系统作出回应。`],[`<b>Attach proof:</b> before/after screenshots, order messages, video if you have it.`,`<b>提交凭证：</b>交易前后截图、订单消息记录、录屏（如有）。`],[`If you still disagree, the case goes to <b>iGV arbitration</b>.`,`若仍无法达成一致，案件将进入 <b>iGV 仲裁</b>。`]]),
N(`warn`,`Only the Order Dispute Resolution System counts. Disputes raised through email, chat or other channels are not valid.`,`仅订单争议处理系统内的操作有效。通过邮件、聊天或其他渠道提出的争议不被受理。`)],
r:[`arbitration`,`evidence`,`missed-deadline`]},

{id:`arbitration`,c:`after`,ty:`rule`,u:`2026-10-06`,
t:[`How does iGV arbitration decide a dispute?`,`iGV 仲裁如何判定争议？`],
s:[`The Arbitration Committee decides whether the order was delivered, mainly from the delivery evidence. Its decision is final and cannot be appealed.`,`仲裁委员会主要依据交付凭证判定订单是否完成交付。仲裁结果为最终结果，不可再申诉。`],
k:`arbitration committee final decision ruling refund fine 仲裁 判定 裁决 最终结果`,
b:[H(`Possible outcomes`,`可能的结果`),
U([[`<b>Delivery confirmed:</b> you receive the order amount minus transaction fees.`,`<b>判定已交付：</b>你将收到扣除交易费用后的订单款项。`],[`<b>Delivery not confirmed:</b> the buyer is refunded as the Committee decides.`,`<b>判定未交付：</b>按仲裁委员会的决定向买家退款。`],[`<b>Refund caused by a seller error:</b> you also pay a fine of 10% of the refunded amount.`,`<b>因卖家过错导致退款：</b>你还需支付退款金额 10% 的罚金。`]]),
N(`tip`,`Arbitration can only use what is on record. Proof you did not upload cannot help you.`,`仲裁只能依据已留存的记录。没有上传的凭证无法为你提供支持。`)],
r:[`dispute`,`evidence`,`penalty-types`]},

{id:`order-frozen`,c:`after`,ty:`fix`,u:`2026-09-19`,p:1,
t:[`Why is my order frozen?`,`为什么我的订单被冻结了？`],
s:[`An order is frozen while a buyer claim or platform review is open. The order amount cannot be withdrawn until it is resolved.`,`存在买家申诉或平台审核时，订单会被冻结。问题解决前，该订单款项无法提现。`],
k:`frozen abnormal hold locked order 冻结 订单异常 被锁定`,
a:[`View frozen orders`,`查看冻结订单`],
b:[S([[`Open the order and read the reason and deadline.`,`打开订单，查看冻结原因与处理时限。`],[`If it is a buyer claim, respond with your proof before the deadline.`,`如为买家申诉，请在时限内提交凭证并回应。`],[`If no reason is shown, contact support with the order ID.`,`如未显示原因，请携带订单号联系客服。`]]),
P(`The order is released when the claim is closed in your favour or the review ends.`,`申诉以你方胜出结案或审核结束后，订单即解除冻结。`)],
r:[`dispute`,`cant-withdraw`,`order-status`]},

{id:`missed-deadline`,c:`after`,ty:`faq`,u:`2026-08-27`,
t:[`What happens if I don't reply to a claim in time?`,`没有在时限内回复申诉会怎样？`],
s:[`iGV may treat the buyer's claim as accepted, which usually means a refund to the buyer and, if the seller is at fault, a fine.`,`平台可视为你已接受买家申诉，通常意味着向买家退款；若责任在卖家，还会产生罚金。`],
k:`deadline no response timeout claim accepted 逾期 未回复 超时未处理 默认`,
b:[U([[`Every iGV message that needs action states its own deadline.`,`每条需要处理的 iGV 通知都会注明处理时限。`],[`Notices go to your registered email. Make sure they are not filtered as spam.`,`通知发送到注册邮箱，请确保不会被判为垃圾邮件。`],[`Away for a while? Take your listings offline first so no new orders or claims arrive.`,`需要离开一段时间？请先下架商品，避免产生新订单或申诉。`]])],
r:[`dispute`,`no-code`,`arbitration`]},

/* ---------- level ---------- */
{id:`seller-level`,c:`level`,ty:`faq`,u:`2026-10-30`,p:1,
t:[`How do seller levels work, and what are the benefits?`,`卖家等级如何计算？有哪些权益？`],
s:[`Your level reflects your selling record on iGV. Your current level, the requirements for the next one and your benefits are shown on the Seller Level page.`,`卖家等级反映你在 iGV 的经营表现。当前等级、下一等级的要求以及对应权益，均显示在卖家等级页面。`],
k:`level rank tier benefits upgrade downgrade privileges 等级 升级 降级 权益 特权`,
a:[`Open Seller Level page`,`前往卖家等级页面`],
b:[H(`What usually moves your level`,`哪些因素会影响等级`),
U([[`Completed orders and sales volume.`,`已完成订单数与销售额。`],[`On-time delivery.`,`按时交付表现。`],[`Disputes lost and penalties received.`,`争议败诉与受处罚情况。`],[`Buyer feedback.`,`买家评价。`]]),
N(`note`,`Demo placeholder: level names, thresholds and benefits must be filled in from the live level rules before publishing.`,`演示占位：等级名称、升级门槛与具体权益需依据线上等级规则补充后再发布。`)],
r:[`feedback-rules`,`penalty-types`,`verification-method`]},

{id:`feedback-rules`,c:`level`,ty:`rule`,u:`2026-08-14`,
t:[`What feedback practices are not allowed?`,`哪些评价行为是不允许的？`],
s:[`You may not manipulate feedback: no fake orders for ratings, no rewards for removing negative reviews, and no abuse or contact details in feedback text.`,`禁止操纵评价：不得刷单获取好评，不得以利益换取删除差评，评价内容不得包含辱骂或联系方式。`],
k:`feedback review rating fake manipulate 评价 好评 差评 刷单 刷好评`,
b:[U([[`Placing or arranging fake orders to raise your rating.`,`通过虚假订单提升评分。`],[`Offering money, discounts or goods in exchange for removing or changing feedback.`,`以金钱、折扣或商品换取删除、修改评价。`],[`Profanity, personal contact details or text that steers buyers off the platform.`,`在评价中使用粗俗语言、留下个人联系方式或引导站外交易。`]]),
N(`warn`,`Violating content is removed, and the account may be suspended or permanently closed.`,`违规内容将被删除，账号可能被暂停或永久关闭。`)],
r:[`bad-review`,`prohibited`,`penalty-types`]},

{id:`bad-review`,c:`level`,ty:`guide`,u:`2026-08-14`,p:1,
t:[`I received an unfair review. Can it be removed?`,`收到不公正的评价，可以删除吗？`],
s:[`Feedback is removed only when it breaks the feedback rules. Report it to support with the order ID; do not negotiate removal with the buyer.`,`仅当评价本身违反评价规则时才会被删除。请携带订单号向客服举报，不要与买家私下协商删除。`],
k:`negative review remove unfair report feedback 差评 恶意评价 删除评价 举报`,
a:[`Open my feedback`,`查看我的评价`],
b:[S([[`Check whether the feedback contains abuse, contact details or off-platform steering.`,`确认评价是否包含辱骂、联系方式或站外引导内容。`],[`Contact support with the order ID and the reason it breaks the rules.`,`联系客服，提供订单号并说明违规原因。`],[`Reply to the buyer politely in the order if there is a real problem to fix.`,`如确有问题需要解决，请在订单中礼貌回复买家。`]]),
N(`warn`,`Offering a refund or gift to delete a review is itself a violation.`,`以退款或赠品换取删除评价，本身就属于违规行为。`)],
r:[`feedback-rules`,`dispute`,`seller-level`]},

/* ---------- rules ---------- */
{id:`prohibited`,c:`rules`,ty:`rule`,u:`2026-09-22`,
t:[`What is not allowed on iGV?`,`iGV 禁止哪些行为？`],
s:[`Off-site trading, fraud including false delivery confirmation, harassment, and feedback manipulation. All trade and communication must stay on iGV.`,`站外交易、欺诈（含虚假确认交付）、骚扰以及操纵评价。所有交易与沟通都必须在 iGV 平台内完成。`],
k:`prohibited forbidden banned actions off-site private trade fraud harassment 禁止 违规行为 站外交易 私下交易 欺诈 骚扰`,
b:[T([[`Behaviour`,`行为`],[`Examples`,`示例`]],[
[[`Off-site or private trading`,`站外或私下交易`],[`Sharing contact details to finish a trade outside iGV`,`提供联系方式，引导在平台外完成交易`]],
[[`Fraud`,`欺诈`],[`Confirming delivery that did not happen`,`未实际交付即确认交付`]],
[[`Harassment`,`骚扰`],[`Threats or abusive language in chat`,`在聊天中威胁或辱骂`]],
[[`Feedback manipulation`,`操纵评价`],[`Fake orders; rewards for removing reviews`,`刷单；以利益换取删除评价`]],
[[`Pressuring buyers`,`向买家施压`],[`Asking a buyer to cancel; requesting unnecessary account information`,`要求买家取消订单；索取不必要的账号信息`]]]),
N(`warn`,`Serious fraud may be reported to government authorities.`,`严重欺诈行为可能被移交政府主管机关。`)],
r:[`penalty-types`,`feedback-rules`,`agreement`]},

{id:`penalty-types`,c:`rules`,ty:`rule`,u:`2026-09-22`,
t:[`What happens if I receive a violation penalty?`,`收到违规处罚后会发生什么？`],
s:[`Depending on severity: a written warning, a fine taken from your security deposit, order cancellation, suspension, or permanent termination. The notice states which applies and why.`,`根据严重程度，可能是书面警告、从保证金中扣除罚金、取消订单、暂停账号或永久终止合作。处罚通知会说明适用的措施与原因。`],
k:`penalty violation punishment fine suspension ban deposit 处罚 违规 罚款 封号 保证金 暂停`,
a:[`View penalty records`,`查看处罚记录`],
b:[T([[`Measure`,`措施`],[`Effect on you`,`对你的影响`]],[
[[`Written warning`,`书面警告`],[`Recorded on your account`,`记录在账号中`]],
[[`Fine`,`罚金`],[`Deducted from your security deposit`,`从保证金中扣除`]],
[[`Cancelled quotes or orders`,`取消报价或订单`],[`Payment is returned to the buyer`,`款项退回买家`]],
[[`Suspension`,`暂停账号`],[`You cannot sell during the period`,`期间无法销售`]],
[[`Permanent termination`,`永久终止`],[`Account closed; market credits cancelled`,`账号关闭，平台积分取消`]]]),
H(`What to do when you get a notice`,`收到处罚通知后怎么做`),
S([[`Read which order and which rule the notice refers to.`,`确认通知所指的订单与对应规则。`],[`If you agree, fix the cause (stock, delivery time, communication).`,`如无异议，请整改问题根源（库存、交付时效、沟通方式）。`],[`If you disagree, appeal with evidence.`,`如有异议，请提交证据进行申诉。`]])],
r:[`late-penalty`,`appeal`,`prohibited`]},

{id:`late-penalty`,c:`rules`,ty:`rule`,u:`2026-10-12`,

const strip=s=>s.replace(/<[^>]+>/g,``);
const fmtDate=d=>lang===`zh`?d.replace(/(\d+)-(\d+)-(\d+)/,(m,y,mo,da)=>`${y}年${+mo}月${+da}日`):new Date(d+`T00:00:00`).toLocaleDateString(`en-GB`,{day:`numeric`,month:`short`,year:`numeric`});

/* ---- search ---- */
const STOP=new Set(`how do does i my the a an to is are can what why when will of on in for it me and or with 怎么 如何 为什么 什么 可以 我的 怎么办 哪些`.split(` `));
function terms(s){s=s.toLowerCase().trim();const out=[];
  (s.match(/[a-z0-9%€$]+|[一-鿿]+/g)||[]).forEach(w=>{
    if(/[一-鿿]/.test(w)){if(w.length<=2){out.push(w)}else{for(let i=0;i<w.length-1;i++)out.push(w.slice(i,i+2))}}
    else if(!STOP.has(w)&&w.length>1)out.push(w.length>4?w.replace(/(ing|ed|s)$/,``):w)});
  return [...new Set(out.filter(x=>!STOP.has(x)))]}
const bodyText=(a,i)=>a.b.map(b=>{const k=b[0];if(k===`steps`||k===`list`)return b[1].map(x=>x[i]).join(` `);if(k===`table`)return b[1].map(x=>x[i]).join(` `)+` `+b[2].map(r=>r.map(c=>c[i]).join(` `)).join(` `);return b[i+1]}).join(` `);
ARTS.forEach(a=>{a._t=(a.t[0]+` `+a.t[1]).toLowerCase();a._k=a.k.toLowerCase();a._s=(a.s[0]+` `+a.s[1]).toLowerCase();a._b=strip(bodyText(a,0)+` `+bodyText(a,1)).toLowerCase()});
function search(query){const ts=terms(query);if(!ts.length)return[];
  return ARTS.map(a=>{let sc=0,hit=0;ts.forEach(x=>{let s=0;if(a._t.includes(x))s+=6;if(a._k.includes(x))s+=4;if(a._s.includes(x))s+=2;if(a._b.includes(x))s+=1;if(s){hit++;sc+=s}});
    return{a,sc,hit}}).filter(r=>r.hit/ts.length>=.5&&r.sc>=3).sort((x,y)=>y.hit-x.hit||y.sc-x.sc).map(r=>r.a)}
function hl(text,query){let out=esc(text);const ts=terms(query).sort((a,b)=>b.length-a.length);if(!ts.length)return out;
  const re=new RegExp(`(`+ts.map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,`\\$&`)).join(`|`)+`)`,`gi`);return out.replace(re,`<mark>$1</mark>`)}

${a.a?`<div class="act"><span>${t(`actL`)}</span><button class="btn" data-act="toast" data-msg="${esc(t(`demoGo`)+L(a.a))}">${esc(L(a.a))} →</button></div>`:``}
<div class="fb" id="fb">${fbHTML(a.id)}</div>
<div class="rel"><h3>${t(`rel`)}</h3><ul>${a.r.map(r=>`<li><a href="#a-${r}"><span>${esc(L(A(r).t))}</span>${tag(A(r).ty)}</a></li>`).join(``)}</ul></div>
</article>
${hs.length?`<aside class="side tocw"><h4>${t(`onPage`)}</h4><div class="toc">${hs.map((h,i)=>`<button data-act="scroll" data-v="sec-${i}">${L([h[1],h[2]])}</button>`).join(``)}</div></aside>`:``}
</div></main>`+foot()}

function noRes(){return `<div class="panel noresult"><h2>${t(`nrT`)} “${esc(q)}”</h2><ul>${UI.nrTips.map(x=>`<li>${L(x)}</li>`).join(``)}</ul>
<p><b>${t(`nrTry`)}</b></p><div class="chips" style="margin:0 0 16px">${CHIPS.map(c=>`<button class="chip" data-act="chip" data-v="${esc(L(c))}">${esc(L(c))}</button>`).join(``)}</div>
<p><b>${t(`nrBrowse`)}</b></p><div class="chips" style="margin:0 0 18px">${CATS.map(c=>`<a class="chip" href="#c-${c.id}">${esc(L(c.n))}</a>`).join(``)}</div>
<button class="btn" data-act="contact">${t(`ctB`)}</button></div>`}
function vSearch(){const all=search(q);const list=sf===`all`?all:all.filter(a=>a.ty===sf);
  return bar(false)+`<main class="wrap"><nav class="crumbs" aria-label="Breadcrumb"><a href="#home">${t(`home`)}</a><span>/</span><b>${t(`go`)}</b></nav>
${searchBox(false)}
<div style="margin-top:18px">${!q.trim()?`<div class="panel empty">${t(`emptyQ`)}</div>`:!all.length?noRes():`<div class="pagehead"><p>${t(`resFor`)} <b style="color:var(--ink)">“${esc(q)}”</b> · ${all.length} ${t(`nRes`)}</p></div>${typeFilters(sf,`sf`,all)}
<div class="panel alist">${list.map(a=>row(a,q)).join(``)}</div><section>${contactPanel()}</section>`}</div></main>`+foot()}
const v404=()=>bar(true)+`<main class="wrap"><div class="panel empty" style="margin-top:28px">${t(`notFound`)} <a href="#home">${t(`home`)}</a></div></main>`;

/* ---- contact modal ---- */
function modalHTML(){if(!modal)return ``;const m=modal;let inner=``;
  if(m.step===1)inner=`<h2 id="dlg-t">${t(`m1T`)}</h2><p>${t(`m1P`)}</p><div class="opts">${CATS.map(c=>`<button data-act="mcat" data-v="${c.id}">${esc(L(c.n))}</button>`).join(``)}</div><div class="ft"><span></span><button class="btn ghost" data-act="mclose">${t(`close`)}</button></div>`;
  if(m.step===2){const as=ARTS.filter(a=>a.c===m.cat).sort((a,b)=>(b.ty===`fix`)-(a.ty===`fix`)).slice(0,4);
    inner=`<h2 id="dlg-t">${t(`m2T`)}</h2><p>${esc(L(C(m.cat).n))} · ${t(`m2P`)}</p><div class="rows">${as.map(a=>`<a href="#a-${a.id}" data-act="mclose-nav"><span class="ti">${esc(L(a.t))}</span>${tag(a.ty)}</a>`).join(``)}</div><div class="ft"><button class="btn ghost" data-act="mback">${t(`back`)}</button><button class="btn" data-act="mform">${t(`m2B`)}</button></div>`}
  if(m.step===3)inner=`<h2 id="dlg-t">${t(`m3T`)}</h2><p>${esc(L(C(m.cat).n))} · ${t(`m3P`)}</p><form data-mf><label for="m-id">${t(`fId`)}</label><input id="m-id" type="text" autocomplete="off"><label for="m-desc">${t(`fDesc`)}</label><textarea id="m-desc"></textarea><div class="err" id="m-err"></div><div class="ft"><button type="button" class="btn ghost" data-act="mback">${t(`back`)}</button><button type="submit" class="btn">${t(`submit`)}</button></div></form>`;
  if(m.step===4)inner=`<h2 id="dlg-t">✓ ${t(`m4T`)}</h2><p>${t(`m4P`)}</p><div class="ft"><span></span><button class="btn" data-act="mclose">${t(`close`)}</button></div>`;
  return `<div class="ov" data-act="mov"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlg-t">${inner}</div></div>`}
function drawModal(){ROOT.getElementById(`modal`).innerHTML=modalHTML();const f=ROOT.querySelector(`.dlg button, .dlg input`);if(f)f.focus()}

/* ---- router ---- */
function cur(){const h=HH;if(h.startsWith(`c-`))return{v:`cat`,id:h.slice(2)};if(h.startsWith(`a-`))return{v:`art`,id:h.slice(2)};if(h===`search`)return{v:`search`};return{v:h===`home`||!h?`home`:`404`}}
function render(keep){const r=cur();
  ROOT.getElementById(`app`).innerHTML=r.v===`home`?vHome():r.v===`cat`?vCat(r.id):r.v===`art`?vArt(r.id):r.v===`search`?vSearch():v404();
  if(modal)drawModal();if(!keep)window.scrollTo(0,0)}
function nav(h){HH=h||`home`;const r=cur();if(r.v===`cat`)tf=`all`;if(r.v===`search`)sf=`all`;render()}
function goSearch(v){q=v;sf=`all`;if(cur().v===`search`)render();else nav(`search`)}
let toastT;function toast(msg){const el=ROOT.getElementById(`toast`);el.textContent=msg;el.classList.add(`on`);clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove(`on`),2600)}

ROOT.addEventListener(`input`,e=>{const inp=e.target.closest(`[data-q]`);if(!inp)return;const box=inp.closest(`.search`).querySelector(`.sug`);const v=inp.value.trim();
  if(v.length<2){box.innerHTML=``;return}const res=search(v).slice(0,5);
  box.innerHTML=res.map(a=>`<a href="#a-${a.id}"><span style="flex:1;min-width:0">${hl(L(a.t),v)}</span>${tag(a.ty)}</a>`).join(``)+`<a href="#search" class="all" data-act="sugall" data-v="${esc(v)}">${t(`seeAll`)} “${esc(v)}” →</a>`});
ROOT.addEventListener(`submit`,e=>{e.preventDefault();const f=e.target;
  if(f.matches(`[data-sf]`)){goSearch(f.querySelector(`input`).value.trim())}
  if(f.matches(`[data-mf]`)){const d=f.querySelector(`#m-desc`).value.trim();if(d.length<10){f.querySelector(`#m-err`).textContent=t(`fErr`);f.querySelector(`#m-desc`).focus();return}modal.step=4;drawModal()}});
ROOT.addEventListener(`keydown`,e=>{if(e.key===`Escape`){if(modal){modal=null;drawModal()}ROOT.querySelectorAll(`.sug`).forEach(s=>s.innerHTML=``)}});
ROOT.addEventListener(`click`,e=>{
  if(!e.target.closest(`.search`))ROOT.querySelectorAll(`.sug`).forEach(s=>s.innerHTML=``);
  const el=e.target.closest(`[data-act]`);if(!el)return;const act=el.dataset.act,v=el.dataset.v;const art=(ROOT.querySelector(`[data-art]`)||{dataset:{}}).dataset.art;
  const refb=()=>{ROOT.getElementById(`fb`).innerHTML=fbHTML(art)};
  switch(act){
    case`lang`:lang=v;try{localStorage.setItem(`igv-help-lang`,v)}catch(x){}render(true);break;
    case`toast`:toast(el.dataset.msg);break;
    case`chip`:goSearch(v);break;
    case`sugall`:e.preventDefault();goSearch(v);break;
    case`stage`:stage=v;render(true);break;
    case`tf`:tf=v;render(true);break;
    case`sf`:sf=v;render(true);break;
    case`scroll`:{const n=ROOT.getElementById(v);if(n)n.scrollIntoView({behavior:matchMedia(`(prefers-reduced-motion:reduce)`).matches?`auto`:`smooth`,block:`start`})}break;
    case`fby`:fb[art]={v:`yes`};refb();break;
    case`fbn`:fb[art]={v:`no`};refb();break;
    case`fbr`:fb[art].reason=v;{const tx=ROOT.getElementById(`fb-text`).value;refb();ROOT.getElementById(`fb-text`).value=tx}break;
    case`fbsend`:fb[art].text=ROOT.getElementById(`fb-text`).value;fb[art].sent=true;refb();break;
    case`contact`:modal=el.dataset.cat?{step:2,cat:el.dataset.cat}:{step:1};drawModal();break;
    case`mcat`:modal={step:2,cat:v};drawModal();break;
    case`mform`:modal.step=3;drawModal();break;
    case`mback`:modal.step-=1;drawModal();break;
    case`mclose`:modal=null;drawModal();break;
    case`mclose-nav`:modal=null;drawModal();break;
    case`mov`:if(e.target===el){modal=null;drawModal()}break;
  }});
ROOT.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(!a)return;e.preventDefault();if(a.dataset.act==='sugall')return;nav(a.getAttribute('href').slice(1))});
IGV.onLang(l=>{lang=l;render(true)});

})();
}catch(e){console.error('module help failed',e)}
</script>

<script>IGV._start();</script>
</body>
</html>
