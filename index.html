<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iGVault 卖家后台 Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: fixed left navigation + sticky top bar; each prototype module is mounted in its own shadow root inside .sh-main.
   Single light theme by request (white surfaces, blue accent). */
:root{
  --t-bg:#f4f7fc;--t-surface:#ffffff;--t-surface2:#f6f9fe;--t-line:#e2e8f2;--t-line2:#cbd5e6;--t-ink:#152033;--t-ink2:#56627a;--t-ink3:#8691a6;--t-blue:#1f5eff;--t-blueD:#1a4fd8;--t-blueSoft:#e9f0ff;--t-blueInk:#1746c4;--t-ok:#177f4f;--t-okSoft:#e5f5ec;--t-warn:#a45a00;--t-warnSoft:#fff3df;--t-bad:#c5302c;--t-badSoft:#fdecea;--t-shadow:0 10px 30px rgba(21,32,51,.14);--t-font:"IBM Plex Sans","PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;--t-display:"Manrope","IBM Plex Sans","PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --side-w:216px; --top-h:56px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--t-bg);color:var(--t-ink);font:14px/1.5 var(--t-font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--t-blue);outline-offset:2px}
.sh-top{position:sticky;top:0;z-index:30;height:var(--top-h);background:var(--t-surface);border-bottom:1px solid var(--t-line);display:flex;align-items:center;gap:14px;padding:0 20px}
.sh-logo{display:flex;align-items:center;gap:9px;font:800 18px var(--t-display);letter-spacing:-.01em;white-space:nowrap}
.sh-logo i{width:28px;height:28px;border-radius:8px;background:var(--t-blue);color:#fff;display:grid;place-items:center;font:800 12px var(--t-display);font-style:normal}
.sh-logo em{font-style:normal;color:var(--t-blue)}
.sh-logo small{font:500 12px var(--t-font);color:var(--t-ink3);margin-left:2px}
.sh-right{margin-left:auto;display:flex;align-items:center;gap:14px;min-width:0}
.sh-ban{display:flex;align-items:center;gap:8px 20px;flex-wrap:wrap;margin:-20px -24px 16px;padding:11px 24px;font-size:13.5px;border-bottom:1px solid}
.sh-ban[hidden],.sh-banhome[hidden],.sh-demo[hidden]{display:none}
.sh-ban b{font-weight:700}.sh-ban span{flex:1;min-width:200px}
.sh-ban.nosell{background:#fff4de;border-color:#f0d49a;color:#7a4d00}
.sh-ban.banned{background:#fdecec;border-color:#f3c1c1;color:#8f1f1f}
.sh-ban button,.sh-banhome button{background:var(--t-blue);color:#fff;border:0;border-radius:7px;padding:6px 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.sh-ban button:hover,.sh-banhome button:hover{background:var(--t-blueD)}
.sh-banhome h1{font-size:22px;margin:4px 0 16px;color:var(--t-ink)}
.sh-banhome .box{background:#fff8f8;border:1px solid #f3c1c1;border-radius:12px;padding:22px 24px;max-width:1080px}
.sh-banhome .box b{display:block;font-size:16px;color:var(--t-ink);margin-bottom:8px}
.sh-banhome .box p{margin:0 0 16px;color:var(--t-ink);font-size:14px}
.sh-banhome button{padding:9px 18px;font-size:14px}
.sh-demo{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;width:fit-content;max-width:100%;margin:0 0 14px;padding:6px 12px;border:1px dashed #b9c9ee;background:#f7faff;border-radius:8px;font-size:12px;color:var(--t-ink2)}
.sh-demo .tag{font-weight:600;color:#1746c4;white-space:nowrap}
.sh-demo label{display:flex;align-items:center;gap:6px;white-space:nowrap}
.sh-demo select{font:inherit;font-size:12px;font-weight:500;color:var(--t-ink);background:#fff;border:1px solid var(--t-line);border-radius:6px;padding:3px 6px;max-width:230px}
.sh-demo button{font:inherit;font-size:12px;color:#1746c4;background:#fff;border:1px solid #b9c9ee;border-radius:6px;padding:3px 9px;cursor:pointer}
.sh-demo button:hover{background:var(--t-blueSoft)}
.sh-demo .hint{color:var(--t-ink3);white-space:normal}
#shNav [hidden]{display:none!important}
.sh-msg [hidden]{display:none!important}
.sh-demo .lab{white-space:nowrap}
.sh-acct{position:relative}
.sh-store{display:flex;align-items:center;gap:8px;color:var(--t-ink2);font:inherit;font-size:13px;white-space:nowrap;background:none;border:1px solid transparent;border-radius:8px;padding:5px 8px;cursor:pointer}
.sh-store:hover,.sh-store[aria-expanded="true"]{background:var(--t-bg);border-color:var(--t-line)}
.sh-store .ava{width:24px;height:24px;border-radius:50%;background:var(--t-blue);color:#fff;display:grid;place-items:center;font-style:normal;font-weight:600;font-size:12px}
.sh-menu{position:absolute;right:0;top:calc(100% + 6px);min-width:200px;background:#fff;border:1px solid var(--t-line);border-radius:10px;box-shadow:0 10px 30px rgba(21,32,51,.14);padding:6px;z-index:60}
.sh-menu .who{padding:8px 10px 10px;border-bottom:1px solid var(--t-line);margin-bottom:6px;font-size:12px;color:var(--t-ink2)}
.sh-menu .who b{display:block;color:var(--t-ink);font-size:13.5px}
.sh-menu button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:8px 10px;font:inherit;font-size:13.5px;color:var(--t-ink);cursor:pointer}
.sh-menu button:hover{background:var(--t-bg)}
.sh-menu button.out{color:#c62f2f}
.sh-out{position:fixed;inset:0;z-index:200;background:var(--t-bg);display:grid;place-items:center;padding:24px}
.sh-out[hidden]{display:none}
.sh-out .box{background:#fff;border:1px solid var(--t-line);border-radius:14px;padding:32px 36px;max-width:380px;width:100%;text-align:center;box-shadow:0 10px 30px rgba(21,32,51,.08)}
.sh-out h2{margin:14px 0 6px;font-size:19px;color:var(--t-ink)}
.sh-out p{margin:0 0 20px;color:var(--t-ink2);font-size:13.5px}
.sh-out button{background:var(--t-blue);color:#fff;border:0;border-radius:8px;padding:10px 22px;font:inherit;font-weight:600;cursor:pointer}
.sh-out button:hover{background:var(--t-blueD)}
.sh-out .lg{font-weight:700;font-size:18px;color:var(--t-ink)}.sh-out .lg em{font-style:normal;color:var(--t-blue)}
.sh-store b{color:var(--t-ink);font-weight:600}
.sh-store>span{background:var(--t-blueSoft);color:var(--t-blueInk);border-radius:999px;padding:1px 9px;font-size:12px;font-weight:500}
.sh-lang{display:inline-flex;border:1px solid var(--t-line2);border-radius:8px;overflow:hidden;flex:none}
.sh-lang button{border:0;background:var(--t-surface);padding:5px 12px;font-size:13px;color:var(--t-ink2)}
.sh-lang button+button{border-left:1px solid var(--t-line2)}
.sh-lang button[aria-pressed="true"]{background:var(--t-blue);color:#fff;font-weight:600}
.sh-side{position:fixed;top:var(--top-h);left:0;bottom:0;width:var(--side-w);background:var(--t-surface);border-right:1px solid var(--t-line);padding:14px 10px;overflow:auto;display:flex;flex-direction:column;gap:2px;z-index:25}
.sh-side{gap:0;padding:8px 10px 14px}
.grp-box{padding:10px 0;border-bottom:1px solid var(--t-line);display:flex;flex-direction:column;gap:2px}
.grp-box:last-child{border-bottom:0}
.sh-side .grp{display:flex;align-items:center;gap:10px;padding:7px 12px;color:var(--t-ink);font:700 14px var(--t-display);white-space:nowrap}
.sh-side .grp svg,.sh-side .top svg{color:var(--t-ink2);flex:none}
.sh-side button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;border-radius:8px;padding:8px 12px;color:var(--t-ink2);white-space:nowrap}
.sh-side button:hover{background:var(--t-surface2);color:var(--t-ink)}
.sh-side .top{color:var(--t-ink);font:700 14px var(--t-display)}
.sh-side .sub{padding-left:40px}
.sh-side .on,.sh-side .on:hover{background:var(--t-blueSoft);color:var(--t-blue);font-weight:600}
.sh-side .on svg{color:var(--t-blue)}
.sh-side .off{color:var(--t-ink3)}
.sh-main{margin-left:var(--side-w);padding:20px 24px 0;min-width:0}
.sh-msg{display:flex;gap:6px}
.sh-msg button{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 11px;border:1px solid var(--t-line);border-radius:8px;background:var(--t-surface);color:var(--t-ink2);font-size:13px;white-space:nowrap;position:relative}
.sh-msg button:hover,.sh-msg button[aria-expanded="true"]{border-color:var(--t-blue);color:var(--t-blue);background:var(--t-blueSoft)}
.sh-badge{min-width:17px;height:17px;border-radius:9px;background:var(--t-bad);color:#fff;font:600 11px/17px var(--t-font);text-align:center;padding:0 5px}
.sh-badge:empty{display:none}
.sh-panel{position:fixed;top:var(--top-h);right:0;bottom:0;width:min(400px,100vw);background:var(--t-surface);border-left:1px solid var(--t-line);box-shadow:-10px 0 30px rgba(21,32,51,.12);z-index:36;display:flex;flex-direction:column}
.sh-panel[hidden]{display:none}
.mp-h{display:flex;align-items:center;gap:4px;padding:0 8px 0 12px;border-bottom:1px solid var(--t-line);flex:none}
.mp-h button.tab{border:0;background:none;padding:14px 10px 12px;border-bottom:2px solid transparent;color:var(--t-ink2);font-weight:500;display:inline-flex;gap:6px;align-items:center}
.mp-h button.tab[aria-selected="true"]{color:var(--t-blue);border-bottom-color:var(--t-blue);font-weight:600}
.mp-x{margin-left:auto;border:0;background:none;font-size:20px;color:var(--t-ink3);width:32px;height:32px;border-radius:6px}
.mp-x:hover{background:var(--t-surface2)}
.mp-b{flex:1;overflow:auto;display:flex;flex-direction:column}
.mp-conv{display:grid;grid-template-columns:36px 1fr auto;gap:2px 10px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--t-line);background:none;padding:12px 14px;align-items:center}
.mp-conv:hover{background:var(--t-surface2)}
.mp-av{grid-row:1/3;width:36px;height:36px;border-radius:50%;background:var(--t-blueSoft);color:var(--t-blueInk);display:grid;place-items:center;font-weight:600;font-size:13px}
.mp-conv .sh-badge{justify-self:end}.mp-conv b{font-weight:600}.mp-conv time{color:var(--t-ink3);font-size:12px}
.mp-conv .last{grid-column:2;color:var(--t-ink2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp-th{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--t-line);font-size:13px;flex:none}
.mp-th button{border:1px solid var(--t-line);background:var(--t-surface);border-radius:6px;padding:3px 9px;font-size:13px;color:var(--t-ink2);white-space:nowrap}
.mp-th button:hover{border-color:var(--t-blue);color:var(--t-blue)}
.mp-th .who{flex:1;min-width:0}.mp-th .who b{display:block}.mp-th .who span{color:var(--t-ink3);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp-msgs{flex:1;padding:14px;display:flex;flex-direction:column;gap:10px;overflow:auto}
.mp-m{max-width:82%;padding:8px 11px;border-radius:12px;background:var(--t-surface2);border:1px solid var(--t-line);font-size:13.5px;align-self:flex-start;overflow-wrap:anywhere}
.mp-m.me{align-self:flex-end;background:var(--t-blue);border-color:var(--t-blue);color:#fff}
.mp-m small{display:block;font-size:11px;opacity:.65;margin-top:2px}
.mp-chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 10px}
.mp-chips button{border:1px solid var(--t-line2);background:var(--t-surface);border-radius:999px;padding:3px 11px;font-size:12.5px;color:var(--t-ink2)}
.mp-chips button:hover{border-color:var(--t-blue);color:var(--t-blue)}
.mp-in{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--t-line);flex:none}
.mp-in input{flex:1;min-width:0;height:36px;border:1px solid var(--t-line2);border-radius:8px;padding:0 10px;font:inherit;color:inherit}
.mp-in input:focus{outline:2px solid var(--t-blue);outline-offset:-1px}
.mp-in button{height:36px;border:0;border-radius:8px;background:var(--t-blue);color:#fff;padding:0 14px;font-weight:600}
.mp-note{padding:8px 14px 10px;font-size:12px;color:var(--t-ink3);border-top:1px dashed var(--t-line);flex:none}
.sh-toast{position:fixed;left:50%;top:calc(var(--top-h) + 12px);transform:translateX(-50%);background:var(--t-ink);color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;z-index:90;box-shadow:var(--t-shadow);max-width:calc(100% - 32px)}
@media (max-width:900px){
  :root{--side-w:0px}
  .sh-side{position:static;width:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--t-line);padding:8px 12px;gap:4px}
  .grp-box{flex-direction:row;padding:0;border:0;gap:4px}
  .sh-side button{width:auto;padding:7px 12px}
  .sh-side .grp,.sh-side .off{display:none}
  .sh-side .sub{padding-left:12px}
  .sh-main{padding:16px 16px 0}
  .sh-ban{margin:-16px -16px 14px;padding:10px 16px}
  .sh-store>b,.sh-store>span,.sh-store>svg,.sh-logo small,.sh-msg button span{display:none}
  .sh-store{padding:2px;gap:0}
  .sh-msg button{padding:0 9px}
  .sh-right{gap:8px}
  .sh-top{padding:0 16px}
}
</style>
</head>
<body>
<header class="sh-top">
  <div class="sh-logo"><i>iG</i><span>iG<em>Vault</em></span><small>卖家后台</small></div>
  <div class="sh-right">
    <div class="sh-msg" data-noi18n>
      <button type="button" id="msgBuyers" data-msg="buyers"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h14v9H9l-4 3v-3H3z"/></svg><span id="msgBuyersL"></span><b class="sh-badge" id="msgBadge"></b></button>
      <button type="button" id="msgSupport" data-msg="support"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11V9a6 6 0 0 1 12 0v2M4 11h2v4H5a1 1 0 0 1-1-1zM16 11h-2v4h1a1 1 0 0 0 1-1zM14 15.5c0 1-1.5 1.5-3.5 1.5"/></svg><span id="msgSupportL"></span></button>
    </div>
    <div class="sh-acct" data-noi18n>
      <button type="button" class="sh-store" id="acctBtn" aria-haspopup="menu" aria-expanded="false"><i class="ava">B</i><b>BIT STORE</b><span id="acctTier"></span><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4.5 6 7.5l3-3"/></svg></button>
      <div class="sh-menu" id="acctMenu" role="menu" hidden></div>
    </div>
    <div class="sh-lang" role="group" aria-label="Language / 语言" data-noi18n>
      <button type="button" id="lang-zh" data-lang="zh" data-noi18n aria-pressed="true">中文</button><button type="button" id="lang-en" data-lang="en" data-noi18n aria-pressed="false">EN</button>
    </div>
  </div>
</header>
<div class="sh-out" id="signedOut" hidden data-noi18n role="dialog" aria-modal="true"></div>
<nav class="sh-side" id="shNav" aria-label="卖家后台导航"></nav>
<aside class="sh-panel" id="msgPanel" hidden data-noi18n aria-label="Messages"></aside>
<div class="sh-main" id="shMain">
<div class="sh-ban" id="stBanner" hidden data-noi18n role="status"></div>
<div class="sh-demo" id="demoBar" data-noi18n></div>
<div class="sh-banhome" id="banHome" hidden data-noi18n></div>
<div class="mod" id="m-home" hidden></div>
<div class="mod" id="m-orders" hidden></div>
<div class="mod" id="m-products" hidden></div>
<div class="mod" id="m-listing" hidden></div>
<div class="mod" id="m-reviews" hidden></div>
<div class="mod" id="m-wallet" hidden></div>
<div class="mod" id="m-penalties" hidden></div>
<div class="mod" id="m-data" hidden></div>
<div class="mod" id="m-level" hidden></div>
<div class="mod" id="m-security" hidden></div>
<div class="mod" id="m-help" hidden></div>

</div>
<template id="t-home"><style>:host{display:block;color-scheme:light}:host([hidden]){display:none!important}[hidden]{display:none!important}

:host{
  --bg:#EEF1F5; --surface:#fff; --ink:#152033; --ink2:#4A566B; --ink3:#78839A; --line:#DDE2EA; --line2:#EBEEF3;
  --brand:#2348D8; --brand-ink:#1A37AC; --brand-soft:#E8EDFD;
  --red:#C2301D; --red-soft:#FCECE9; --amber:#A8610A; --amber-soft:#FDF3DF; --green:#1C7847; --green-soft:#E3F4EA;
  --side:#111A2C; --side-ink:#AEB8CC;
  --num:"Bahnschrift","DIN Alternate","Roboto Condensed","Segoe UI Variable Display","SF Pro Display","PingFang SC","Microsoft YaHei UI",sans-serif;
}
*{box-sizing:border-box}:host{background:var(--bg);color:var(--ink);font:14px/1.5 "Segoe UI Variable Text","Segoe UI","SF Pro Text",-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei UI","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
h1,h2,h3,p,ul,ol{margin:0;padding:0}
ul,ol{list-style:none}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:.01em}

/* shell */
.shell{display:grid;grid-template-columns:216px 1fr;grid-template-rows:56px 1fr;min-height:100%}
.top{grid-column:1/3;display:flex;align-items:center;gap:16px;background:var(--surface);border-bottom:1px solid var(--line);padding:0 20px 0 0;position:sticky;top:0;z-index:20}
.brand{width:216px;height:56px;display:flex;align-items:center;gap:10px;padding:0 20px;background:var(--side);color:#fff;flex:none}
.brand b{font:700 20px/1 var(--num);letter-spacing:.02em}
.brand span{font-size:12.5px;color:var(--side-ink);border-left:1px solid #2C3850;padding-left:10px}
.search{flex:1;max-width:380px;position:relative}
.search input{width:100%;height:34px;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:0 12px 0 34px;font:inherit;color:var(--ink)}
.search svg{position:absolute;left:10px;top:9px;color:var(--ink3)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.seg{display:inline-flex;background:var(--bg);border-radius:7px;padding:2px}
.seg button{padding:4px 11px;border-radius:5px;font-size:13px;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(21,32,51,.14)}
.icon-btn{width:34px;height:34px;border-radius:6px;display:grid;place-items:center;color:var(--ink2);position:relative}
.icon-btn:hover{background:var(--bg)}
.dot-count{position:absolute;top:2px;right:1px;min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font:600 10.5px/16px var(--num);text-align:center;padding:0 4px}
.store{display:flex;align-items:center;gap:8px;font-weight:600}
.avatar{width:30px;height:30px;border-radius:8px;background:var(--side);color:#fff;display:grid;place-items:center;font:700 12px var(--num)}
.pop{position:absolute;right:0;top:42px;width:330px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(17,26,44,.16);padding:6px;z-index:30}
.pop h3{font-size:13px;color:var(--ink3);font-weight:500;padding:8px 10px 4px}
.pop li button{display:block;width:100%;padding:9px 10px;border-radius:6px}
.pop li button:hover{background:var(--bg)}
.pop small{display:block;color:var(--ink3);font-size:12px}
.unread::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--brand);margin-right:7px;vertical-align:2px}

.side{background:var(--side);color:var(--side-ink);padding:12px 10px;position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto}
.side button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:6px;font-size:13.5px}
.side button:hover{background:#1B2640;color:#fff}
.side button[aria-current="page"]{background:#22304F;color:#fff;font-weight:600}
.side .badge{margin-left:auto;background:#2C3A5C;color:#fff;border-radius:9px;padding:0 6px;font:600 11px/18px var(--num)}

*{box-sizing:border-box}:host{font:14px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}

.page{padding:20px 24px 48px;max-width:1280px;width:100%;margin:0 auto}

.btn.pri:disabled{background:#b9c6f3;border-color:#b9c6f3;cursor:not-allowed}
.btn.sm{padding:4px 12px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--sub)}

/* summary */
.sum{display:grid;grid-template-columns:1.25fr 1fr 1.25fr;background:#fff;border:1px solid var(--line);border-radius:8px;margin-bottom:16px}
.sum>div{padding:16px 20px;border-left:1px solid var(--line2);min-width:0}

.amt{font-weight:600}

.copy{border:0;background:none;color:var(--mute);padding:0 4px;font-size:12px;vertical-align:1px}

.pager .pg{display:flex;gap:4px;align-items:center}

.pager .pg button.on{border-color:var(--pri);color:var(--pri);font-weight:600}
.pager .pg button:disabled{color:#c5cad3;cursor:not-allowed}

.mask{position:fixed;inset:52px 0 0 0;background:rgba(16,24,40,.38);z-index:20}

.box{border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

.fld{margin-top:18px}

.fld .hint{color:var(--sub);font-size:12.5px;margin-top:4px;display:flex;justify-content:space-between;gap:8px}

textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(47,91,234,.12)}

.mbox ol li{margin-bottom:6px}
.mbox .mf{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
#toast{position:fixed;left:50%;top:20px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}

@keyframes in2{from{opacity:0;transform:translateY(-6px)}to{opacity:1}}

<template id="t-data"><style>:host{display:block;color-scheme:light}:host([hidden]){display:none!important}[hidden]{display:none!important}

/* ---------- dictionary engine: exact strings first, then patterns with {} (any text) and {n} (a number) ---------- */
const escRe=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function compile(list){
  const exact=new Map(),lower=new Map(),pats=[];
  for(const [s,d] of list){
    if(/\{\}|\{n\}/.test(s)){
      const parts=s.split(/(\{\}|\{n\})/);let re='',lit=0,any=0;
      for(const p of parts){if(p==='{}'){re+='([\\s\\S]+?)';any++}else if(p==='{n}')re+='([+\\-−]?\\d[\\d,.]*)';else{re+=escRe(p);lit+=p.length}}
      const litText=parts.filter(p=>p!=='{}'&&p!=='{n}').join('');
      pats.push({re:new RegExp('^'+re+'$'),d,lit,any,sepZh:/[，。；]/.test(litText),sepEn:/\. /.test(litText)});
    }else{exact.set(s,d);lower.set(s.toLowerCase(),d)}
  }
  pats.sort((a,b)=>b.lit-a.lit||a.any-b.any);
  return {exact,lower,pats,cache:new Map()};
}
const D_EN=compile(ZH2EN),D_ZH=compile(EN2ZH);
const PUNCT={'：':': ','，':', ','。':'. ','；':'; ','、':', ','（':' (','）':') ','「':'“','」':'”','！':'! ','？':'? '};
const punct=(s,toEn)=>toEn?s.replace(/[：，。；、（）「」！？]/g,c=>PUNCT[c]):s;
const SPLIT_EN=[/(\s*·\s*)/,/(，|；|。)/,/(\s+\/\s+|：|、|\s*→\s*|\s+[–-]\s+|（|）)/];   // zh -> en
const SPLIT_ZH=[/(\s*·\s*)/,/(\.\s|;\s)/,/(\s+\/\s+|:\s|,\s|\s*→\s*)/];               // en -> zh
const AFFIX=new RegExp('^([\\s·•●⚠✓✕×▾▸▴▼▲›‹←→↓↑＋+…:：，,。.；;!！?？🔒⧉✎|/—–\\-]*)([\\s\\S]*?)([\\s·•●⚠✓✕×▾▸▴▼▲›‹←→↓↑＋+…:：，,。.；;!！?？🔒⧉✎|/—–\\-]*)$','u');
function look(D,s,toEn,depth){
  if(D.exact.has(s))return D.exact.get(s);
  if(!toEn){const l=D.lower.get(s.toLowerCase());if(l!=null)return l}
  if(D.cache.has(s))return D.cache.get(s);
  let out=null;
  // a fragment pattern must not swallow a multi-clause sentence: sentences are split into clauses first
  const hasDot=/ · /.test(s),hasB=toEn?/[，。；]/.test(s):/\. /.test(s);
  if(depth<5)for(const p of D.pats){if(hasB&&!(toEn?p.sepZh:p.sepEn))continue;if(hasDot&&p.any&&p.lit<=3)continue;const m=p.re.exec(s);
    if(m){out=p.d.replace(/\{(\d)\}/g,(_,i)=>{const c=m[+i];if(c==null)return '';const r=tr(D,c.trim(),toEn,depth+1,0);return r==null?c:r});break}}
  D.cache.set(s,out);return out;
}
function tr(D,s,toEn,depth,level){
  let r=look(D,s,toEn,depth);if(r!=null)return r;
  const m=AFFIX.exec(s);
  let pre='',core=s,post='';
  if(m&&m[2]){pre=m[1];core=m[2];post=m[3];
    if(core!==s){r=look(D,core,toEn,depth);if(r!=null)return punct(pre,toEn)+r+punct(post,toEn)}}
  let n=/^([\s\S]*?\D)(\s*\d[\d,.]*)$/.exec(core);
  if(n){r=look(D,n[1].trim(),toEn,depth);if(r!=null)return punct(pre,toEn)+r+' '+n[2].trim()+punct(post,toEn)}
  n=/^(\d[\d,.]*\s*)(\D[\s\S]*)$/.exec(core);
  if(n){r=look(D,n[2].trim(),toEn,depth);if(r!=null)return punct(pre,toEn)+n[1].trim()+' '+r+punct(post,toEn)}
  const seps=toEn?SPLIT_EN:SPLIT_ZH;
  for(let lv=level||0;lv<seps.length;lv++){
    const parts=s.split(seps[lv]);
    if(parts.length<2)continue;
    let hit=0;
    const o=parts.map((p,i)=>{if(i%2)return punct(p,toEn);if(!p.trim())return p;
      const lead=/^\s*/.exec(p)[0],tail=/\s*$/.exec(p)[0],c=p.trim();
      if(toEn?!CJK.test(c):!LAT.test(c))return p;
      const t=tr(D,c,toEn,depth+1,lv+1);if(t!=null){hit++;return lead+t+tail}return p});
    if(hit)return o.join('');
  }
  return null;
}
function translate(text,src){
  const lang=IGV.lang;
  const m=/^(\s*)([\s\S]*?)(\s*)$/.exec(text);const core=m[2].replace(/\s+/g,' ');
  if(!core)return text;
  let r=null;
  if(lang==='en'){if(CJK.test(core))r=tr(D_EN,core,true,0,0);else if(/^[。，；：、！？（）「」]+$/.test(core))r=punct(core,true).trim()}
  else if(src==='en'&&LAT.test(core)&&!CJK.test(core))r=tr(D_ZH,core,false,0,0);
  if(r==null)return text;
  return m[1]+r.replace(/ {2,}/g,' ').replace(/ ([,.;:)])/g,'$1')+m[3];
}

/* ---------- DOM binding: remember each node's original text, re-render on language switch and on mutation ---------- */
const orig=new WeakMap(),last=new WeakMap(),aorig=new WeakMap();
function skip(node){const p=node.parentElement;return !!(p&&p.closest(SKIP))}
function doText(node,src){
  if(skip(node))return;
  const cur=node.nodeValue;
  if(last.get(node)!==cur)orig.set(node,cur);
  const o=orig.get(node);
  const p=node.parentNode;
  if(p&&p.nodeName==='OPTION'&&!p.hasAttribute('value'))p.setAttribute('value',o); // keep option values stable when the label is translated
  let t=translate(o,src);
  if(t!==o&&IGV.lang==='en'&&CJK.test(o)){ // English needs a space where Chinese runs text straight into an inline element
    const pv=node.previousSibling,nx=node.nextSibling;
    if(pv&&pv.nodeType===1&&/^[A-Za-z(“"]/.test(t))t=' '+t;
    if(nx&&nx.nodeType===1&&/[A-Za-z,:;.)”"]$/.test(t))t+=' ';
  }
  last.set(node,t);
  if(t!==cur)node.nodeValue=t;
}
function doAttrs(el,src){
  if(el.closest&&el.closest('[data-noi18n]'))return;
  for(const a of ATTRS){
    if(!el.hasAttribute(a))continue;
    let rec=aorig.get(el);if(!rec){rec={};aorig.set(el,rec)}
    const cur=el.getAttribute(a);
    if(!rec[a]||rec[a].last!==cur)rec[a]={orig:cur,last:cur};
    const t=translate(rec[a].orig,src);rec[a].last=t;
    if(t!==cur)el.setAttribute(a,t);
  }
}
function walk(node,src){
  if(node.nodeType===3){doText(node,src);return}
  if(node.nodeType!==1&&node.nodeType!==11)return;
  if(node.nodeType===1){const tag=node.nodeName;if(tag==='SCRIPT'||tag==='STYLE'||tag==='TEMPLATE'||tag==='TEXTAREA')return;doAttrs(node,src)}
  for(let c=node.firstChild;c;c=c.nextSibling)walk(c,src);
}
const roots=[];
function watch(node,src){
  roots.push({node,src});
  new MutationObserver(list=>{
    for(const m of list){
      if(m.type==='characterData')doText(m.target,src);
      else if(m.type==='attributes')doAttrs(m.target,src);
      else m.addedNodes.forEach(n=>walk(n,src));
    }
  }).observe(node,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:ATTRS});
  walk(node,src);
}

function dur(ms){ms=Math.abs(ms);const d=Math.floor(ms/DAY),h=Math.floor(ms%DAY/HR),m=Math.floor(ms%HR/MIN),s=Math.floor(ms%MIN/1000),zh=S.lang==='zh';
 if(d>=1)return zh?`${d} 天`:`${d} days`; if(h>=1)return zh?`${h} 小时 ${m} 分`:`${h}h ${m}m`; return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function durShort(ms){const m=Math.max(1,Math.round(Math.abs(ms)/MIN));if(m<60)return m+' '+t('min');return dur(ms)}
function timeCell(it){
 if(it.dl==null) return {sev:it.sev||'',html:`<b>${it.time?L(it.time):t('noDeadline')}</b>`,plain:1};
 const left=BASE+it.dl-Date.now();
 if(left<=0) return {sev:'red',html:`<b>${t('overdue')}</b><span>${t('overBy',{t:durShort(left)})}</span>`};
 return {sev:left<HR?'red':left<12*HR?'amber':'',html:`<b>${dur(left)}</b><span>${t('left')}</span>`};
}

 orders:{h:['th_order','th_item','th_buyer','th_amount','th_status'],r:[['#IGV-26112304','WoW Classic Gold 5,000G','k***r','$86.50',{zh:'待发货',en:'To deliver'}],['#IGV-26112301','EA FC 26 Coins 500K','m***o','$41.20',{zh:'待发货',en:'To deliver'}],['#IGV-26112297','EA FC 26 Coins 1M','j***n','$79.90',{zh:'申请取消',en:'Cancellation requested'}],['#IGV-26112251','Diablo IV Gold 2B','s***a','$23.00',{zh:'已完成',en:'Completed'}]]},

 else if(ds.lang)S.lang=ds.lang;

 else if(ds.cat)S.cat=ds.cat;
 else if(ds.period)S.period=ds.period;

 else if(ds.done){S.done[ds.done]=1;S.route={page:'home'};toast('doneToast')}

 else if(ds.act==='expand')S.expand=!S.expand;
 else if(ds.act==='online'){S.online=!S.online;toast(S.online?'toastOnline':'toastAway')}
 else if(ds.act==='withdraw'){S.modal=true;render();ROOT.getElementById('amt').select();return}
 else if(ds.act==='closeModal')S.modal=false;

 else if(ds.act==='wdOk'){if(!wdCalc())return;const v=Math.round(wdVal()*100)/100;S.wd=(S.wd||0)+v;S.modal=false;toast('wdToast',{a:$m(v)})}
 render();
});

let tipEl;ROOT.addEventListener('mousemove',e=>{const g=e.target.closest&&e.target.closest('[data-tip]');if(!g){if(tipEl){tipEl.remove();tipEl=null}return}
 if(!tipEl){tipEl=document.createElement('div');tipEl.className='tip';ROOT.appendChild(tipEl)}tipEl.textContent=g.dataset.tip;tipEl.style.left=e.clientX+'px';tipEl.style.top=e.clientY+'px'});
IGV.onLang(l=>{S.lang=l;render()});
IGV.onGo(n=>{if(n==='home'&&S.route.page!=='home'){S.route={page:'home'};render()}});

})();
}catch(e){console.error('module home failed',e)}

function deadline(x){ return x.created + x.sla; }
function urgency(x){
  if(!F) return 'normal';
  if(x.status==='pending'){ const r = deadline(x)-Date.now(); if(r<0) return 'overdue'; if(r<1*H) return 'soon'; return 'normal'; }
  if(x.status==='aftersale' && x.asStatus==='reply'){ const r = x.respondBy-Date.now(); return r<0?'overdue':(r<6*H?'soon':'normal'); }
  return 'normal';
}
function fmtDur(ms){ ms=Math.abs(ms); const d=Math.floor(ms/D), h=Math.floor(ms%D/H), m=Math.floor(ms%H/M); if(d) return `${d}d ${h}h`; if(h) return `${h}h ${m}m`; return `${m}m`; }
function fmtDT(ts){ const t=new Date(ts); const p=n=>String(n).padStart(2,'0'); return `${p(t.getMonth()+1)}-${p(t.getDate())} ${p(t.getHours())}:${p(t.getMinutes())}`; }
function fmtHead(ts){ const t=new Date(ts); const p=n=>String(n).padStart(2,'0'); return `${p(t.getHours())}:${p(t.getMinutes())}:${p(t.getSeconds())} ${p(t.getDate())}/${p(t.getMonth()+1)}/${t.getFullYear()}`; }
function slaText(x){ return x.sla>=D? `${x.sla/D}d` : `${x.sla/H}h`; }
function statusTag(x){
  const u=urgency(x);
  switch(x.status){
    case 'pending': return ['待递送','gray'];
    case 'missing': return ['待递送','gray'];
    case 'shipped': return ['待买家收货','blue'];
    case 'confirmed': return ['已确认收货','green'];
    case 'done': return ['已完成','gray'];
    case 'aftersale': return AS_ST[x.asStatus];
  }
}
function timeBlock(x){ // {cd, cls, sub, note}
  const u=urgency(x);
  if(x.status==='pending'){
    const r=deadline(x)-Date.now();
    const cd = u==='overdue'?`已超时 ${fmtDur(r)}`:(u==='soon'?`剩 ${fmtDur(r)}`:'');
    const cls = u==='overdue'?'u-red':(u==='soon'?'u-orange':'');
    const sub = '';
    let note='';
    if(u==='overdue') note='请立即递送，超时将影响店铺评级';
    else if(x.cat==='代练' && x.progress===0) note='超过 24h 未更新进度，请尽快开始';
    return {cd,cls,sub,note};
  }
  if(x.status==='missing') return {cd:'',cls:'',sub:'',note:'买家信息未齐，暂不能递送',noteCls:'u-orange'};
  if(x.status==='shipped') return {cd:'',cls:'',sub:'',note:'等待买家确认收货，超时自动收货'};
  if(x.status==='confirmed') return {cd:'预计结算 11-07',cls:'',sub:'买家已确认收货',note:x.review?`买家已评价 ${'★'.repeat(x.review)}`:'买家尚未评价',noteCls:x.review?'':'u-orange'};
  if(x.status==='done') return {cd:'已结算',cls:'u-muted',sub:'',note:x.review?`买家已评价 ${'★'.repeat(x.review)}`:'买家尚未评价',noteCls:x.review?'':'u-orange'};
  if(x.status==='aftersale'){
    const r=x.respondBy-Date.now(); const sub=`${AS_KIND[x.asKind][0]} · ${x.asReason}`;
    if(x.asStatus==='reply') return {cd:r<0?`已超时 ${fmtDur(r)}`:`响应剩 ${fmtDur(r)}`,cls:r<0?'u-red':(r<6*H?'u-orange':''),sub,note:'超时未回复将由平台介入'};
    if(x.asStatus==='buyer') return {cd:'',cls:'',sub,note:'已回复，等待买家'};
    if(x.asStatus==='platform') return {cd:'',cls:'',sub,note:'平台处理中'};
    return {cd:'',cls:'',sub,note:`完结于 ${fmtDT(x.respondBy)}`};
  }
}
function primaryAction(x){ // [label, kind]
  switch(x.status){
    case 'pending': return x.cat==='代练'&&x.delivered===0?['更新进度','progress']:['递送','ship'];
    case 'missing': return ['提醒买家','remind'];
    case 'shipped': return ['提醒买家确认','remindConfirm'];

  }
}

function filtered(){
  let arr = orders.filter(x=>inTab(x,state.tab));
  if(state.date!=='all') arr=arr.filter(x=>x.created>Date.now()-(+state.date)*D);
  if(state.game) arr=arr.filter(x=>x.game===state.game);
  if(state.cat) arr=arr.filter(x=>x.cat===state.cat);
  if(state.q){ const q=state.q.toLowerCase(); arr=arr.filter(x=>[x.id,x.title,x.buyer,...x.info.map(i=>i[1])].join(' ').toLowerCase().includes(q)); }
  for(const c of state.chips){
    if(c.startsWith('as_')) arr=arr.filter(x=>x.status==='aftersale'&&x.asStatus===c.slice(3));
    if(c==='overdue') arr=arr.filter(x=>urgency(x)==='overdue');
    if(c==='soon') arr=arr.filter(x=>urgency(x)==='soon');
    if(c==='missing') arr=arr.filter(x=>x.status==='missing');
    if(c==='unread') arr=arr.filter(x=>x.unread>0);
    if(c==='first') arr=arr.filter(x=>x.repeat===0);
    if(c==='noreview') arr=arr.filter(x=>!x.review);
  }
  const rem = x => x.status==='pending'?deadline(x)-Date.now(): x.status==='missing'? 1e15 : x.status==='aftersale'? x.respondBy-Date.now() : x.status==='shipped'? x.shippedAt+3*D-Date.now()+1e12 : 2e15;
  if(state.sort==='remain') arr.sort((a,b)=>rem(a)-rem(b));
  if(state.sort==='created') arr.sort((a,b)=>b.created-a.created);
  if(state.sort==='amount') arr.sort((a,b)=>b.price-a.price);
  return arr;
}
function counts(){
  const c={}; for(const [k] of TABS) c[k]=orders.filter(x=>inTab(x,k)).length;
  const p=orders.filter(x=>inTab(x,'pending'));
  c.overdue=p.filter(x=>urgency(x)==='overdue').length; c.soon=p.filter(x=>urgency(x)==='soon').length;
  c.missing=p.filter(x=>x.status==='missing').length; c.unread=p.filter(x=>x.unread>0).length; c.first=p.filter(x=>x.repeat===0).length;
  const a=orders.filter(x=>x.status==='aftersale'); for(const k in AS_ST) c['as_'+k]=a.filter(x=>x.asStatus===k).length;
  c.aftersale = c.as_reply; c.noreview=orders.filter(x=>(x.status==='confirmed'||x.status==='done')&&!x.review).length;
  return c;
}

const catHtml = x => `<span class="cat">${x.cat}</span>`;
const catLine = x => `<div class="u-muted" style="font-size:13px;margin-top:3px">品类：${CAT_EN[x.cat]} - 品牌：${esc(x.game)}</div>`;
const orderNo = x => `订单号：<span class="mono">${x.id}</span>${copyBtn(x.id,true)}`;
function progressHtml(x,mid){
  const u=urgency(x); const col = x.status==='missing'?'u-muted':(u==='overdue'?'u-red':(u==='soon'?'u-orange':(x.delivered>0||x.status==='shipped'?'u-blue':'')));
  const n = x.cat==='代练'&&x.status==='pending' ? `<span class="${col}">${x.progress}%</span>` : `<span class="${col}">${x.delivered}</span><small> / ${x.qty}</small>`;
  const last = x.records.length?`<div class="u-muted" style="font-size:11px;line-height:1.3;margin-top:3px;max-width:120px">最近递送<br>${x.records[x.records.length-1][0]}</div>`:'';
  return `<div class="big${mid?' mid':''}">${n}</div>${mid?'':last}`;
}
function actionsHtml(x,inline){
  const [lbl,kind]=primaryAction(x);
  const prim = `<button class="btn ${kind==='remind'||kind==='remindConfirm'||kind==='progress'||kind==='reviewEdit'||kind==='evidence'?'outline':(kind==='detail'?'':'primary')}" type="button" data-act="${kind}" data-id="${x.id}">${lbl}</button>`;
  const asDetail = x.status==='aftersale'&&x.asStatus==='reply' ? `<button class="btn" type="button" data-act="asDetail" data-id="${x.id}">${AS_KIND[x.asKind][0]}详情</button>` : '';
  if(inline) return `<div class="acts inline">${prim}${asDetail}<button class="more" type="button" data-act="menu" data-id="${x.id}" aria-label="更多操作">···</button></div>`;
  const sec = asDetail ? asDetail : x.status==='missing' ? `<button class="btn" type="button" disabled>递送（信息未齐）</button>` : (x.status==='pending'?`<button class="btn" type="button" data-act="report" data-id="${x.id}">递送信息异常上报</button>`:`<button class="btn" type="button" data-act="menu" data-id="${x.id}">更多</button>`);
  return `<div class="acts">${prim}${sec}</div>`;
}
const svgImg = '<svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 16l-5-5-8 8"></path></svg>';
const flagHtml = x => x.flagged?`<div class="u-orange" style="font-size:12px;margin-top:4px;clear:both">递送信息异常 · 已标记</div>`:'';
const shotsHtml = x => x.shots?`<a href="#" data-act="shots" data-id="${x.id}" style="display:inline-flex;align-items:center;gap:4px;font-size:13px;margin-top:4px">${svgImg}买家截图 ×${x.shots} · 查看</a>`:'';
const asInfoHtml = x => `<div style="display:flex;align-items:center;gap:8px"><span class="tag ${AS_KIND[x.asKind][1]}">${AS_KIND[x.asKind][0]}</span><strong>${esc(x.asReason)}</strong></div><div class="u-muted" style="font-size:13px;margin-top:4px">${esc(x.asDesc)}</div>`;
const allInfo = x => x.shots ? x.info.concat([['买家截图',x.shots]]) : x.info;
const shotLink = x => `<a href="#" data-act="shots" data-id="${x.id}" style="display:inline-flex;align-items:center;gap:4px">${svgImg}×${x.shots} · 查看</a>`;
const kvRow = ([k,v]) => `<span class="k">${esc(k)}</span><span>${k==='密码'?'•••••• <a href="#">查看</a>':`<strong>${esc(v)}</strong>`}</span>`;
function infoCell(x,limit){
  if(x.status==='aftersale') return asInfoHtml(x);
  if(x.status==='missing') return `<span class="missing">等待买家提供${x.cat==='点卡'?' Riot ID / UID':'递送信息'}</span><div class="u-muted" style="font-size:13px;margin-top:6px">已提醒 ${x.remind} 次${x.remind?' · 2 小时前':''}</div>`;
  const all = allInfo(x);
  const show = (!limit||all.length<=limit)?all.length:limit-1;
  const rows = all.slice(0,show).map(([k,v])=>`<span class="k">${esc(k)}</span><span>${k==='买家截图'?shotLink(x):k==='密码'?'•••••• <a href="#">查看</a>':`<strong>${esc(v)}</strong>`}</span>`).join('');
  const rest = all.length-show;
  return `<div class="kv">${rows}</div>${rest>0?`<a href="#" class="u-blue" data-act="infoModal" data-id="${x.id}" style="display:block;margin-top:6px;font-size:13px">查看更多 ${rest} 项（${all.slice(show).map(i=>i[0]).join(' · ')}）</a>`:''}${flagHtml(x)}`;
}
function expandHtml(x){
  const t=timeBlock(x);
  const rows = allInfo(x).map(([k,v])=>`<span class="k">${esc(k)}</span><span>${k==='买家截图'?shotLink(x):k==='密码'?'•••••• <a href="#">查看</a>':`<strong>${esc(v)}</strong>`}</span>`).join('');
  return `<div class="card-x" data-stop="1">
    <div>
      <div class="cell-lbl"><span>递送信息 · ${allInfo(x).length} 项</span>${x.info.length?`<button class="btn sm" type="button" data-act="copyAll" data-id="${x.id}">复制全部</button>`:''}</div>
      ${x.info.length?`<div class="kv two">${rows}</div>`:`<span class="missing">等待买家提供递送信息</span>`}
      ${flagHtml(x)}
      ${x.status==='aftersale'?`<div class="lbl" style="margin-top:4px">${AS_KIND[x.asKind][0]}原因</div><div class="msg"><strong>${esc(x.asReason)}</strong><br>${esc(x.asDesc)}</div>`:''}
      <div class="lbl" style="margin-top:4px">买家留言</div>
      <div class="msg">${x.msg?esc(x.msg):'<span class="u-muted">无</span>'}</div>
    </div>
    <div>
      <div class="lbl">${x.status==='aftersale'?'售后状态':'递送进度'}</div>
      <div>${x.status==='aftersale'?tagHtml(x)+' ':''}${t.sub||''}${t.cd?` <span class="cd ${t.cls}">${t.cd}</span>`:''}</div>
      <div class="${t.noteCls||t.cls}">${t.note||''}</div>
      <div class="lbl" style="margin-top:4px">递送记录</div>
      ${x.records.length?x.records.map(r=>`<div class="ev"><span>${r[0]}</span>${r[1]}</div>`).join(''):'<div class="ev u-muted">暂无</div>'}
      <div class="lbl" style="margin-top:4px">最近事件</div>
      ${x.events.slice(-3).map(e=>`<div class="ev"><span>${e[0]}</span>${e[1]}</div>`).join('')}
      <a href="#" style="font-size:13px">查看全部日志</a>
    </div>
    <div>
      <div class="lbl">内部备注（买家不可见）</div>
      <textarea class="note" data-note="${x.id}" placeholder="例如：已交 5000G，剩余等买家上线">${esc(x.note)}</textarea>
      <div class="btn-row">
        ${x.status==='pending'||x.status==='missing'?`<button class="btn sm" type="button" data-act="report" data-id="${x.id}">递送信息异常上报</button>`:''}
        <button class="btn sm" type="button" data-act="chat" data-id="${x.id}">联系买家</button>
        <a class="btn sm" href="#">属性详情</a>
        <a class="btn sm" href="#">订单详情页</a>
      </div>
    </div>
  </div>`;
}

/* ---------- 三种方案 ---------- */
function headHtml(x,extra){
  const t=timeBlock(x);
  return `<div class="card-h">
    <span class="st" style="display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap">${tagHtml(x)}${warrantyHtml(x)}${t.cd?an(urgency(x)==='overdue'?'1·2':(urgency(x)==='soon'?'3':''),`<span class="cd ${t.cls}" style="font-size:13px">${t.cd}</span>`):''}</span>
    <span class="tm">${fmtHead(x.created)}</span>
    <span>${orderNo(x)}</span>
    <span class="buyer">买家：<strong>${x.buyer}</strong>${chatBtn(x)}${buyerMeta(x)}</span>
    <span class="right"><a href="#" style="font-size:13px">事件日志</a>${extra||''}</span>
  </div>`;
}
function renderCardA(x){
  const t=timeBlock(x); const u=urgency(x);
  return `<article class="card ${u}" data-id="${x.id}">${headHtml(x)}
  <div class="card-b">
    <div>${F?an('6',`<div class="title">${esc(x.title)}</div>`,true):`<div style="display:flex;gap:10px;align-items:flex-start"><span class="thumb">图</span><div class="title">${esc(x.title)}</div></div>`}${catLine(x)}<div style="margin-top:4px;font-size:13px"><a href="#">属性详情</a></div></div>
    <div><div class="cell-lbl"><span>${x.status==='aftersale'?'售后原因':'递送信息'}${allInfo(x).length>4?` <b>${allInfo(x).length} 项</b>`:''}</span>${x.info.length&&x.status!=='aftersale'?`<button class="btn sm" type="button" data-act="copyAll" data-id="${x.id}" style="height:22px;padding:0 8px;font-size:12px">复制全部</button>`:''}</div>${infoCell(x,4)}</div>
    <div><div class="cell-lbl">金额 / 价格</div><div class="u-muted" style="font-size:13px">x${x.qty}</div><div style="font-weight:700;font-size:16px">$ ${x.price.toFixed(2)} USD</div><div class="u-muted" style="font-size:13px;margin-top:4px">到手 <strong style="color:var(--text)">$ ${x.net.toFixed(2)} USD</strong></div></div>
    <div class="stack"><div class="cell-lbl">递送进度</div>${progressHtml(x)}${x.status==='aftersale'&&x.info.length?`<a href="#" data-act="toggle" data-id="${x.id}" style="font-size:12px">查看递送信息 ▾</a>`:''}${t.sub?`<div class="u-muted" style="font-size:13px">${t.sub}</div>`:''}<div class="${t.noteCls||t.cls}" style="font-size:13px">${t.note||''}</div></div>
    <div>${actionsHtml(x)}</div>
  </div>${state.open.has(x.id)?expandHtml(x):''}</article>`;
}
function renderCardB(x){
  const t=timeBlock(x); const u=urgency(x); const open=state.open.has(x.id); const f=infoFirst(x);
  const caret = `<button class="caret ${open?'on':''}" type="button" data-act="toggle" data-id="${x.id}" aria-label="${open?'收起':'展开'}">${open?'▴':'▾'}</button>`;
  return `<article class="card clickable ${u} ${open?'open':''}" data-id="${x.id}" data-toggle="${x.id}">${headHtml(x,caret)}
  <div class="card-b" style="align-items:center">
    <div><div class="cell-lbl">商品</div>${F?an('6',`<span class="title" style="font-size:14px">${esc(x.title)}</span>`):`<div style="display:flex;gap:10px;align-items:center"><span class="thumb">图</span><span class="title" style="font-size:14px">${esc(x.title)}</span></div>`}${catLine(x)}</div>
    <div><div class="cell-lbl">${x.status==='aftersale'?'售后原因':'递送信息'}</div>${x.status==='aftersale'?asInfoHtml(x):x.status==='missing'?`<span class="missing">等待买家提供${x.cat==='点卡'?' Riot ID / UID':'递送信息'} · 已提醒 ${x.remind} 次</span>`:(f?`<strong>${esc(f[1])}</strong>${copyBtn(f[1])} <span class="u-muted">· ${x.info.length>1?x.info[1][1].split(' ')[0]+' · ':''}共 ${allInfo(x).length} 项</span> <a href="#" data-act="toggle" data-id="${x.id}" style="font-size:13px;white-space:nowrap">${open?'收起 ▴':'展开 ▾'}</a>${flagHtml(x)}`:'—')}</div>
    <div><div class="cell-lbl">金额 / 价格 ×${x.qty}</div><div style="font-weight:700">$ ${x.price.toFixed(2)} USD</div><div class="u-muted" style="font-size:13px">到手 $ ${x.net.toFixed(2)} USD</div></div>
    <div><div class="cell-lbl">递送进度</div><div style="display:flex;align-items:center;gap:10px">${progressHtml(x,true)}</div>${x.records.length?`<div class="u-muted" style="font-size:11px;margin-top:2px">最近递送 ${x.records[x.records.length-1][0]}</div>`:''}</div>
    <div>${actionsHtml(x,true)}</div>
  </div>${open?expandHtml(x):''}</article>`;
}
function renderTable(arr){
  const head = `<tr>
    <th style="width:30px;padding-left:10px"></th>
    <th style="width:260px">订单 / 商品</th><th style="width:110px">买家</th><th style="width:230px">${state.tab==='aftersale'?'售后类型 / 原因':'递送信息'}</th>
    <th class="r" style="width:120px">金额 / 到手</th><th class="c" style="width:96px">递送进度</th>
    <th class="sortable" style="width:190px" data-sortcol="remain">订单状态 ${state.sort==='remain'?'↑':''}</th><th class="r" style="width:150px;padding-right:14px">操作</th></tr>`;
  const rows = arr.map(x=>{
    const t=timeBlock(x); const u=urgency(x); const open=state.open.has(x.id); const f=infoFirst(x);
    const r = `<tr class="${u} ${open?'open':''} rowclick" data-id="${x.id}" data-toggle="${x.id}">
      <td style="padding-left:10px"><button class="caret ${open?'on':''}" type="button" data-act="toggle" data-id="${x.id}" aria-label="${open?'收起':'展开'}" style="width:22px;height:22px">${open?'▾':'▸'}</button></td>
      <td><div style="display:flex;align-items:center;gap:6px"><span class="mono">${x.id}</span>${copyBtn(x.id,true)}<span class="sub">${fmtDT(x.created)}</span></div>${F?an('6',`<div style="font-weight:600;margin-top:2px">${esc(x.title)} <span class="u-muted" style="font-weight:400">×${x.qty}</span></div>`,true):`<div style="display:flex;gap:8px;align-items:center;margin-top:2px"><span class="thumb" style="width:36px;height:36px;flex-basis:36px">图</span><div style="font-weight:600">${esc(x.title)} <span class="u-muted" style="font-weight:400">×${x.qty}</span></div></div>`}${catLine(x).replace('margin-top:3px','margin-top:1px')}</td>
      <td><div style="display:flex;align-items:center;gap:6px"><strong>${x.buyer}</strong>${chatBtn(x)}</div>${F?an('5',`<div class="sub">${x.region} · ${x.repeat?'复购 '+x.repeat:'首购'}</div>`):''}</td>
      <td>${x.status==='aftersale'?asInfoHtml(x):x.status==='missing'?`<span class="missing">等待买家提供${x.cat==='点卡'?' Riot ID / UID':'递送信息'}</span><div class="sub" style="margin-top:3px">已提醒 ${x.remind} 次</div>`:(x.info.length?(()=>{ const all=allInfo(x); const show=all.length<=4?all.length:3; return `<div class="kv compact">${all.slice(0,show).map(([k,v],i)=>`<span class="k">${esc(k)}</span><span>${k==='买家截图'?shotLink(x):k==='密码'?'•••••• <a href="#">查看</a>':`<strong>${esc(v)}</strong>${i===0?copyBtn(v):''}`}</span>`).join('')}</div>${all.length>show?`<a href="#" data-act="toggle" data-id="${x.id}" style="display:block;font-size:12px;margin-top:3px">${open?'收起 ▴':`展开其余 ${all.length-show} 项 ▾`}</a>`:''}${flagHtml(x)}`; })():'—')}</td>
      <td class="r"><div style="font-weight:700">${x.price.toFixed(2)} USD</div><div class="sub">到手 ${x.net.toFixed(2)} USD</div></td>
      <td class="c"><div style="font-size:17px;font-weight:700">${x.cat==='代练'&&x.status==='pending'?`<span class="${u==='overdue'?'u-red':(u==='soon'?'u-orange':'')}">${x.progress}%</span>`:`<span class="${x.status==='missing'?'u-muted':(u==='overdue'?'u-red':(u==='soon'?'u-orange':(x.delivered>0?'u-blue':'')))}">${x.delivered}</span><span class="u-muted" style="font-size:14px">/${x.qty}</span>`}</div>${x.records.length?`<div class="u-muted" style="font-size:11px;line-height:1.3;margin-top:2px">最近递送<br>${x.records[x.records.length-1][0]}</div>`:''}${x.status==='aftersale'&&x.info.length?`<a href="#" data-act="toggle" data-id="${x.id}" style="font-size:12px;white-space:nowrap">${open?'收起 ▴':'递送信息 ▾'}</a>`:''}</td>
      <td><div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">${tagHtml(x)}${warrantyHtml(x)}</div>${t.cd?an(urgency(x)==='overdue'?'1·2':(urgency(x)==='soon'?'3':''),`<div class="cd ${t.cls}" style="margin-top:3px;${t.cls==='u-muted'?'font-weight:400;font-size:13px':''}">${t.cd}</div>`):''}${t.sub&&x.status!=='aftersale'?`<div class="sub">${t.sub}</div>`:''}${x.status==='missing'||x.flagged?`<div class="sub u-orange">${x.status==='missing'?'等待买家提供递送信息':'递送信息异常 · 已标记'}</div>`:''}</td>
      <td class="r" style="padding-right:14px">${actionsHtml(x,true).replace('class="btn ','class="btn sm ')}</td>
    </tr>`;
    return r + (open?`<tr class="xrow"><td colspan="8">${expandHtml(x)}</td></tr>`:'');
  }).join('');
  return `<div class="tbl-wrap"><table class="tbl"><thead>${head}</thead><tbody>${rows}</tbody></table></div>`;
}

/* ---------- 渲染 ---------- */
function render(){
  const c=counts();
  ROOT.getElementById('tabs').innerHTML = TABS.map(([k,l])=>`<button type="button" data-tab="${k}" class="${state.tab===k?'on':''}">${l}${k!=='all'&&c[k]?`<span class="badge ${k==='pending'||k==='aftersale'?'red':''}">${c[k]}</span>`:''}</button>`).join('');
  const chipDefs = state.tab==='aftersale' ? Object.keys(AS_ST).map(k=>['as_'+k,AS_ST[k][0],c['as_'+k],k==='reply'?'red':''])
    : (state.tab==='confirmed'||state.tab==='done') ? [['noreview','未评价',c.noreview]]
    : [['overdue','逾期',c.overdue,'red'],['soon','即将到期',c.soon],['missing','待买家补充',c.missing],['unread','未读消息',c.unread],['first','首次购买买家',c.first]];
  ROOT.getElementById('chips').innerHTML = F ? an('7','<span class="lbl">'+(state.tab==='aftersale'?'状态：':'快捷：')+'</span>'+chipDefs.map(([k,l,n,cls])=>`<button type="button" class="chip ${cls||''} ${state.chips.has(k)?'on':''}" data-chip="${k}">${l} ${n}</button>`).join('')) : '<span class="lbl u-muted">（基础版：无新增状态检索）</span>';
  ROOT.getElementById('expandTools').classList.toggle('hidden', state.view==='card');

  const arr=filtered();
  if(state.view==='collapse' && !state.openInit){ arr.forEach(x=>{ const u=urgency(x); if(u==='overdue'||u==='soon') state.open.add(x.id); }); state.openInit=true; }
  const list=ROOT.getElementById('list'); list.classList.toggle('table-mode',state.view==='table');
  if(!arr.length) list.innerHTML='<div class="empty">当前筛选下没有订单。试试清除快捷标签或放宽日期。</div>';
  else if(state.view==='card') list.innerHTML=arr.map(renderCardA).join('');
  else if(state.view==='collapse') list.innerHTML=arr.map(renderCardB).join('');
  else list.innerHTML=renderTable(arr);

  const tot=arr.reduce((s,x)=>s+x.price,0), net=arr.reduce((s,x)=>s+x.net,0);
  ROOT.getElementById('sum').textContent = `本筛选 共 ${arr.length} 单 · 金额 ${tot.toFixed(2)} USD · 预计到手 ${net.toFixed(2)} USD`;
  ROOT.getElementById('pageInfo').textContent = `第 1 / 1 页 · 共 ${arr.length} 单`;
}

/* ---------- 事件 ---------- */
function toast(msg){ const t=ROOT.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1800); }
function copyText(s,label){ try{ navigator.clipboard.writeText(s).then(()=>toast(label||'已复制')); }catch(e){ toast('复制失败：浏览器不允许'); } }
function byId(id){ return orders.find(x=>x.id===id); }
function toggle(id){ state.open.has(id)?state.open.delete(id):state.open.add(id); render(); }

ROOT.addEventListener('click', e=>{
  const t=e.target;
  const tab=t.closest('[data-tab]'); if(tab){ state.tab=tab.dataset.tab; state.chips.clear(); render(); return; }
  const chip=t.closest('[data-chip]'); if(chip){ const k=chip.dataset.chip; if(k.startsWith('as_')){ const was=state.chips.has(k); [...state.chips].filter(c=>c.startsWith('as_')).forEach(c=>state.chips.delete(c)); if(!was) state.chips.add(k); } else { state.chips.has(k)?state.chips.delete(k):state.chips.add(k); } render(); return; }
  const v=t.closest('[data-view]'); if(v){ state.view=v.dataset.view; state.open.clear(); state.openInit=false; render(); return; }
  const cp=t.closest('[data-copy]'); if(cp){ copyText(cp.dataset.copy,'已复制：'+cp.dataset.copy); return; }
  const sc=t.closest('[data-sortcol]'); if(sc){ state.sort='remain'; ROOT.getElementById('fSort').value='remain'; render(); return; }
  const act=t.closest('[data-act]');
  if(act){ e.preventDefault(); const x=byId(act.dataset.id); handleAct(act.dataset.act,x,act); return; }
  if(t.closest('a,button,input,textarea,select,label,.card-x')) return;
  const card=t.closest('[data-toggle]'); if(card){ toggle(card.dataset.toggle); }
});
ROOT.addEventListener('input', e=>{ const n=e.target.closest('[data-note]'); if(n) byId(n.dataset.note).note=n.value; });
ROOT.getElementById('q').addEventListener('input', e=>{ state.q=e.target.value.trim(); render(); });
['fDate','fGame','fCat','fSort'].forEach(id=>ROOT.getElementById(id).addEventListener('change',e=>{ state[{fDate:'date',fGame:'game',fCat:'cat',fSort:'sort'}[id]]=e.target.value; render(); }));

function modal(body,onOk,okLabel){

  const close=()=>L.innerHTML='';
  ROOT.getElementById('mCancel').onclick=close; L.querySelector('.modal-bg').onclick=e=>{ if(e.target===e.currentTarget) close(); };
  ROOT.getElementById('mOk').onclick=()=>{ onOk(); if(!okLabel||okLabel==='关闭') close(); };
  if(okLabel==='关闭') ROOT.getElementById('mCancel').classList.add('hidden');
  L.querySelector('.inp,textarea')?.focus();
}
function menu(el,x){

function can(p,op){
  if(IGV.status==='nosell') return '店铺已被禁止售卖';
  switch(op){
    case 'up':
      if(state.deposit) return '未缴纳保证金';
      if(p.status==='onsale') return '已在售';
      if(p.status==='verifying'||p.status==='verifyErr') return '验号未通过';
      if(p.status==='soldout') return '库存为 0，请先补货';
      if(p.offReason==='system') return '系统下架，需先整改';
      if(p.offReason==='perm') return '无该品类权限';
      if(p.offReason==='expired') return '需先更新有效期';
      return null;
    case 'down':
      if(p.status==='onsale') return null;
      if(p.status==='off') return '已是下架状态';
      if(p.status==='soldout') return '已售罄，无需下架';
      return '不在售';
    case 'price':

      return null;

function filtered(){
  let list=products.filter(p=>state.biz==='all'||p.biz===state.biz);
  if(state.tab!=='all') list=list.filter(p=>p.status===state.tab);
  if(state.q){const q=state.q.toLowerCase();list=list.filter(p=>p.title.toLowerCase().includes(q)||p.id.includes(q));}
  if(state.game) list=list.filter(p=>p.game===state.game);
  if(state.cat) list=list.filter(p=>p.cat===state.cat);
  if(state.ship) list=list.filter(p=>p.ship===state.ship);
  if(state.alertOnly) list=list.filter(isAlert);
  const s=state.sort;
  list.sort((a,b)=>s==='priceDesc'?b.price-a.price:s==='priceAsc'?a.price-b.price:s==='stockAsc'?a.stock-b.stock:b.updated.localeCompare(a.updated));
  return list;
}

  $('#bizSeg').innerHTML=['all',...Object.keys(BIZ)].map(k=>`<button class="${state.biz===k?'on':''}" onclick="setBiz('${k}')">${k==='all'?'全部':BIZ[k]}<small>${products.filter(p=>k==='all'||p.biz===k).length}</small></button>`).join('');
  // 状态 tab
  $('#tabs').innerHTML=['all',...Object.keys(STATUS)].map(k=>{const n=bizList.filter(p=>k==='all'||p.status===k).length;return `<button class="${state.tab===k?'on':''}" onclick="setTab('${k}')">${k==='all'?'全部':STATUS[k]} ${k==='verifyErr'&&n?`<span class="badge">${n}</span>`:`<span class="cnt">${n}</span>`}</button>`;}).join('');
  // 筛选项
  fillSel('#fGame',[...new Set(bizList.map(p=>p.game))],state.game,'游戏 / 品牌：全部');
  fillSel('#fCat',[...new Set(bizList.map(p=>p.cat))],state.cat,'品类：全部');
  // 列表
  const list=filtered();const total=list.length;const pages=Math.max(1,Math.ceil(total/state.size));if(state.page>pages)state.page=pages;
  const page=list.slice((state.page-1)*state.size,state.page*state.size);
  $('#rows').innerHTML=page.length?page.map(row).join(''):`<tr><td colspan="9"><div class="empty">没有符合条件的商品</div></td></tr>`;
  $('#selAll').checked=page.length>0&&page.every(p=>state.selected.has(p.id));
  renderToolbar(list);
  $('#pager').innerHTML=`<span>共 ${total} 件商品</span><div class="pg">
    <button class="btn sm" ${state.page<=1?'disabled':''} onclick="state.page--;render()">‹</button>
    ${Array.from({length:pages},(_,i)=>`<button class="btn sm ${i+1===state.page?'pri':''}" onclick="state.page=${i+1};render()">${i+1}</button>`).join('')}
    <button class="btn sm" ${state.page>=pages?'disabled':''} onclick="state.page++;render()">›</button>
    <select class="sel" style="height:26px;margin-left:8px" onchange="state.size=+this.value;state.page=1;render()">${[10,20,50].map(n=>`<option ${n===state.size?'selected':''} value="${n}">${n} 条/页</option>`).join('')}</select></div>`;
}
function fillSel(sel,opts,cur,label){const e=$(sel);e.innerHTML=`<option value="">${label}</option>`+opts.map(o=>`<option ${o===cur?'selected':''}>${esc(o)}</option>`).join('');}

function row(p){
  const sel=state.selected.has(p.id);const al=isAlert(p);
  const cls=[sel?'sel':'',al?'warnrow':'',p.status==='verifyErr'?'errrow':'',(p.status==='off'||p.status==='soldout')?'dim':''].join(' ');
  const attrs=p.attrs.slice(0,3).map(a=>`<div class="kv" title="${esc(a[0])}：${esc(a[1])}"><b>${esc(a[0])}：</b>${esc(a[1])}</div>`).join('')+(p.attrs.length>3?`<button class="more" onclick="showAttrs(event,'${p.id}')">+ ${p.attrs.length-3} 项属性 ▾</button>`:'');
  // 价格
  const editP=state.editing&&state.editing.id===p.id&&state.editing.f==='price';
  const priceCell=editP?`<div class="inline">$ <input id="ed" type="number" step="0.01" value="${p.price}" onkeydown="edKey(event,'${p.id}','price')"><button class="btn sm pri" onclick="edSave('${p.id}','price')">✓</button></div>`
    :`${money(p.price)}${can(p,'price')?'':`<button class="pen" title="改价" onclick="edit('${p.id}','price')">✎</button>`}<div class="sub">${unitTxt(p)}</div>`;
  const editS=state.editing&&state.editing.id===p.id&&state.editing.f==='stock';
  const stockCell=editS?`<div class="inline"><input id="ed" type="number" step="1" value="${p.stock}" onkeydown="edKey(event,'${p.id}','stock')"><button class="btn sm pri" onclick="edSave('${p.id}','stock')">✓</button></div><div class="sub">回车保存 · Esc 取消</div>`
    :`<span class="${al||p.stock===0?'warnnum':''}">${stockTxt(p)}</span>${can(p,'stock')?'':`<button class="pen" title="改库存" onclick="edit('${p.id}','stock')">✎</button>`}${p.locked?`<span class="lock">🔒 ${p.locked}<span class="tip">锁定 ${p.locked} 件：${esc(p.lockReason)}</span></span>`:''}
     <div class="sub">${al?`<span style="color:var(--warn)">⚠ 已低于警报值 ${p.alert}${p.unit==='unit'?'':' '+p.unit}</span>`:p.biz==='account'?'':`警报值 ${p.alert}${p.unit==='unit'?'':' '+p.unit}`}</div>`;
  // 状态
  let st='';
  if(p.status==='onsale') st=`<span class="pill ok">● 在售</span>${al?'<div class="sub" style="color:var(--warn)">库存预警</div>':''}`;
  else if(p.status==='off') st=`<span class="pill gray">已下架</span><div class="sub">${OFF_REASONS[p.offReason]} · ${p.offAt}${p.offReason==='system'||p.offReason==='perm'?` <button class="more" onclick="showReason('${p.id}')">查看原因 ›</button>`:''}</div>`;
  else if(p.status==='verifying') st=`<span class="pill gray">审核验号中</span><div class="sub">预计验号时长 ${p.verifyTotal} · 剩余 ${p.verifyLeft}</div>`;
  else if(p.status==='verifyErr') st=`<span class="pill err">审核验号异常</span><div><button class="more" onclick="showReason('${p.id}')">查看异常原因 ›</button></div>`;
  else st=`<span class="pill warn">已售罄</span>`;
  // 操作
  let main='';
  if(p.status==='soldout'||al) main=`<button class="btn sm pri" onclick="edit('${p.id}','stock')">补货</button>`;
  else if(p.status==='verifyErr') main=`<button class="btn sm pri" onclick="showReason('${p.id}')">查看原因</button>`;
  else if(p.status==='off'&&(p.offReason==='system'||p.offReason==='perm')) main=`<button class="btn sm pri" onclick="showReason('${p.id}')">查看原因</button>`;
  else if(p.status==='off'){const r=can(p,'up');main=`<button class="btn sm pri" ${r?`disabled title="${esc(r)}"`:''} onclick="doOne('${p.id}','up')">${p.offReason==='expired'?'重新上架':'上架'}</button>`;}
  const downBtn=p.status==='onsale'&&!al?`<button class="btn sm" onclick="doOne('${p.id}','down')">下架</button>`:'';
  const menuOpen=state.menu===p.id;
  const menu=menuOpen?`<div class="menu">
      ${p.status==='onsale'?`<button onclick="doOne('${p.id}','down')">下架</button>`:''}
      ${p.status==='off'||p.status==='soldout'?`<button ${can(p,'up')?`disabled title="${esc(can(p,'up'))}"`:''} onclick="doOne('${p.id}','up')">上架</button>`:''}
      ${p.status==='verifying'?`<button onclick="withdraw('${p.id}')">撤回验号</button>`:''}
      <button onclick="toast('复制商品：已生成草稿')">复制商品</button>
      <button ${can(p,'del')?`disabled title="${esc(can(p,'del'))}"`:''} style="color:var(--err)" onclick="confirmDelOne('${p.id}')">删除${can(p,'del')?' · '+can(p,'del'):''}</button>
    </div>`:'';
  return `<tr class="${cls}">
    <td><input type="checkbox" aria-label="选择" ${sel?'checked':''} onchange="toggleSel('${p.id}',this.checked)"></td>
    <td><div class="pt"><div class="thumb">${esc(p.game.slice(0,3).toUpperCase())}</div><div style="min-width:0"><div class="t">${esc(p.title)}</div>
      <div class="id">ID ${p.id} <button class="cp" onclick="copyId('${p.id}')">⧉</button>${p.std?'<span class="tag" style="margin-left:4px">标准化</span>':''}</div>
      <div class="tags"><span class="tag">${BIZ[p.biz]}</span><span class="tag">${esc(p.game)}</span><span class="tag">${esc(p.cat)}</span></div></div></div></td>
    <td><div style="display:flex;flex-direction:column;gap:2px">${attrs}</div></td>
    <td>${priceCell}</td><td>${stockCell}</td>
    <td>${p.ship}${p.shipSub?`<div class="sub">${esc(p.shipSub)}</div>`:''}</td>
    <td>${st}</td>
    <td class="sub">${p.updated.slice(5,10)}<br>${p.updated.slice(11)}</td>
    <td><div class="acts">${main}${downBtn}<button class="btn sm" onclick="edit('${p.id}','open')">编辑</button><button class="btn sm" aria-label="更多" onclick="toggleMenu(event,'${p.id}')">⋯</button>${menu}</div></td>
  </tr>`;
}

function renderToolbar(list){
  const sel=[...state.selected].map(id=>products.find(p=>p.id===id)).filter(Boolean);
  const n=sel.length;const tb=$('#toolbar');tb.className='toolbar'+(n?' active':'');
  const ops=[['up','批量上架'],['down','批量下架'],['price','批量改价'],['stock','批量改库存'],['del','批量删除']];
  tb.innerHTML=`<label style="display:flex;align-items:center;gap:6px"><input type="checkbox" ${$('#selAll').checked?'checked':''} onchange="toggleAll(this.checked)"> 全选本页</label>
    <span class="${n?'':'sub'}" style="${n?'font-weight:600':''}">已选 ${n} 件</span><span class="sep"></span>
    ${ops.map(([op,label])=>{const ok=sel.filter(p=>!can(p,op)).length;const dis=!n||!ok;
      const why=!n?'请先勾选商品':!ok?(op==='up'&&state.deposit?'未缴纳保证金':'选中的商品均不符合条件'):'';
      return `<button class="btn sm ${op==='del'?'dng':''}" ${dis?`disabled title="${why}"`:''} onclick="batch('${op}')">${label}${n?` (${ok})`:''}</button>`;}).join('')}
    ${n?`<button class="more" style="margin-left:auto" onclick="state.selected.clear();render()">取消选择</button>`:`<span class="sub" style="margin-left:auto">选中后按钮显示可操作件数；不符合条件的商品在确认时自动排除</span>`}`;
}

// ---------- 交互 ----------
function setBiz(k){state.biz=k;state.page=1;state.selected.clear();state.game='';state.cat='';render();}
function setTab(k){state.tab=k;state.page=1;render();}
function quick(k){if(k==='alert'){state.tab='all';state.alertOnly=true;$('#fAlert').checked=true;}else{state.tab=k;}state.page=1;render();$('#rows').scrollIntoView({behavior:'smooth',block:'start'});}
function resetFilters(){Object.assign(state,{q:'',game:'',cat:'',ship:'',alertOnly:false,sort:'updated',page:1,tab:'all'});$('#q').value='';$('#fShip').value='';$('#fAlert').checked=false;$('#fSort').value='updated';render();}
function toggleSel(id,on){on?state.selected.add(id):state.selected.delete(id);render();}
function toggleAll(on){const list=filtered().slice((state.page-1)*state.size,state.page*state.size);list.forEach(p=>on?state.selected.add(p.id):state.selected.delete(p.id));render();}
function copyId(id){(navigator.clipboard?.writeText(id)||Promise.reject()).then(()=>toast('已复制商品 ID')).catch(()=>toast('ID '+id));}
function toggleMenu(e,id){e.stopPropagation();state.menu=state.menu===id?null:id;render();}
ROOT.addEventListener('click',e=>{if(state.menu&&!e.target.closest('.menu')){state.menu=null;render();}if(!e.target.closest('.pop,.more'))closePop();});
$('#dep').addEventListener('change',e=>{state.deposit=e.target.checked;render();IGV.setPaid(!state.deposit,'p');});
function payDeposit(){state.deposit=false;$('#dep').checked=false;render();IGV.setPaid(true,'p');toast('保证金已缴纳，上架功能已恢复');}

function edit(id,f){if(f==='open'){toast('跳转到商品编辑页');return;}state.editing={id,f};state.menu=null;render();setTimeout(()=>{const e=$('#ed');e&&e.focus();e&&e.select();},0);}
function edKey(e,id,f){if(e.key==='Enter')edSave(id,f);if(e.key==='Escape'){state.editing=null;render();}}
function edSave(id,f){const p=products.find(x=>x.id===id);const v=parseFloat($('#ed').value);
  if(isNaN(v)||v<0){toast('请输入有效数值');return;}
  if(f==='stock'){if(v<p.locked){toast(`不能低于锁定库存 ${p.locked}`);return;}p.stock=v;if(p.status==='soldout'&&v>0)p.status='onsale';if(p.status==='onsale'&&v===0)p.status='soldout';}
  else p.price=v;
  p.updated=now();state.editing=null;render();toast(f==='stock'?'库存已更新':'价格已更新');}
function now(){const d=new Date();return d.toISOString().slice(0,10)+' '+d.toTimeString().slice(0,5);}

function doOne(id,op){const p=products.find(x=>x.id===id);const r=can(p,op);if(r){toast(r);return;}
  if(op==='down'&&p.locked){openModal(`<div class="mh">下架商品<button class="x" onclick="closeModal()">✕</button></div><div class="mb"><div>${esc(p.title)}</div><div class="sub">该商品有 ${p.locked} 件锁定中的订单，下架后订单继续履约。</div></div><div class="mf"><button class="btn" onclick="closeModal()">取消</button><button class="btn pri" onclick="apply(['${id}'],'down');closeModal()">确认下架</button></div>`);return;}
  state.menu=null;apply([id],op);}
function apply(ids,op,param){let n=0;ids.forEach(id=>{const p=products.find(x=>x.id===id);if(!p||can(p,op))return;n++;
  if(op==='up'){p.status='onsale';delete p.offReason;}
  if(op==='down'){p.status='off';p.offReason='manual';p.offAt=now().slice(0,10);}
  if(op==='price'){p.price=newPrice(p,param);}
  if(op==='stock'){p.stock=newStock(p,param);if(p.status==='soldout'&&p.stock>0)p.status='onsale';if(p.status==='onsale'&&p.stock===0)p.status='soldout';}
  if(op==='del'){products=products.filter(x=>x.id!==id);state.selected.delete(id);}
  p.updated=now();});
  render();return n;}
function withdraw(id){const p=products.find(x=>x.id===id);p.status='off';p.offReason='manual';p.offAt=now().slice(0,10);state.menu=null;render();toast('已撤回验号，商品转为下架');}
function confirmDelOne(id){const p=products.find(x=>x.id===id);state.menu=null;
  openModal(`<div class="mh" style="color:var(--err)">删除商品<button class="x" onclick="closeModal()">✕</button></div><div class="mb"><div>${esc(p.title)}</div><div class="sub">删除后商品及其数据不可恢复。</div><label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="ack" onchange="$('#delBtn').disabled=!this.checked"> 我已知悉删除后不可恢复</label></div><div class="mf"><button class="btn" onclick="closeModal()">取消</button><button class="btn dng pri" id="delBtn" disabled onclick="apply(['${id}'],'del');closeModal();toast('已删除 1 件')">确认删除</button></div>`);}

// 属性浮层
function showAttrs(e,id){e.stopPropagation();closePop();const p=products.find(x=>x.id===id);const pop=document.createElement('div');pop.className='pop';pop.id='pop';
  pop.innerHTML=`<div style="font-weight:600">全部属性（${p.attrs.length}）</div>`+p.attrs.map(a=>`<div class="kv"><b>${esc(a[0])}：</b>${esc(a[1])}</div>`).join('');
  ROOT.appendChild(pop);const r=e.target.getBoundingClientRect();pop.style.top=Math.min(r.bottom+6,window.innerHeight-pop.offsetHeight-16)+'px';pop.style.left=Math.min(r.left,window.innerWidth-pop.offsetWidth-16)+'px';}
function closePop(){const p=$('#pop');p&&p.remove();}

// 原因抽屉
function showReason(id){const p=products.find(x=>x.id===id);let body='';
  if(p.status==='verifyErr'){const r=p.errReason;body=`<span class="pill err">审核验号异常</span><div class="kvl"><b>异常类型</b><span>${esc(r.type)}</span><b>详细说明</b><span>${esc(r.detail)}</span><b>建议操作</b><span>${esc(r.advice)}</span><b>发生时间</b><span>${r.time}</span></div>
    <div style="display:flex;gap:8px"><button class="btn pri" onclick="closeModal();toast('跳转到编辑页，保存后将重新验号')">修改后重新验号</button><button class="btn" onclick="toast('已发起客服会话')">联系客服</button></div>`;}
  else if(p.offReason==='system'){body=`<span class="pill gray">系统下架</span><div class="kvl"><b>下架原因</b><span>${esc(p.sysReason)}</span><b>下架时间</b><span>${p.offAt}</span><b>如何恢复</b><span>编辑商品，删除违规内容后提交，审核通过即可重新上架。</span></div><button class="btn pri" style="align-self:flex-start" onclick="closeModal();toast('跳转到编辑页')">去整改</button>`;}
  else {body=`<span class="pill gray">权限变更下架</span><div class="kvl"><b>下架原因</b><span>您当前的卖家等级 / 品类权限不包含「${esc(p.cat)}」，该商品已自动下架。</span><b>下架时间</b><span>${p.offAt}</span><b>如何恢复</b><span>在「等级中心」申请对应品类权限，通过后商品可重新上架。</span></div><button class="btn pri" style="align-self:flex-start" onclick="toast('跳转到等级中心')">申请权限</button>`;}
  $('#overlay').innerHTML=`<div class="ov" onclick="if(event.target===this)closeModal()"><div class="drawer"><div class="dh">原因说明<button class="x" onclick="closeModal()">✕</button></div><div class="db"><div style="font-weight:500">${esc(p.title)}</div><div class="sub">ID ${p.id}</div>${body}</div></div></div>`;}

// ---------- 批量 ----------
function openModal(inner){$('#overlay').innerHTML=`<div class="ov" onclick="if(event.target===this)closeModal()"><div class="modal">${inner}</div></div>`;}
function closeModal(){$('#overlay').innerHTML='';}
const liRow=(p,right)=>`<div class="li"><span>${esc(p.title)}</span><span>${right}</span></div>`;
function split(op){const sel=[...state.selected].map(id=>products.find(p=>p.id===id)).filter(Boolean);const ok=[],ex=[];sel.forEach(p=>{const r=can(p,op);r?ex.push([p,r]):ok.push(p);});return {ok,ex};}
function exList(ex){return ex.length?`<div class="grp">已排除（${ex.length}）<span style="font-weight:400;color:var(--muted)"> · 不会被处理</span></div>`+ex.map(([p,r])=>`<div class="li ex"><span>${esc(p.title)}</span><span>${esc(r)}</span></div>`).join(''):'';}

function batch(op){const {ok,ex}=split(op);const ids=JSON.stringify(ok.map(p=>p.id));
  const titles={up:'批量上架',down:'批量下架',price:'批量改价',stock:'批量改库存',del:'批量删除'};
  let body='',foot='';
  if(op==='up'||op==='down'){
    const expired=op==='up'?ok.filter(p=>p.offReason==='expired'):[];
    body=`<div>已选 ${ok.length+ex.length} 件，其中 <b>${ok.length} 件</b> 将被${op==='up'?'上架':'下架'}，<b>${ex.length} 件</b> 不符合条件已自动排除。</div>
      <div class="sub">${op==='up'?'上架后商品立即展示给买家。':'下架后商品不再展示，库存与价格保留，可随时重新上架。'}</div>
      <div class="grp">将${op==='up'?'上架':'下架'}（${ok.length}）</div>${ok.map(p=>liRow(p,money(p.price)+' '+unitTxt(p)+' · 库存 '+stockTxt(p)+(p.locked?` · 🔒${p.locked}`:''))).join('')}${exList(ex)}`;
    foot=`<button class="btn" onclick="closeModal()">取消</button><button class="btn pri" onclick="run(${ids},'${op}')">确认${op==='up'?'上架':'下架'} ${ok.length} 件</button>`;
  } else if(op==='price'||op==='stock'){
    const mixed=new Set(ok.map(p=>p.unit)).size>1;
    body=`<div>已选 ${ok.length+ex.length} 件，<b>${ok.length} 件</b> 可改，<b>${ex.length} 件</b> 已排除。</div>
      <div class="box"><div class="grp" style="margin:0">调整方式</div>
        <label class="rad"><input type="radio" name="m" value="set" ${mixed?'disabled':'checked'} onchange="preview('${op}')"> 统一设为 <input type="number" id="vSet" step="${op==='price'?'0.01':'1'}" oninput="preview('${op}')" ${mixed?'disabled':''}> ${op==='price'?'USD / 单位':''}${mixed?'<span class="sub">（混选不同单位时禁用）</span>':''}</label>
        ${op==='price'?`<label class="rad"><input type="radio" name="m" value="pct" ${mixed?'checked':''} onchange="preview('${op}')"> 按比例 <input type="number" id="vPct" value="-5" step="1" oninput="preview('${op}')"> %</label>`:''}
        <label class="rad"><input type="radio" name="m" value="add" onchange="preview('${op}')"> 增减${op==='price'?'金额':'数量'} <input type="number" id="vAdd" step="${op==='price'?'0.01':'1'}" placeholder="±" oninput="preview('${op}')"> ${op==='price'?'USD / 单位':'（按各自单位）'}</label>
        <div class="sub">${op==='price'?'结果保留两位小数；低于 $0.01 的项会被标红并排除。':'结果不能低于 0，也不能低于锁定数；不符合的项标红并排除。'}</div></div>
      <div class="grp">预览（${ok.length}）</div><div id="pv"></div>${exList(ex)}`;
    foot=`<button class="btn" onclick="closeModal()">取消</button><button class="btn pri" id="goBtn" onclick="run(${ids},'${op}',readParam())">确认修改</button>`;
  } else {
    body=`<div>已选 ${ok.length+ex.length} 件，<b>${ok.length} 件</b> 可删除，<b>${ex.length} 件</b> 已排除。删除后商品及其数据不可恢复。</div>
      <div class="grp">将删除（${ok.length}）</div>${ok.map(p=>liRow(p,'非标 · '+STATUS[p.status])).join('')}${exList(ex)}
      <label style="display:flex;gap:6px;align-items:center;margin-top:6px"><input type="checkbox" onchange="$('#goBtn').disabled=!this.checked"> 我已知悉删除后不可恢复</label>`;
    foot=`<button class="btn" onclick="closeModal()">取消</button><button class="btn dng pri" id="goBtn" disabled onclick="run(${ids},'del')">确认删除 ${ok.length} 件</button>`;
  }
  openModal(`<div class="mh" ${op==='del'?'style="color:var(--err)"':''}>${titles[op]}<button class="x" onclick="closeModal()">✕</button></div><div class="mb">${body}</div><div class="mf">${foot}</div>`);
  if(op==='price'||op==='stock')preview(op);
}
function readParam(){const m=ROOT.querySelector('input[name=m]:checked')?.value;const v=parseFloat($('#v'+({set:'Set',pct:'Pct',add:'Add'}[m]))?.value);return {m,v};}
function newPrice(p,{m,v}){if(isNaN(v))return p.price;const r=m==='set'?v:m==='pct'?p.price*(1+v/100):p.price+v;return Math.round(r*100)/100;}
function newStock(p,{m,v}){if(isNaN(v))return p.stock;return m==='set'?v:p.stock+v;}
function preview(op){const prm=readParam();const {ok}=split(op);let bad=0;
  const rows=ok.map(p=>{const nv=op==='price'?newPrice(p,prm):newStock(p,prm);const isBad=op==='price'?nv<0.01:(nv<0||nv<p.locked);if(isBad)bad++;
    return `<tr><td>${esc(p.title)}</td><td>${op==='price'?money(p.price)+' '+unitTxt(p):stockTxt(p)}</td><td class="${isBad?'bad':''}">${op==='price'?money(nv)+' '+unitTxt(p):(nv.toLocaleString()+(p.unit==='unit'?'':' '+p.unit))}${isBad?' · 排除':''}</td></tr>`;}).join('');
  $('#pv').innerHTML=`<div class="scroll"><table class="prev"><thead><tr><th>商品</th><th>当前</th><th>新值</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  const g=$('#goBtn');g.disabled=isNaN(prm.v)||ok.length-bad===0;g.textContent=`确认修改 ${ok.length-bad} 件`;}

function run(ids,op,param){
  // 改价/改库存：剔除预览里标红的
  if(op==='price'||op==='stock')ids=ids.filter(id=>{const p=products.find(x=>x.id===id);const nv=op==='price'?newPrice(p,param):newStock(p,param);return op==='price'?nv>=0.01:(nv>=0&&nv>=p.locked);});
  const total=ids.length;const failIdx=total>=4?1:-1; // 演示：第 2 件失败
  openModal(`<div class="mh">正在处理…</div><div class="mb"><div id="pt">0 / ${total}</div><div class="prog"><i id="pb" style="width:0"></i></div></div>`);
  let i=0;const done=[],failed=[];
  const tick=()=>{if(i>=total){finish();return;}const id=ids[i];
    if(i===failIdx){failed.push(id);}else{apply([id],op,param);done.push(id);}
    i++;$('#pt').textContent=`${i} / ${total}`;$('#pb').style.width=(i/total*100)+'%';setTimeout(tick,220);};
  const finish=()=>{const verb={up:'上架',down:'下架',price:'改价',stock:'改库存',del:'删除'}[op];
    const exN=state.selected.size-total;
    if(!failed.length){closeModal();state.selected.clear();render();toast(`已${verb} ${done.length} 件${exN>0?`，跳过 ${exN} 件`:''}`);return;}
    const p=products.find(x=>x.id===failed[0]);
    openModal(`<div class="mh">部分失败<button class="x" onclick="closeModal();state.selected.clear();render()">✕</button></div><div class="mb"><div>已完成 ${done.length} 件，<b style="color:var(--err)">${failed.length} 件失败</b>。</div>
      <div class="li" style="border-color:var(--err)"><span>${esc(p.title)}</span><span class="r">网络超时</span></div></div>
      <div class="mf"><button class="btn" onclick="closeModal();state.selected.clear();render()">关闭</button><button class="btn pri" onclick="apply(${JSON.stringify(failed)},'${op}',${JSON.stringify(param||null)});closeModal();state.selected.clear();render();toast('重试成功，已${verb} ${failed.length} 件')">重试失败项</button></div>`);};
  setTimeout(tick,200);
}
render();

let __stSaved=null;const __render=render;
render=function(){__render();const ns=IGV.status==='nosell';$('#banBar').hidden=!ns;if(!ns)return;$('#depositBar').hidden=true;$('#attnBar').hidden=true;
  ROOT.querySelectorAll('#rows button,#toolbar button,.hd button').forEach(b=>{b.disabled=true;b.title='店铺已被禁止售卖'})};
IGV.onStatus(s=>{
  if(s==='nosell'&&!__stSaved){__stSaved=new Map(products.map(p=>[p,{status:p.status,offReason:p.offReason,offAt:p.offAt}]));products.forEach(p=>{p.status='off';p.offReason='ban';p.offAt='2026-11-24'});state.selected.clear();state.editing=null;state.menu=null;state.tab='all';state.alertOnly=false}
  else if(s!=='nosell'&&__stSaved){products.forEach(p=>{const o=__stSaved.get(p);if(o){p.status=o.status;if(o.offReason)p.offReason=o.offReason;else delete p.offReason;p.offAt=o.offAt}});__stSaved=null}
  if(typeof closeModal==='function')closeModal();render()});
IGV.onPaid((v,from)=>{if(from==='p')return;state.deposit=!v;$('#dep').checked=!v;render()});
</script>
<script>
/* ===== module: listing ===== */
try{
(function(){
const ROOT=IGV.root('listing','en');

/* ---------- helpers ---------- */
const $=(s,r=ROOT)=>r.querySelector(s), $$=(s,r=ROOT)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const int=n=>Math.round(n).toLocaleString('en-US');
const now=()=>new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
const num=x=>{if(x==null)return null;const s=String(x).replace(/,/g,'').trim();if(s==='')return null;return /^-?\d*\.?\d+$/.test(s)?Number(s):NaN};
const IC={
  check:'<svg class="i" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  alert:'<svg class="i" viewBox="0 0 24 24"><path d="M12 8v5M12 16.5v.5"/><circle cx="12" cy="12" r="9"/></svg>',
  lock:'<svg class="i" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>',
  chev:'<svg class="i" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>',

};
function lev(a,b){a=a.toLowerCase();b=b.toLowerCase();const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}

/* ---------- field configuration (one source for single and bulk) ---------- */
