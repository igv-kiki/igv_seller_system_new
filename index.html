const LINK_RE=/(https?:\/\/\S+|www\.\S+|t\.me\/\S*|discord\.gg\/\S*|whatsapp|telegram|[\w.+-]+@[\w-]+\.[\w.]+)/i;

/* ---------- validation: the same rules run for a single listing and for every bulk row ---------- */
function check(sc,v,o={}){
  const I=[],add=(k,kind,type,msg,fix)=>I.push({k,kind,type,msg,fix});
  const has=k=>v[k]!=null&&String(v[k]).trim()!=='';
  const req=(k,l)=>has(k)?true:(add(k,'req','req:'+k,l+' is required'),false);
  const pick=(k,l,opts)=>{if(req(k,l)&&!opts.includes(v[k])){const s=nearest(v[k],opts);add(k,'err','opt:'+k,`“${v[k]}” is not an option for ${l.toLowerCase()}`,{label:`Use ${s}`,set:{[k]:s}})}};
  const auto=!o.bulk&&!!sc.listingMethod&&v.listingMethod==='easy';
  if(!auto)sc.attrs.forEach(a=>a.t==='select'?pick(a.k,a.l,a.o):req(a.k,a.l));
  if(!o.bulk){
    if(sc.listingMethod&&req('listingMethod','Listing method')&&v.listingMethod==='easy')req('easyVia','Where to verify');
    if(sc.content==='seller'&&!auto){
      if(req('title','Title')){const n=v.title.trim().length;
        if(n<5)add('title','err','title',`Title needs at least 5 characters (${n} now)`);
        else if(n>144)add('title','err','title',`Title is ${n-144} characters over the 144 limit`)}
      if(!(o.files||[]).length)add('images','req','req:images','Add at least 1 image or video');
      if(req('description','Description')){const d=v.description.trim(),m=d.match(LINK_RE);
        if(d.length>8000)add('description','err','desc',`Description is ${int(d.length-8000)} characters over the 8,000 limit`);
        else if(m)add('description','err','desc',`Remove the link or contact details: “${m[0].slice(0,40)}”`)}
    }
    (sc.creds||[]).forEach(c=>req(c.k,c.l));
  }
  if(!sc.fixedMethod){pick('deliveryMethod','Delivery method',sc.methods);pick('deliveryTime','Delivery time',sc.times)}
  pick('currency','Currency',CUR);pick('warranty','Warranty period',sc.warranty);
  const p=num(v.price);let pOk=false;
  if(p===null)add('price','req','req:price','Unit price is required');
  else if(isNaN(p))add('price','err','price','Enter a number, for example 12.50');
  else if(p<=0)add('price','err','price','Unit price must be more than 0');
  else if(p>999999)add('price','err','price','Unit price can be at most 999,999');
  else if(!/^\d*(\.\d{1,2})?$/.test(String(v.price).replace(/,/g,'').trim()))add('price','err','price','Use at most 2 decimal places');
  else if(sc.minPrice&&p<sc.minPrice)add('price','err','price-min',`Minimum price for accounts is ${money(sc.minPrice)} ${v.currency||'USD'}`,{label:`Set to ${money(sc.minPrice)}`,set:{price:money(sc.minPrice)}});
  else pOk=true;
  if(sc.stock){
    const s=num(v.stock);let sOk=false;
    if(s===null)add('stock','req','req:stock','Total stock is required');
    else if(!Number.isInteger(s)||s<1||s>999999)add('stock','err','stock','Total stock must be a whole number from 1 to 999,999');
    else{sOk=true;
      if(pOk&&Math.round(p*100)*s/100>999999){const mx=Math.floor(999999/p);

    else if(!Number.isInteger(m)||m<1)add('minQty','err','min','Min purchase must be a whole number, 1 or more',{label:'Set to 1',set:{minQty:'1'}});
    else if(sOk&&m>s)add('minQty','err','min-stock',`Min purchase (${int(m)}) is more than stock (${int(s)})`,{label:`Set to ${int(s)}`,set:{minQty:String(s)}});
    else mOk=true;
    const x=num(v.maxQty);
    if(x!==null){
      if(!Number.isInteger(x)||x<1)add('maxQty','err','max','Max purchase must be a whole number, 1 or more');

      else if(mOk&&x<m)add('maxQty','err','max-min',`Max purchase (${int(x)}) is less than min purchase (${int(m)})`,{label:`Set to ${int(m)}`,set:{maxQty:String(m)}});

    }
  }

}

  </div></section>

function isLocked(){return !!sc().listingMethod&&!S.single.v.listingMethod}
const isAuto=()=>!!sc().listingMethod&&S.single.v.listingMethod==='easy';
function singleIssues(){const st=S.single,c=sc(),I=check(c,st.v,{files:st.files});return isLocked()?I.filter(i=>secOf(c,i.k)!=='details'):I}
function refreshSingle(dirty=true){
  const c=sc(),st=S.single,v=st.v,I=singleIssues();
  $$('.field[data-f]').forEach(f=>{const k=f.dataset.f,is=I.find(i=>i.k===k),showIt=is&&(st.showAll||st.touched[k]);
    f.classList.toggle('bad',!!showIt);const e=$('.err',f),h=showIt?esc(is.msg)+(is.fix?` <button type="button" class="btn sm" data-fix='${esc(JSON.stringify(is.fix.set))}'>${esc(is.fix.label)}</button>`:''):'';if(e&&e._h!==h){e.innerHTML=h;e._h=h}});
  const p=num(v.price),pv=p!==null&&!isNaN(p)&&p>0,fee=pv?Math.round(p*c.commission*100)/100:0;
  $('#earn').innerHTML=pv?`<span>Unit price</span><span class="num">${money(p)} ${v.currency}</span><span>Commission ${c.commission*100}%</span><span class="num">− ${money(fee)}</span><span class="t">You receive per unit</span><span class="t num">${money(p-fee)} ${v.currency}</span>`
    :`<span class="muted">Enter a price to see the ${c.commission*100}% commission and what you receive.</span>`;
  const tot=$('#total');if(tot){const s=num(v.stock),sv=s!==null&&!isNaN(s)&&s>0;
    if(pv&&sv){const t=p*s,over=t>999999;tot.innerHTML=`<span>Stock × price</span><span class="num">${int(t)} of 999,999 ${v.currency}</span><div class="meter ${over?'over':''}"><i style="width:${Math.min(100,t/9999.99)}%"></i></div>`}
    else tot.innerHTML='<span class="muted">Stock × price can be at most 999,999. Enter both to check.</span>'}
  const wn=$('#warNote');if(wn)wn.textContent=v.warranty?`Earnings are released and can be withdrawn after the ${v.warranty.replace(' Days','-day')} warranty ends. A longer warranty may rank higher.`:'Earnings are released after the warranty ends. A longer warranty may rank higher.';
  const ct=$('#cnt-title');if(ct)ct.textContent=(v.title||'').trim().length+' / 144';
  const cd=$('#cnt-desc');if(cd)cd.textContent=int((v.description||'').trim().length)+' / 8,000';
  // checklist
  let left=0;
  secsOf(c).forEach(([id])=>{const mine=I.filter(i=>secOf(c,i.k)===id),bad=mine.filter(i=>st.showAll||(i.kind==='err'&&st.touched[i.k])).length,rq=mine.filter(i=>i.kind==='req').length;left+=mine.length;
    const cls=bad?'badi':mine.length||(id==='details'&&isLocked())?'':'done',li=$('#chk-'+id);
    if(li.className!==cls||!li._init){li.className=cls;$('.dot',li).innerHTML=cls==='done'?IC.check:'';li._init=1}
    $('.st',li).textContent=id==='details'&&isLocked()?'Opens after step 1':id==='details'&&isAuto()?'Automatic':bad?`${bad} to fix`:rq?`${rq} required left`:mine.length?`${mine.length} to check`:'Complete'});
  $('#mleft').textContent=left?left+' item'+(left>1?'s':'')+' left':'Ready to publish';
  if(dirty){st.dirty=true;autosave()}
}
function drawThumbs(){const t=$('#thumbs');if(!t)return;const st=S.single;
  t.innerHTML=st.files.map((f,i)=>`<div class="thumb" style="${f.url?`background-image:url(${f.url})`:''}"><span>${esc(f.name)}</span><button type="button" aria-label="Remove ${esc(f.name)}" data-rm="${i}">×</button></div>`).join('');
  $('#fileErr').innerHTML=st.fileErr.map(m=>`<p class="small" style="color:var(--bad)">${esc(m)}</p>`).join('')}
function addFiles(list){const st=S.single;st.fileErr=[];
  [...list].forEach(f=>{const ext=(f.name.split('.').pop()||'').toLowerCase(),mb=f.size/1048576;
    if(!['png','jpg','jpeg','mp4'].includes(ext))st.fileErr.push(`${f.name} is not supported. Use PNG, JPG, JPEG or MP4.`);
    else if(ext==='mp4'&&mb>20)st.fileErr.push(`${f.name} is ${mb.toFixed(1)} MB. Videos can be up to 20 MB.`);
    else if(ext!=='mp4'&&mb>5)st.fileErr.push(`${f.name} is ${mb.toFixed(1)} MB. Images can be up to 5 MB.`);
    else st.files.push({name:f.name,url:ext==='mp4'?'':URL.createObjectURL(f)})});
  st.touched.images=true;drawThumbs();refreshSingle()}
let saveT;function autosave(){clearTimeout(saveT);const el=$('#savedAt');if(el)el.textContent='Saving…';saveT=setTimeout(()=>saveDraft(false),700)}
function saveDraft(manual){

    d={type:'single',game:S.game,cat:S.cat,v,descHtml:S.single.descHtml,savedAt:S.single.savedAt}}
  else if(S.view==='bulk'&&S.bulk){S.bulk.savedAt=now();d={type:'bulk',game:S.game,cat:S.cat,shared:S.bulk.shared,rows:S.bulk.rows.filter(r=>!r.pub).map(r=>({v:r.v,o:r.o})),savedAt:S.bulk.savedAt}}
  else return;

  const el=$('#savedAt');if(el)el.textContent='Draft saved '+d.savedAt;
  if(manual)toast(d.type==='single'&&sc().creds?'Draft saved. Private delivery information is not stored in drafts.':'Draft saved')}

    ${S.deposit?'':`<div class="note warn">${IC.alert}<div class="grow">Your security deposit is not paid, so buyers will not see this listing yet.</div><button class="link" data-act="pay">Pay deposit now</button></div>`}

function renderDone(){const c=sc(),st=S.single,v=st.v,easy=!!st.verif,name=easy?`${esc(c.game)} account`:esc(c.content==='seller'?v.title:`${c.game} ${c.cat} · ${v.server}`);

/* ---------- state & helpers ---------- */
var S={lang:'en',period:30,tab:'all',rating:0,pid:'',tag:'',soon:false,rep:false,textOnly:false,q:'',sort:'new',page:1,
       open:null,navIds:[],draft:'',editing:false,reportOpen:false,repReason:'threat',repNote:'',justPosted:null,showOrig:{}};
function t(k){var v=I18N[S.lang][k];if(typeof v==='function')return v.apply(null,[].slice.call(arguments,1));return v===undefined?k:v;}
function $(q){return ROOT.querySelector(q);}
function esc(x){return String(x).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function loc(){return S.lang==='zh'?'zh-CN':'en-US';}
function fmtDate(ts,time){var o={year:'numeric',month:'short',day:'numeric'};if(time){o.hour='2-digit';o.minute='2-digit';}return new Intl.DateTimeFormat(loc(),o).format(new Date(ts));}
function fmtShort(ts){return new Intl.DateTimeFormat(loc(),{month:'short',day:'numeric'}).format(new Date(ts));}
function fmtRel(ts){var df=NOW-ts;if(df<6e4)return t('justNow');if(df<H)return t('mAgo',Math.round(df/6e4));if(df<D)return t('hAgo',Math.floor(df/H));if(df<7*D)return t('dAgo',Math.floor(df/D));return fmtDate(ts);}
function fmtDur(min){
  if(min<60)return Math.max(1,Math.round(min))+t('min');
  if(min<1440){var h=Math.floor(min/60),m=Math.round(min%60);if(m===60){h++;m=0;}return h+t('hr')+(m?' '+m+t('mn'):'');}
  return t('days',Math.round(min/144)/10);
}
function fmtLeft(ms){return ms<D?t('hours',Math.max(1,Math.floor(ms/H))):t('days',Math.floor(ms/D));}
function stars(r,cls){var o='';for(var i=1;i<=5;i++)o+=i<=r?'★':'<i>★</i>';return '<span class="stars '+(r<=2?'low ':'')+(cls||'')+'" aria-label="'+r+'/5">'+o+'</span>';}
function canReply(r){return !r.reply&&NOW<r.ts+WINDOW*D;}
function needsReply(r){return r.rating<=3&&canReply(r);}
function leftMs(r){return r.ts+WINDOW*D-NOW;}
function soon(r){return needsReply(r)&&leftMs(r)<=3*D;}
function inRange(a,b){return REVIEWS.filter(function(r){return r.ts>NOW-a*D&&r.ts<=NOW-b*D;});}
function stat(l){var n=l.length,sum=0,dist=[0,0,0,0,0,0];l.forEach(function(r){sum+=r.rating;dist[r.rating]++;});
  return{n:n,avg:n?sum/n:0,pos:n?(dist[4]+dist[5])/n:0,neg:dist[1]+dist[2],dist:dist};}
function median(a){a=a.slice().sort(function(x,y){return x-y;});var m=Math.floor(a.length/2);return a.length%2?a[m]:(a[m-1]+a[m])/2;}
function shownText(r){if(!r.text)return null;if(S.showOrig[r.id])return r.raw;return S.lang==='en'?r.text.en:r.text.zh;}
function isTranslated(r){return r.text&&r.orig!==S.lang;}
function hay(r){return[r.order.id,PM[r.pid].name,r.buyer,r.text?r.text.en+' '+r.text.zh+' '+r.raw:'',r.reply?r.reply.text:''].join(' ').toLowerCase();}
function periodList(){return REVIEWS.filter(function(r){return r.ts>NOW-S.period*D;});}
function getList(){
  var l=periodList();
  if(S.tab==='needs')l=l.filter(needsReply);else if(S.tab==='replied')l=l.filter(function(r){return r.reply;});
  if(S.rating)l=l.filter(function(r){return r.rating===S.rating;});
  if(S.pid)l=l.filter(function(r){return r.pid===S.pid;});
  if(S.tag)l=l.filter(function(r){return r.rating<=3&&r.tags.indexOf(S.tag)>=0;});
  if(S.soon)l=l.filter(soon);
  if(S.rep)l=l.filter(function(r){return r.report;});
  if(S.textOnly)l=l.filter(function(r){return r.text;});
  var q=S.q.trim().toLowerCase();if(q)l=l.filter(function(r){return hay(r).indexOf(q)>=0;});
  var f={new:function(a,b){return b.ts-a.ts;},old:function(a,b){return a.ts-b.ts;},low:function(a,b){return a.rating-b.rating||b.ts-a.ts;},high:function(a,b){return b.rating-a.rating||b.ts-a.ts;}}[S.sort];
  return l.slice().sort(f);
}
function hasFilters(){return S.rating||S.pid||S.tag||S.soon||S.rep||S.textOnly||S.q.trim();}
function resetFilters(){S.rating=0;S.pid='';S.tag='';S.soon=false;S.rep=false;S.textOnly=false;S.q='';S.page=1;}
var toastT;
function toast(m){var el=$('#toast');el.textContent=m;el.className='on';clearTimeout(toastT);toastT=setTimeout(function(){el.className='';},2200);}

/* ---------- render: overview ---------- */
function delta(d,txt,goodUp,hasPrev){
  if(!hasPrev)return '<span class="dl flat">'+t('noPrev')+'</span>';
  if(Math.abs(d)<1e-9)return '<span class="dl flat">'+t('noChange')+'</span>';
  var up=d>0;return '<span class="dl '+(up===goodUp?'good':'bad')+'">'+(up?'▲':'▼')+' '+txt+'</span>';
}
function trendSVG(P){
  var nb=P===7?7:P===30?6:9,w=P/nb,raw=[],i;
  for(i=nb-1;i>=0;i--){var st=stat(inRange((i+1)*w,i*w));raw.push(st.n?st.avg:null);}
  var last=raw.filter(function(v){return v!=null;})[0];
  if(last==null)return '<p class="muted small">'+t('noData')+'</p>';
  var v=raw.map(function(x){if(x==null)return last;last=x;return x;});
  var mn=Math.min(4,Math.floor((Math.min.apply(null,v)-.05)*2)/2),mx=5,W=340,HH=118,pl=28,pr=10,pt=10,pb=22;
  function X(i){return pl+i*(W-pl-pr)/(nb-1);}function Y(a){return pt+(mx-a)/(mx-mn)*(HH-pt-pb);}
  var pts=v.map(function(a,i){return X(i).toFixed(1)+','+Y(a).toFixed(1);});
  var g='';[mx,(mx+mn)/2,mn].forEach(function(a){g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(a)+'" y2="'+Y(a)+'" stroke="#E9ECF1"/><text x="'+(pl-6)+'" y="'+(Y(a)+3)+'" text-anchor="end">'+a.toFixed(a%1?2:1)+'</text>';});
  var dots=v.map(function(a,i){var lastPt=i===nb-1;return '<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(a).toFixed(1)+'" r="'+(lastPt?4:2.5)+'" fill="'+(lastPt?'#1f5eff':'#fff')+'" stroke="#1f5eff" stroke-width="1.5"><title>'+fmtShort(NOW-(nb-1-i)*w*D)+' · '+t('trendTip',a.toFixed(2))+'</title></circle>';}).join('');
  return '<svg viewBox="0 0 '+W+' '+HH+'" role="img" aria-label="'+t('trend')+'">'+g+
    '<path d="M'+pts.join(' L')+' L'+X(nb-1)+','+Y(mn)+' L'+X(0)+','+Y(mn)+' Z" fill="#1f5eff" opacity=".08"/>'+
    '<polyline points="'+pts.join(' ')+'" fill="none" stroke="#1f5eff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'+dots+
    '<text x="'+pl+'" y="'+(HH-5)+'">'+fmtShort(NOW-P*D)+'</text><text x="'+(W-pr)+'" y="'+(HH-5)+'" text-anchor="end">'+t('today')+'</text></svg>';
}
function renderOverview(){

/* ---------- render: issues ---------- */
function computeIssues(){
  var P=S.period,cur=inRange(P,0).filter(function(r){return r.rating<=3;}),prev=inRange(2*P,P).filter(function(r){return r.rating<=3;}),m={};
  cur.forEach(function(r){r.tags.forEach(function(g){(m[g]=m[g]||[]).push(r);});});
  return Object.keys(m).map(function(g){
    var l=m[g],by={};l.forEach(function(r){by[r.pid]=(by[r.pid]||0)+1;});
    var top=Object.keys(by).sort(function(a,b){return by[b]-by[a];})[0];
    return{g:g,n:l.length,top:top,topN:by[top],d:l.length-prev.filter(function(r){return r.tags.indexOf(g)>=0;}).length,list:l};
  }).filter(function(x){return x.n>=2;}).sort(function(a,b){return b.n-a.n;}).slice(0,3);
}
function renderIssues(){
  var P=S.period,is=computeIssues(),tags=t('tags'),tips=t('tips'),body;
  if(!is.length)body='<div class="card empty-line"><span class="ok">✓</span><div><b>'+t('noIssues')+'</b><div class="muted small">'+t('noIssuesSub')+'</div></div></div>';
  else body='<div class="issues">'+is.map(function(x){
    var ch=x.d>0?'<span class="dl bad">'+t('more',x.d,P)+'</span>':x.d<0?'<span class="dl good">'+t('less',-x.d,P)+'</span>':'<span class="dl flat">'+t('same')+'</span>';
    var fact='';
    if(x.g==='slow'){var a=x.list.filter(function(r){return r.pid===x.top;}).map(function(r){return r.order.actual;});fact='<div class="fact">'+t('factSlow',fmtDur(median(a)),fmtDur(PM[x.top].promised))+'</div>';}
    return '<article class="card issue"><div class="issue-top"><div><h3>'+tags[x.g]+'</h3><div class="n num">'+t('nReviews',x.n)+'</div></div>'+ch+'</div>'+
      '<div class="where">'+t('mostly',x.topN,x.n)+' <b>'+esc(PM[x.top].name)+'</b></div>'+fact+
      '<div class="tip"><b>'+t('tipLbl')+'</b> '+tips[x.g]+'</div>'+
      '<button class="link" data-act="issue" data-v="'+x.g+'">'+t('viewThese')+' ›</button></article>';}).join('')+'</div>';
  var pm={};inRange(P,0).forEach(function(r){if(r.rating>=4)r.tags.forEach(function(g){pm[g]=(pm[g]||0)+1;});});
  var pr=Object.keys(pm).sort(function(a,b){return pm[b]-pm[a];}).slice(0,3);
  var praise=pr.length?'<div class="praise">'+t('praise')+pr.map(function(g){return ' <span class="tag">'+tags[g]+' · '+pm[g]+'</span>';}).join('')+'</div>':'';

function nextNeed(curId){
  var i=S.navIds.indexOf(curId),after=S.navIds.slice(i+1).concat(S.navIds.slice(0,Math.max(i,0)));
  for(var k=0;k<after.length;k++){var r=RM[after[k]];if(r.id!==curId&&needsReply(r))return r.id;}
  var g=REVIEWS.filter(function(r){return r.id!==curId&&needsReply(r);})[0];return g?g.id:null;
}
function openReview(id,focus,keepNav){
  S.open=id;S.draft='';S.editing=false;S.reportOpen=false;S.repNote='';S.repReason='threat';S.justPosted=null;
  if(!keepNav)S.navIds=getList().map(function(r){return r.id;});
  renderDrawer(!keepNav,focus);
}

function renderAll(focus){renderPage();renderDrawer(false,focus);}
function toList(){var el=$('#list');if(el&&el.scrollIntoView)el.scrollIntoView({behavior:'smooth',block:'start'});}

/* ---------- events ---------- */
ROOT.addEventListener('click',function(e){
  var el=e.target.closest?e.target.closest('[data-act]'):null;if(!el||el.disabled)return;
  var a=el.getAttribute('data-act'),v=el.getAttribute('data-v'),r=S.open&&RM[S.open];
  switch(a){
   case 'lang':S.lang=v;renderAll();break;
   case 'period':S.period=+v;S.page=1;renderPage();break;
   case 'rating':S.rating=S.rating===+v?0:+v;S.page=1;renderPage();toList();break;
   case 'att-needs':resetFilters();S.tab='needs';S.period=Math.max(S.period,30);renderPage();toList();break;
   case 'att-soon':resetFilters();S.tab='needs';S.soon=true;S.period=Math.max(S.period,30);renderPage();toList();break;
   case 'att-rep':resetFilters();S.tab='all';S.rep=true;S.period=Math.max(S.period,30);renderPage();toList();break;
   case 'issue':resetFilters();S.tab='all';S.tag=v;renderPage();toList();break;
   case 'tab':S.tab=v;S.page=1;renderPage();break;
   case 'clear':resetFilters();renderPage();break;
   case 'unchip':S[v]=v==='tag'?'':false;S.page=1;renderPage();break;
   case 'page':S.page+=+v;renderRes();toList();break;
   case 'open':openReview(el.getAttribute('data-id'),!!el.getAttribute('data-focus'));break;
   case 'close':S.open=null;renderDrawer();break;
   case 'nav':var i=S.navIds.indexOf(S.open)+(+v);if(i>=0&&i<S.navIds.length)openReview(S.navIds[i],false,true);break;
   case 'orig':S.showOrig[r.id]=!S.showOrig[r.id];renderRes();renderDrawer();break;
   case 'tpl':S.draft=TPL[v];renderDrawer(false,true);break;
   case 'post':
    var txt=S.draft.trim();if(!txt)break;
    if(S.editing){r.reply.text=txt;r.reply.edited=true;toast(t('tSaved'));}
    else{r.reply={text:txt,ts:NOW};S.justPosted=r.id;toast(t('tPosted'));}
    S.draft='';S.editing=false;renderAll();break;
   case 'edit':S.editing=true;S.draft=r.reply.text;S.justPosted=null;renderDrawer(false,true);break;
   case 'cancel-edit':S.editing=false;S.draft='';renderDrawer();break;
   case 'next-need':var nx=nextNeed(r.id);if(nx)openReview(nx,true,S.navIds.indexOf(nx)>=0);break;

function field(f,F){const v=F.v[f.k]??'',e=F.err[f.k],id='mf-'+f.k,req=f.opt?'':' <i>*</i>';

function lForm(){const F=ui.form,t=F.type&&TYPES[F.type],edit=F.mode==='edit';
  return `<div class="ov"><div class="drawer" role="dialog" aria-label="Payout method form">

    ${t?`${F.type==='usdt'?`<div class="note info">Please make sure your country/region matches your nationality. Otherwise, you may not be able to use fiat payout methods.</div>`:''}
      <div class="rules" style="margin:0"><div><span>Fee</span>${feeText(t)}</div><div><span>Limit</span>${t.min} - ${t.max} USD</div><div><span>Per day</span>${t.perDay==null?'Unlimited':t.perDay+' time(s)'}</div><div><span>Settlement</span>${SETTLE}</div></div>

        ${t.fields.map(f=>field(f,F)).join('')}
      </div>
      <label class="row"><input type="checkbox" id="mf-default" name="isDefault" ${F.v.isDefault?'checked':''}> Set as Default Payout Method</label>
      <div class="sec"><h3>Security verification</h3>
        <div class="f"><label for="mf-pwd">Security Password <i>*</i></label><input type="password" id="mf-pwd" name="pwd" class="${F.err.pwd?'bad':''}" autocomplete="new-password">${F.err.pwd?`<span class="e">${F.err.pwd}</span>`:''}</div>
        <div class="f"><label for="mf-code">Email Verification <i>*</i></label><div class="row"><input type="text" id="mf-code" name="code" inputmode="numeric" maxlength="6" placeholder="6-digit code" class="${F.err.code?'bad':''}" style="flex:1"><button type="button" class="btn" id="sendCode" data-act="sendCode">${F.sent?'Resend':'Send Code'}</button></div>
          <small>Payout Email Address: ${SELLER_EMAIL}</small>${F.err.code?`<span class="e">${F.err.code}</span>`:''}</div>
        <div class="f"><label for="mf-ga">Google Authenticator <i>*</i></label><input type="text" id="mf-ga" name="ga" inputmode="numeric" maxlength="6" placeholder="6-digit code" class="${F.err.ga?'bad':''}">
          <small>Open Google Authenticator on your phone or in your browser extension and enter the current code. <a data-act="ga">Not Installed? Install Now</a></small>${F.err.ga?`<span class="e">${F.err.ga}</span>`:''}</div>
      </div>`:`<div class="empty">Choose a payout method type to continue.</div>`}
  </form>
  <div class="df"><button class="btn" data-act="close">Cancel</button><button class="btn pri" id="saveM" data-act="saveM" ${t?'':'disabled'}>${edit?'Save and resubmit':'Save'}</button></div></div></div>`}
function readForm(){const F=ui.form,fm=$('#mform');if(!fm)return;
  [...fm.elements].forEach(el=>{if(!el.name)return;if(el.type==='file'){if(el.files[0]){F.v[el.name]=el.files[0].name;F.size=el.files[0].size}}
    else if(el.type==='checkbox')F.v[el.name]=el.checked;else F.v[el.name]=el.value.trim()})}
function saveMethod(){readForm();const F=ui.form,t=TYPES[F.type],e=F.err={};
  if(!t){e.type='Choose a payout method type.';return openLayer({k:'form'})}
  t.fields.forEach(f=>{const v=F.v[f.k];if(!v){if(!f.opt)e[f.k]=f.file?'Upload a file to continue.':`${f.l} is required.`}
    else if(f.re&&!f.re.test(v))e[f.k]=f.reMsg; else if(f.file&&!/\.(pdf|png|jpe?g)$/i.test(v))e[f.k]='Use a PDF, PNG or JPG file.'; else if(f.file&&F.size>10*1048576)e[f.k]='The file is larger than 10 MB.'});
  if(!F.v.pwd)e.pwd='Enter your security password.';
  if(!F.sent)e.code='Select Send Code, then enter the code from your email.';else if(!/^\d{6}$/.test(F.v.code||''))e.code='Enter the 6-digit code from your email.';else if(F.v.code==='000000')e.code='This code is incorrect or expired. Request a new one.';
  if(!/^\d{6}$/.test(F.v.ga||''))e.ga='Enter the 6-digit code from Google Authenticator.';else if(F.v.ga==='000000')e.ga='This code is incorrect. Enter the current code.';
  if(Object.keys(e).length){openLayer({k:'form'});const first=$('#layer .bad, #layer .e');first&&first.scrollIntoView({block:'center'});return}
  const b=$('#saveM');b.disabled=true;b.textContent='Saving…';
  later(800,()=>{const v={};t.fields.forEach(f=>v[f.k]=F.v[f.k]||'');
    let m;if(F.mode==='edit'){m=S.methods.find(x=>x.id===F.id);Object.assign(m,{v,currency:F.v.currency,status:'pending',failReason:null})}
    else{m={id:'m'+Date.now(),type:F.type,currency:F.v.currency,status:'pending',isDefault:false,v};S.methods.push(m)}
    if(F.v.isDefault){S.methods.forEach(x=>x.isDefault=false);m.isDefault=true}
    closeLayer();go('methods');toast('Payout method submitted. Verification has started.');verifyFlow(m.id)})}
function verifyFlow(id){const result=S.nextVerify;
  later(2500,()=>{const m=S.methods.find(x=>x.id===id);if(!m)return;m.status='verifying';refresh()});
  later(7000,()=>{const m=S.methods.find(x=>x.id===id);if(!m)return;
    if(result==='pass'){m.status='verified';toast(`${TYPES[m.type].name} is verified. You can withdraw to it now.`)}
    else{m.status='failed';m.failReason=FAIL_VERIFY[m.type];toast(`${TYPES[m.type].name} verification failed. See the reason on the card.`)}refresh()})}
function lDelete(id){const m=S.methods.find(x=>x.id===id),busy=S.wds.filter(w=>inProg(w)&&w.type===m.type&&w.acct===acct(m)).length;
  return `<div class="ov" data-act="close"><div class="modal" role="dialog" aria-label="Delete payout method" data-stop><div class="dh"><h2>Notice</h2><button class="x" data-act="close" aria-label="Close">×</button></div>
  <div class="db"><div>Are you sure you want to delete this payout method?</div><div class="row">${mIcon(m.type)}<div><b>${TYPES[m.type].name}</b> <span class="tag">${m.currency}</span><div class="muted small">${esc(acct(m))}</div></div></div>
  ${m.isDefault?`<div class="note warn">This is your default payout method. After deleting it you will have no default until you set another one.</div>`:''}

/* ---------- Withdraw flow ---------- */
function pickDefault(){const u=S.methods.filter(usable);ui.wd.methodId=(u.find(m=>m.isDefault)||u[0]||{}).id||null}
function startWd(id){ui.wd={methodId:null,amount:'',manual:null,step:'form',no:null};if(id&&usable(S.methods.find(m=>m.id===id)||{}))ui.wd.methodId=id;else pickDefault();closeLayer();go('withdraw')}
function wdCalc(){const m=S.methods.find(x=>x.id===ui.wd.methodId);if(!m||!usable(m))return {m:null};
  const t=TYPES[m.type],cur=m.currency,order=[cur,...['USD','EUR','USDT'].filter(c=>c!==cur)].filter(c=>S.bal[c]);
  const rows=order.map(c=>({c,avail:S.bal[c].w,rate:rate(c,cur),availIn:fl2(S.bal[c].w*rate(c,cur))}));
  const total=r2(rows.reduce((a,r)=>a+r.availIn,0)),min=r2(t.min*rate('USD',cur)),max=r2(t.max*rate('USD',cur));
  let amt,alloc,rowErr=null;
  if(ui.wd.manual){alloc=rows.map(r=>({...r,use:num(ui.wd.manual[r.c])}));amt=r2(alloc.reduce((a,r)=>a+r.use,0));const bad=alloc.find(r=>r.use>r.availIn);if(bad)rowErr=`You only have ${fmt(bad.availIn,cur)} available from your ${bad.c} balance.`}
  else{amt=num(ui.wd.amount);let rem=amt;alloc=rows.map(r=>{const u=Math.max(0,r2(Math.min(rem,r.availIn)));rem=r2(rem-u);return {...r,use:u}})}
  const fee=amt>0?r2(amt*t.pct/100+t.fix*rate(t.fixCur,cur)):0,receive=r2(amt-fee);
  const used=S.wds.filter(w=>w.type===m.type&&w.date.slice(0,10)===today()).length,left=t.perDay==null?null:Math.max(0,t.perDay-used);
  let err=null,block=null;
  if(S.kyc==='none')block='Complete KYC before you withdraw.';
  else if(left===0)block=`You have used today's ${t.perDay} withdrawal(s) for ${t.name}. Try again tomorrow or choose another payout method.`;
  else if(total<min)block=`The minimum for ${t.name} is ${fmt(min,cur)}. Your withdrawable total is ${fmt(total,cur)}.`;
  if(amt>0){if(rowErr)err=rowErr;else if(amt>total)err=`This is more than your withdrawable total of ${fmt(total,cur)}.`;else if(amt<min)err=`The minimum for ${t.name} is ${fmt(min,cur)}.`;else if(amt>max)err=`The maximum for ${t.name} is ${fmt(max,cur)} per withdrawal.`}
  return {m,t,cur,rows,alloc,total,min,max,amt,fee,receive,left,err,block,ok:amt>0&&!err&&!block}}
function vWithdraw(){
  if(ui.wd.step==='result')return vResult();
  if(!ui.wd.methodId||!usable(S.methods.find(m=>m.id===ui.wd.methodId)||{}))pickDefault();
  const c=wdCalc(),back=`<div class="head"><div><a data-act="go" data-r="overview">← Back to Wallet</a><h1 style="margin-top:6px">Start a withdrawal</h1></div><button class="btn" data-act="fees">Fees &amp; limits</button></div>`;
  if(!c.m){const waiting=S.methods.some(m=>m.status==='pending'||m.status==='verifying');
    return `${back}${kycAlert()}<section class="card" style="margin-top:14px"><div class="empty" style="display:grid;gap:6px;justify-items:center">${!S.methods.length?`<b>You have not added a payout method yet</b>Add a payout method first. After it is verified you can start a withdrawal.<ol class="pmsteps"><li>Add a payout method</li><li>Wait for verification</li><li>Start a withdrawal</li></ol><div><button class="btn pri" data-act="addM">Add payout method</button></div>`:waiting?`<b>Your payout method is still being verified</b>You can withdraw as soon as verification passes.<div style="margin-top:12px"><button class="btn pri" data-act="go" data-r="methods">View payout methods</button></div>`:`<b>Your payout method failed verification</b>Fix the payout method that failed, or add another one.<div style="margin-top:12px" class="row"><button class="btn pri" data-act="go" data-r="methods">Check payout method</button><button class="btn" data-act="addM">Add payout method</button></div>`}</div></section>`}
  const {t,cur}=c;
  return `${back}<div class="stack">${kycAlert()}<div class="wd">
  <div class="stack">
    <section class="card"><h2>1. Withdraw to</h2><div class="stack" style="gap:8px">
      ${S.methods.map(m=>{const ok=usable(m);return `<div class="pick ${m.id===c.m.id?'on':''} ${ok?'':'off'}" ${ok?`data-act="pickM" data-id="${m.id}" tabindex="0" role="radio" aria-checked="${m.id===c.m.id}"`:''}>${mIcon(m.type)}<div><b>${TYPES[m.type].name}</b> <span class="tag">${m.currency}</span>${m.isDefault?` <span class="tag def">Default</span>`:''}<div class="muted small">${esc(acct(m))}</div></div>${ok?`<span class="muted small">Fee ${feeText(TYPES[m.type])}</span>`:mPill(m)}</div>`}).join('')}
      <a data-act="go" data-r="methods">Change Payout Account or add a new one</a></div>
      <div class="rules"><div><span>Fee</span>${feeText(t)}</div><div><span>Limit per withdrawal</span>${fmt(c.min)} - ${fmt(c.max)} ${cur}</div><div><span>Withdrawals today</span>${c.left==null?'Unlimited':c.left+' of '+t.perDay+' left'}</div><div><span>Settlement time</span>${SETTLE}</div></div>
    </section>
    <section class="card"><h2>2. Withdrawal Amount ${tip('amt')}</h2>
      <div class="amtbox"><input type="text" id="wd-amt" inputmode="decimal" placeholder="0.00" value="${esc(ui.wd.amount)}" aria-label="Withdrawal amount" ${c.block?'disabled':''}><b>${cur}</b><button class="btn sm" data-act="max" ${c.block?'disabled':''}>Max</button></div>
      <div class="msg" id="wd-msg"></div>
      <div class="row" style="justify-content:space-between;margin-top:6px"><h3>Deducted from your balances</h3><span class="muted small">Withdrawable total: <b>${fmt(c.total,cur)}</b></span></div>
      <div class="muted small" style="margin:2px 0 6px">Filled automatically, ${cur} balance first. Edit a row to choose the split yourself.</div>
      ${c.rows.map(r=>`<div class="src"><div class="row">${coin(r.c)}<div><b>${fmt(r.avail,r.c)}</b>${r.c!==cur?` <span class="muted">≈ ${fmt(r.availIn,cur)}</span><div class="muted small">Today's Exchange Rate: ${r.rate.toFixed(4)}</div>`:`<div class="muted small">Same currency, no conversion</div>`}</div></div>
        <input type="text" inputmode="decimal" id="src-${r.c}" data-src="${r.c}" placeholder="0.00 ${cur}" aria-label="Amount from ${r.c} balance in ${cur}" ${c.block?'disabled':''}></div>`).join('')}
    </section>
  </div>
  <section class="card" style="position:sticky;top:72px"><h2>Summary</h2><div id="wd-sum"></div></section>
  </div></div>`}
function updWd(){const c=wdCalc();if(!c.m||!$('#wd-sum'))return;const {cur}=c;
  c.alloc.forEach(a=>{const el=$('#src-'+a.c);if(el&&ROOT.activeElement!==el)el.value=a.use?a.use.toFixed(2):''});
  const am=$('#wd-amt');if(ui.wd.manual&&am&&ROOT.activeElement!==am)am.value=c.amt?c.amt.toFixed(2):'';
  const msg=$('#wd-msg'),txt=c.block||c.err;msg.className='msg'+(txt?' err':'');msg.textContent=txt||(c.amt?'':`Enter between ${fmt(c.min)} and ${fmt(Math.min(c.max,c.total))} ${cur}.`);
  $('#wd-sum').innerHTML=`<dl class="kv"><dt>To</dt><dd>${TYPES[c.m.type].name}<div class="muted small">${esc(acct(c.m))}</div></dd>
    <dt>Withdrawal Amount</dt><dd>${fmt(c.amt,cur)}</dd><dt>Fee <span class="small">(${feeText(c.t)})</span></dt><dd>− ${fmt(c.fee,cur)}</dd>
    <dt class="sum">You will receive</dt><dd class="sum">${fmt(Math.max(0,c.receive),cur)}</dd><dt>Settlement time</dt><dd>${SETTLE}</dd></dl>
    <button class="btn pri lg block" style="margin-top:14px" data-act="review" ${c.ok&&c.receive>0?'':'disabled'}>Continue</button>
    <div class="muted small" style="margin-top:8px">You will confirm with your Security Password and Google Authenticator code.</div>`}
function lConfirm(){const c=wdCalc(),e=ui.cErr||{};
  return `<div class="ov"><div class="modal" role="dialog" aria-label="Confirm withdrawal"><div class="dh"><h2>Confirm withdrawal</h2><button class="x" data-act="close" aria-label="Close">×</button></div>
  <div class="db"><dl class="kv"><dt>To</dt><dd>${TYPES[c.m.type].name} · ${esc(acct(c.m))}</dd><dt>Withdrawal Amount</dt><dd>${fmt(c.amt,c.cur)}</dd><dt>Fee</dt><dd>− ${fmt(c.fee,c.cur)}</dd>
    ${c.alloc.filter(a=>a.use>0).map(a=>`<dt>From ${a.c} balance</dt><dd>${fmt(Math.min(a.avail,r2(a.use/a.rate)),a.c)}</dd>`).join('')}
    <dt class="sum">You will receive</dt><dd class="sum">${fmt(c.receive,c.cur)}</dd></dl>
    <div class="sec"><div class="f"><label for="c-pwd">Security Password <i>*</i></label><input type="password" id="c-pwd" class="${e.pwd?'bad':''}" autocomplete="new-password"><small><a data-act="resetPwd">Reset Password</a></small>${e.pwd?`<span class="e">${e.pwd}</span>`:''}</div>
    <div class="f"><label for="c-ga">Google Authenticator Code <i>*</i></label><input type="text" id="c-ga" inputmode="numeric" maxlength="6" placeholder="6-digit code" class="${e.ga?'bad':''}"><small>Enter the current code from Google Authenticator. <a data-act="ga">Not Installed? Install Now</a></small>${e.ga?`<span class="e">${e.ga}</span>`:''}</div></div></div>
  <div class="df"><button class="btn" data-act="close">Back</button><button class="btn pri" id="subWd" data-act="submitWd">Submit</button></div></div></div>`}
function submitWd(){const pwd=$('#c-pwd').value,ga=$('#c-ga').value.trim(),e={};
  if(!pwd)e.pwd='Enter your security password.';
  if(!/^\d{6}$/.test(ga))e.ga='Enter the 6-digit code from Google Authenticator.';else if(ga==='000000')e.ga='This code is incorrect. Enter the current code.';
  ui.cErr=e;if(e.pwd||e.ga){openLayer({k:'confirm'});if(!e.pwd)$('#c-pwd').value=pwd;return}
  const b=$('#subWd');b.disabled=true;b.textContent='Submitting…';
  later(900,()=>{const c=wdCalc();if(!c.ok){closeLayer();render();return}
    const no=newNo(),src=[],d=now();
    c.alloc.filter(a=>a.use>0).forEach(a=>{const take=Math.min(a.avail,r2(a.use/a.rate));S.bal[a.c].w=r2(S.bal[a.c].w-take);S.bal[a.c].p=r2(S.bal[a.c].p+take);src.push({c:a.c,take,use:a.use});
      const feePart=r2(take*c.fee/c.amt);addTx(a.c,'Withdrawal',-(take-feePart),{k:'wd',no});S.tx[0].bal=r2(S.bal[a.c].w+feePart);addTx(a.c,'Withdrawal Fee',-feePart,{k:'wd',no})});
    S.wds.unshift({no,date:d,type:c.m.type,cur:c.cur,acct:acct(c.m),amount:c.amt,fee:c.fee,status:'Pending',src,tl:[['Pending',d]]});
    ui.wd.step='result';ui.wd.no=no;closeLayer();render();window.scrollTo(0,0);payoutFlow(no)})}
function payoutFlow(no){const result=S.nextPayout,get=()=>S.wds.find(w=>w.no===no),set=(s)=>{const w=get();w.status=s;w.tl.push([s,now()]);return w};
  later(3500,()=>{set('Processing');refresh()});
  later(8500,()=>{const w=get();
    if(result==='success'){set('Payout Completed');w.src.forEach(s=>S.bal[s.c].p=r2(S.bal[s.c].p-s.take));toast(`Payout of ${fmt(r2(w.amount-w.fee),w.cur)} was sent.`);later(2500,()=>{set('Completed');refresh()})}
    else{set('Payout Failed');w.reason='The receiving account rejected the payout. Check the payout method details, then try again.';
      w.src.forEach(s=>{S.bal[s.c].p=r2(S.bal[s.c].p-s.take);S.bal[s.c].w=r2(S.bal[s.c].w+s.take);addTx(s.c,'Withdrawal Returned',s.take,{k:'wd',no})});toast('Withdrawal failed. The amount was returned to your balance.')}
    refresh()})}
function vResult(){const w=S.wds.find(x=>x.no===ui.wd.no),failed=w.status==='Payout Failed',done=w.status==='Completed'||w.status==='Payout Completed';
  return `<div class="head"><div><a data-act="go" data-r="overview">← Back to Wallet</a><h1 style="margin-top:6px">Withdraw</h1></div></div>
  <section class="card" style="max-width:720px"><div class="stack">
    <div class="alert ${failed?'bad':done?'good':'info'}"><div><b>${failed?'Withdrawal failed':done?'Payout sent':'Withdrawal submitted'}</b><span>${failed?esc(w.reason)+' The amount is back in your withdrawable balance.':done?WD_NOTE[w.status]:'You can leave this page. The status updates here and in Withdrawals. Settlement time: '+SETTLE+'.'}</span></div><span class="pill ${wdPill(w.status)}">${w.status}</span></div>
    ${tracker(w)}
    <dl class="kv"><dt>Withdrawal No.</dt><dd class="mono">${w.no}</dd><dt>To</dt><dd>${TYPES[w.type].name} · ${esc(w.acct)}</dd><dt>Withdrawal Amount</dt><dd>${fmt(w.amount,w.cur)}</dd><dt>Fee</dt><dd>${fmt(w.fee,w.cur)}</dd><dt class="sum">Amount to receive</dt><dd class="sum">${fmt(r2(w.amount-w.fee),w.cur)}</dd></dl>
    <div class="row">${failed?`<button class="btn pri" data-act="startWd">Withdraw again</button><button class="btn" data-act="go" data-r="methods">Check payout method</button>`:`<button class="btn pri" data-act="go" data-r="overview">Back to Wallet</button>`}<button class="btn" data-act="wdDetail" data-no="${w.no}">View details</button></div>
  </div></section>`}

/* ---------- Currency conversion ---------- */
function lConvert(){const f=ui.cv,to=f.from==='USD'?'EUR':'USD',a=num(f.amt),av=S.bal[f.from].w;
  return `<div class="ov"><div class="modal" role="dialog" aria-label="Currency conversion"><div class="dh"><h2>Currency Conversion</h2><button class="x" data-act="close" aria-label="Close">×</button></div>
  <div class="db"><div class="f"><label for="cv-amt">From</label><div class="row"><select id="cv-from"><option ${f.from==='USD'?'selected':''}>USD</option><option ${f.from==='EUR'?'selected':''}>EUR</option></select><input type="text" id="cv-amt" inputmode="decimal" placeholder="0.00" value="${esc(f.amt)}" style="flex:1"><button class="btn" data-act="cvMax">Max</button></div><small>Available: ${fmt(av,f.from)}</small><span class="e" id="cv-err"></span></div>
    <div class="f"><label>To</label><div class="bal"><b id="cv-out">${fmt(r2(a*rate(f.from,to)),to)}</b></div><small>Currency Conversion Rate: 1 ${f.from} = ${rate(f.from,to).toFixed(6)} ${to}</small></div></div>
  <div class="df"><button class="btn" data-act="close">Cancel</button><button class="btn pri" data-act="cvSubmit">Submit</button></div></div></div>`}
function cvSubmit(){const f=ui.cv,to=f.from==='USD'?'EUR':'USD',a=num(f.amt),e=$('#cv-err');
  if(!a){e.textContent='Enter an amount to convert.';return}
  if(a>S.bal[f.from].w){e.textContent=`You only have ${fmt(S.bal[f.from].w,f.from)} available.`;return}
  const out=r2(a*rate(f.from,to)),id=now().replace(/\D/g,'')+'001';
  S.bal[f.from].w=r2(S.bal[f.from].w-a);addTx(f.from,'Exchange - Outgoing',-a,{k:'fx',no:id});
  S.bal[to].w=r2(S.bal[to].w+out);addTx(to,'Exchange - Incoming',out,{k:'fx',no:id});
  closeLayer();render();toast(`Converted ${fmt(a,f.from)} to ${fmt(out,to)}.`)}
function lExport(){const csv=['Date,Transaction Details,Transaction Type,Amount,Balance',...txFiltered().map(t=>[t.date,t.ref.no||t.ref.t,t.type,t.amount.toFixed(2)+' '+t.cur,t.bal.toFixed(2)+' '+t.cur].join(','))].join('\n');
  return `<div class="ov" data-act="close"><div class="modal" role="dialog" aria-label="Export" data-stop><div class="dh"><h2>Export Details</h2><button class="x" data-act="close" aria-label="Close">×</button></div>
  <div class="db"><div class="muted">${txFiltered().length} record(s) with the current filters. In this prototype the export is shown as CSV text.</div><textarea id="csv" readonly aria-label="CSV">${esc(csv)}</textarea></div>
  <div class="df"><button class="btn" data-act="close">Close</button><button class="btn pri" data-act="copy" data-from="csv">Copy CSV</button></div></div></div>`}
function lExample(){return `<div class="ov" data-act="close" style="z-index:60"><div class="modal" data-stop role="dialog" aria-label="Statement example"><div class="dh"><h2>Bank statement example</h2><button class="x" data-act="closeEx" aria-label="Close">×</button></div>
  <div class="db"><div class="bal"><b>Your statement must show</b><ul style="margin:8px 0 0;padding-left:18px"><li>Account holder name</li><li>Account number or IBAN</li><li>Bank name</li></ul></div><div class="muted small">Placeholder for the example image used in the current seller center.</div></div></div></div>`}

/* ---------- layers ---------- */
function openLayer(l){ui.layer=l;$('#layer').innerHTML={wd:()=>lWd(l.no),fees:lFees,form:lForm,del:()=>lDelete(l.id),confirm:lConfirm,convert:lConvert,export:lExport}[l.k]()}
function closeLayer(){ui.layer=null;ui.form=null;ui.cErr=null;clearInterval(ui.cd);$('#layer').innerHTML=''}
function openForm(mode,id){const m=id&&S.methods.find(x=>x.id===id);
  ui.form={mode,id,type:m?m.type:null,v:m?{...m.v,currency:m.currency,isDefault:m.isDefault}:{},err:{},sent:false,failReason:m&&m.failReason};openLayer({k:'form'})}

/* ---------- events ---------- */
const ACT={
  go:d=>{closeLayer();go(d.r)}, out:()=>toast('This page is outside the withdrawal prototype.'),
  startWd:d=>startWd(d.id), fees:()=>openLayer({k:'fees'}), close:()=>closeLayer(),
  closeEx:()=>{const x=$('#layer .ov:last-child');x&&x.remove()},
  kyc:()=>{S.kyc='done';$('#d-kyc').value='done';render();toast('Demo: KYC marked as completed.')},
  ack:d=>{S.wds.find(w=>w.no===d.no).ack=true;render()},
  wdDetail:d=>openLayer({k:'wd',no:d.no}),
  copy:d=>{const t=d.from?$('#'+d.from).value:d.t;try{navigator.clipboard.writeText(t).then(()=>toast('Copied.'),()=>toast('Select the text and copy it manually.'))}catch(e){toast('Select the text and copy it manually.')}},
  txCur:d=>{ui.fT.cur=d.c;ui.fT.page=1;render()}, txReset:()=>{ui.fT={cur:'',from:'',to:'',type:'',q:'',page:1};render()},
  txPage:d=>{ui.fT.page+=+d.d;render()}, wReset:()=>{ui.fW={from:'',to:'',status:'',q:''};render()},
  export:()=>openLayer({k:'export'}), convert:()=>{ui.cv={from:'USD',amt:''};openLayer({k:'convert'})},
  cvMax:()=>{ui.cv.amt=S.bal[ui.cv.from].w.toFixed(2);openLayer({k:'convert'})}, cvSubmit,
  addM:()=>openForm('add'), editM:d=>openForm('edit',d.id),
  pickType:d=>{readForm();ui.form.type=d.t;ui.form.err={};openLayer({k:'form'})},
  sendCode:()=>{const F=ui.form;readForm();F.sent=true;let n=60;const b=$('#sendCode');b.disabled=true;b.textContent=`Resend in ${n}s`;toast(`Verification code sent to ${SELLER_EMAIL}.`);
    clearInterval(ui.cd);ui.cd=setInterval(()=>{const x=$('#sendCode');n--;if(!x||n<=0){clearInterval(ui.cd);if(x){x.disabled=false;x.textContent='Resend'}return}x.textContent=`Resend in ${n}s`},1000)},
  saveM:saveMethod, example:()=>$('#layer').insertAdjacentHTML('beforeend',lExample()),
  ga:()=>toast('Opens My Account > Security > Google Authenticator.'), resetPwd:()=>toast('Opens the security password update page.'),
  defM:d=>{S.methods.forEach(m=>m.isDefault=m.id===d.id);render();toast('Default payout method updated.')},
  delM:d=>openLayer({k:'del',id:d.id}),
  delConfirm:d=>{S.methods=S.methods.filter(m=>m.id!==d.id);closeLayer();render();toast('Payout method deleted.')},
  pickM:d=>{ui.wd.methodId=d.id;ui.wd.amount='';ui.wd.manual=null;render()},
  max:()=>{const c=wdCalc();ui.wd.manual=null;ui.wd.amount=Math.min(c.total,c.max).toFixed(2);$('#wd-amt').value=ui.wd.amount;updWd()},
  review:()=>{ui.cErr=null;openLayer({k:'confirm'})}, submitWd,
  reset:()=>{init();toast('Demo data reset.')}
};
ROOT.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;
  if(el.dataset.act==='close'&&el.classList.contains('ov')&&e.target!==el)return;
  if(el.tagName==='A'||el.type!=='submit')e.preventDefault();
  if(el.disabled)return;const f=ACT[el.dataset.act];f&&f(el.dataset)});
ROOT.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.layer)closeLayer();
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('.pick[data-act]')){e.preventDefault();e.target.click()}});
ROOT.addEventListener('submit',e=>e.preventDefault());
ROOT.addEventListener('input',e=>{const el=e.target;
  if(el.closest('#mform, .modal .sec')){el.classList.remove('bad');const x=el.closest('.f')?.querySelector('.e');x&&x.remove()}
  if(el.id==='wd-amt'){ui.wd.amount=el.value;ui.wd.manual=null;updWd()}
  else if(el.dataset.src){const m={};ROOT.querySelectorAll('[data-src]').forEach(i=>m[i.dataset.src]=i.value);ui.wd.manual=m;updWd()}
  else if(el.id==='cv-amt'){ui.cv.amt=el.value;const to=ui.cv.from==='USD'?'EUR':'USD';$('#cv-out').textContent=fmt(r2(num(el.value)*rate(ui.cv.from,to)),to);$('#cv-err').textContent=''}
  else if(el.dataset.f&&el.type==='text'){const [a,b]=el.dataset.f.split('.');ui[a][b]=el.value;if(a==='fT')ui.fT.page=1;const id=el.id,pos=el.selectionStart;render();const n=$('#'+id);n.focus();n.setSelectionRange(pos,pos)}});
ROOT.addEventListener('change',e=>{const el=e.target;
  if(el.id==='d-kyc'){S.kyc=el.value;if(el.value==='cn')S.methods.forEach(m=>{if(m.type==='usdt')m.isDefault=false});ui.wd.methodId=null;render()}
  else if(el.id==='d-pm'){const all=seed().methods,v=el.value;S.methods=v==='has'?all:v==='none'?[]:v==='verifying'?[{...all[0],status:'verifying',isDefault:false}]:[all[2]];ui.wd={methodId:null,amount:'',manual:null,step:'form',no:null};closeLayer();render()}
  else if(el.id==='d-ver')S.nextVerify=el.value; else if(el.id==='d-pay')S.nextPayout=el.value;
  else if(el.id==='cv-from'){ui.cv.from=el.value;ui.cv.amt='';openLayer({k:'convert'})}
  else if(el.dataset.f&&el.type!=='text'){const [a,b]=el.dataset.f.split('.');ui[a][b]=el.value;if(a==='fT')ui.fT.page=1;render()}});
init();
if(innerWidth<=900)$('#demo').open=false;

window.WM={go:r=>{closeLayer();go(r)},startWd:()=>startWd()};
})();
}catch(e){console.error('module wallet failed',e)}
</script>

const p2 = n => String(n).padStart(2,'0');
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmt = (d,time=true) => {
  const hm = p2(d.getHours())+':'+p2(d.getMinutes());
  if(S.lang==='zh') return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+(time?' '+hm:'');
  return MON[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear()+(time?', '+hm:'');
};
const money = n => '$'+n.toFixed(2);
const deadline = r => new Date(r.date.getTime()+APPEAL_DAYS*864e5);
const status = r => r.appeal ? r.appeal.s : (r.source==='m' && NOW<=deadline(r) ? 'appealable' : 'final');
const hoursLeft = r => (deadline(r)-NOW)/36e5;
const leftText = r => { const h = hoursLeft(r); return h>=48 ? t('left_d',{n:Math.floor(h/24)}) : h>=1 ? t('left_h',{n:Math.floor(h)}) : t('left_1'); };
const urgent = r => hoursLeft(r)<48;
const STATUSES = ['appealable','reviewing','approved','rejected','final'];

const subline = r => { const s = status(r);
  if(s==='appealable') return t('sub_appealable',{d:fmt(deadline(r)),left:leftText(r)});
  if(s==='reviewing') return t('sub_reviewing',{d:fmt(r.appeal.at,false)});
  if(s==='approved') return t('sub_approved',{a:money(r.amount)});
  if(s==='rejected') return t('sub_rejected');
  return t(r.source==='s'?'sub_system':'sub_expired'); };
const find = id => DATA.find(r => r.id===id);

function baseFiltered(){
  const q = S.q.trim().toLowerCase();
  return DATA.filter(r => {
    if(S.type && r.type!==S.type) return false;
    const day = r.date.getFullYear()+'-'+p2(r.date.getMonth()+1)+'-'+p2(r.date.getDate());
    if(S.from && day<S.from) return false;
    if(S.to && day>S.to) return false;
    if(q && !(r.order.includes(q) || r.id.toLowerCase().includes(q) || r.product.includes(q))) return false;

}

/* ============ render: summary + list ============ */
function renderMain(){

  const ap = DATA.filter(r => status(r)==='appealable').sort((a,b) => deadline(a)-deadline(b));

  const in90 = DATA.filter(r => r.date>=since);

    <div class="act ${ap.length?'':'zero'}"><div class="lb"><i class="dot d-appealable"></i>${t('sum_action')}</div>
      <div class="val num">${ap.length}${ap.length?`<a data-act="tab" data-v="appealable">${t('view')} →</a>`:''}</div>
      <div class="sb ${ap.length&&urgent(ap[0])?'urgent':''}">${ap.length?`<a style="color:inherit" data-act="open" data-id="${ap[0].id}">${t('sum_action_sub',{d:fmt(deadline(ap[0])),left:leftText(ap[0])})}</a>`:t('sum_action_none')}</div></div>
    <div><div class="lb"><i class="dot d-reviewing"></i>${t('sum_review')}</div>
      <div class="val num">${rv.length}${rv.length?`<a data-act="tab" data-v="reviewing">${t('view')} →</a>`:''}</div>
      <div class="sb">${rv.length?t('sum_review_sub'):t('sum_review_none')}</div></div>
    <div><div class="lb">${t('sum_net')}</div>
      <div class="val num">${money(ded-back)}</div>
      <div class="sb num">${t('sum_net_sub',{a:money(ded),b:money(back)})}</div></div>`;

  // tabs
  const base = baseFiltered();
  const cnt = s => s==='all' ? base.length : base.filter(r => status(r)===s).length;
  $('tabs').innerHTML = ['all',...STATUSES].map(s => `<button data-act="tab" data-v="${s}" class="${S.status===s?'on':''}">${s==='all'?t('tab_all'):t('s_'+s)}<span class="c num">${cnt(s)}</span></button>`).join('');

  // list
  const rows = base.filter(r => S.status==='all' || status(r)===S.status);
  const pages = Math.max(1, Math.ceil(rows.length/S.size));
  if(S.page>pages) S.page = pages;
  const slice = rows.slice((S.page-1)*S.size, S.page*S.size);
  if(!rows.length){
    $('list').innerHTML = `<div class="empty"><b>${t('empty_t')}</b>${t('empty_d')}<div style="margin-top:12px"><button class="btn sm" data-act="reset">${t('empty_clear')}</button></div></div>`;

      <td><div class="num">${r.order}<button class="copy" data-act="copy" data-v="${r.order}" title="${t('copy')}">${t('copy')}</button></div><div class="t2">${esc(r.brand)} · ${esc(r.cat)}</div></td>
      <td class="r"><div class="amt num ${back?'back':''}">${money(r.amount)}</div><div class="t2">${t(back?'returned':'deducted')}</div></td>
      <td>${badge(s)}<div class="t2 ${s==='appealable'&&urgent(r)?'urgent':''}">${subline(r)}</div></td>
      <td class="r">${s==='appealable'?`<button class="btn pri sm" data-act="appeal" data-id="${r.id}">${t('appeal')}</button>`:`<a>${t('details')}</a>`}</td></tr>`; };
  let pg = '';
  for(let i=1;i<=pages;i++) pg += `<button data-act="page" data-v="${i}" class="${i===S.page?'on':''}">${i}</button>`;
  $('list').innerHTML = `<div class="tw"><table><thead><tr><th>${t('c_penalty')}</th><th>${t('c_order')}</th><th class="r">${t('c_amount')}</th><th>${t('c_status')}</th><th></th></tr></thead><tbody>${slice.map(tr).join('')}</tbody></table></div>
    <div class="pager"><span>${t('total',{n:rows.length})}</span><div class="pg">
      <button data-act="page" data-v="${S.page-1}" ${S.page===1?'disabled':''}>‹</button>${pg}<button data-act="page" data-v="${S.page+1}" ${S.page===pages?'disabled':''}>›</button>
      <select class="inp" id="psize">${[10,20,50].map(n => `<option value="${n}"${S.size===n?' selected':''}>${t('per_page',{n})}</option>`).join('')}</select></div></div>`;
  $('psize').onchange = e => { S.size = +e.target.value; S.page = 1; renderMain(); };

/* ============ render: drawer ============ */
function renderDrawer(){
  const r = S.open && find(S.open);
  if(!r){ $('drawer').innerHTML = ''; return; }
  const keep = $('drawer').querySelector('.db'); const sc = keep ? keep.scrollTop : 0;
  $('drawer').innerHTML = `<div class="mask" data-act="close"></div><aside class="drawer" role="dialog" aria-modal="true">${S.view==='appeal'?appealView(r):detailView(r)}</aside>`;
  if(S.view==='appeal'){ const ta = $('ap-text'); ta.oninput = () => { S.draft.text = ta.value; syncForm(); }; syncForm(); }
  else if(keep) $('drawer').querySelector('.db').scrollTop = sc;
}

  const order = `<div class="sec"><h4>${t('sec_order')}</h4><dl class="kv">
    <dt>${t('k_order')}</dt><dd class="num">${r.order}<button class="copy" data-act="copy" data-v="${r.order}">${t('copy')}</button> <a data-act="toast" data-v="order_toast">${t('view_order')}</a></dd>
    <dt>${t('k_brand')}</dt><dd>${esc(r.brand)} · ${esc(r.cat)}</dd>
    <dt>${t('k_product')}</dt><dd class="num">${r.product}<button class="copy" data-act="copy" data-v="${r.product}">${t('copy')}</button></dd></dl></div>`;
  let appeal = '';
  if(ap){
    const txt = ap.text!==undefined ? ap.text : t(ap.textKey);
    appeal = `<div class="sec"><h4>${t('sec_appeal')}</h4><dl class="kv">
      <dt>${t('k_result')}</dt><dd>${badge(s)}</dd>
      ${ap.replyKey?`<dt>${t('k_reply')}</dt><dd>${t(ap.replyKey)}</dd><dt>${t('k_decided')}</dt><dd class="num">${fmt(ap.rt)}</dd>`:''}
      <dt>${t('k_submitted')}</dt><dd class="num">${fmt(ap.at)}</dd>
      <dt>${t('k_statement')}</dt><dd><div class="quote">${esc(txt)}</div></dd>
      <dt>${t('k_evidence')}</dt><dd>${ap.files.length?`<div class="files" style="margin:0">${ap.files.map(f => `<span class="file">${esc(f)}</span>`).join('')}</div>`:`<span style="color:var(--mute)">${t('no_files')}</span>`}</dd></dl></div>`;
  }
  const li = (txt,d,todo) => `<li class="${todo?'todo':''}">${txt}${d?`<div class="tm num">${fmt(d)}</div>`:''}</li>`;
  let tl = '';
  if(ap){ tl += s==='reviewing' ? li(t('tl_wait'),null,true) : li(t(s==='approved'?'tl_ok':'tl_no',{a}),ap.rt); tl += li(t('tl_appeal'),ap.at); }
  else if(s==='final' && r.source==='m') tl += li(t('tl_closed'),deadline(r));
  tl += li(t('tl_issued',{a}),r.date);
  const timeline = `<div class="sec"><h4>${t('sec_tl')}</h4><ul class="tl">${tl}</ul></div>`;
  const tips = s==='approved' ? '' : `<div class="sec"><h4>${t('sec_tips')}</h4><ul class="tips">${t('tip_'+r.type).map(x => `<li>${x}</li>`).join('')}</ul></div>`;
  const demo = s==='reviewing' ? `<div class="demo">${t('demo_sim')}<button class="btn sm" data-act="sim" data-v="approved">${t('demo_ok')}</button><button class="btn sm" data-act="sim" data-v="rejected">${t('demo_no')}</button></div>` : '';

function appealView(r){
  return `<div class="dh"><div><h2>${t('ap_title')}</h2><div class="t2"><a data-act="back">← ${t('ap_back')}</a></div></div><button class="x" data-act="close" aria-label="${t('close')}">×</button></div>
    <div class="db">
      <div class="box"><div><div class="k">${t('c_penalty')}</div><div class="v">${t('ty_'+r.type)}</div></div>
        <div><div class="k">${t('k_amount')}</div><div class="v num">${money(r.amount)}</div></div>
        <div><div class="k">${t('k_order')}</div><div class="v num">${r.order}</div></div>
        <div><div class="k">${t('k_deadline')}</div><div class="v num" style="${urgent(r)?'color:var(--red)':''}">${fmt(deadline(r))}</div></div></div>

      <div class="fld"><label for="ap-text">${t('ap_statement')} <i>*</i></label>
        <textarea id="ap-text" maxlength="${MAX_LEN}" placeholder="${t('ap_ph')}">${esc(S.draft.text)}</textarea>
        <div class="hint"><span>${t('ap_min',{n:MIN_LEN})}</span><span class="num" id="ap-count"></span></div></div>
      <div class="fld"><label>${t('ap_evidence')} <span style="font-weight:400;color:var(--sub)">${t('ap_optional')}</span></label>
        <button class="up" data-act="pick">${t('ap_up')}<div style="font-size:12.5px;margin-top:2px;color:var(--mute)">${t('ap_up_hint',{n:MAX_FILES})}</div></button>
        <div class="files">${S.draft.files.map((f,i) => `<span class="file">${esc(f)}<button data-act="rmfile" data-v="${i}" aria-label="remove">×</button></span>`).join('')}</div></div>
    </div>

function syncForm(){
  const n = S.draft.text.trim().length;
  $('ap-count').textContent = S.draft.text.length+' / '+MAX_LEN;
  $('ap-submit').disabled = n < MIN_LEN;
}

/* ============ modal + toast ============ */
function modal(html){ $('modal').innerHTML = html ? `<div class="modal" data-act="mclose-bg">${html}</div>` : ''; }
function toast(msg){ const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg; $('toast').appendChild(el); setTimeout(() => el.remove(), 2600); }
function confirmModal(){ modal(`<div class="mbox"><h3>${t('cf_t')}</h3><p>${t('cf_d')}</p><div class="mf"><button class="btn" data-act="mclose">${t('cf_back')}</button><button class="btn pri" data-act="submit">${t('cf_ok')}</button></div></div>`); }
function notesModal(){ modal(`<div class="mbox wide"><h3>${t('notes_t')}</h3><p>${t('notes_d')}</p><ol>${t('notes').map(x => `<li>${x}</li>`).join('')}</ol><div class="mf"><button class="btn pri" data-act="mclose">${t('close')}</button></div></div>`); }
let modalKind = null;

/* ============ actions ============ */
function openPenalty(id, view){ S.open = id; S.view = view||'detail'; if(view==='appeal') S.draft = {text:'',files:[]}; renderDrawer(); }
function closeDrawer(){ S.open = null; S.view = 'detail'; renderDrawer(); }
function copyText(v){ const done = () => toast(t('copied'));
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(v).then(done, done);
  else { const i = document.createElement('input'); i.value = v; ROOT.appendChild(i); i.select(); try{document.execCommand('copy')}catch(e){} i.remove(); done(); } }

ROOT.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if(!el) return;
  const act = el.dataset.act, v = el.dataset.v, id = el.dataset.id;
  if(act==='mclose-bg' && e.target!==el) return;
  switch(act){
    case 'lang': S.lang = v; renderShell(); renderMain(); renderDrawer(); if(modalKind==='notes') notesModal(); if(modalKind==='confirm') confirmModal(); break;
    case 'tab': S.status = v; S.page = 1; renderMain(); break;
    case 'page': S.page = +v; renderMain(); break;
    case 'reset': S.q=''; S.type=''; S.from=''; S.to=''; S.status='all'; S.page=1; renderShell(); renderMain(); break;
    case 'copy': e.stopPropagation(); copyText(v); break;
    case 'open': openPenalty(id); break;
    case 'appeal': e.stopPropagation(); openPenalty(id,'appeal'); break;
    case 'back': S.view = 'detail'; renderDrawer(); break;
    case 'close': closeDrawer(); break;
    case 'toast': toast(t(v)); break;
    case 'pick': $('filepick').click(); break;
    case 'rmfile': S.draft.files.splice(+v,1); renderDrawer(); break;
    case 'confirm': if(S.draft.text.trim().length>=MIN_LEN){ modalKind='confirm'; confirmModal(); } break;
    case 'submit': { const r = find(S.open);
      r.appeal = { s:'reviewing', at:new Date(NOW), rt:null, text:S.draft.text.trim(), files:S.draft.files.slice(), replyKey:null };
      modalKind=null; modal(''); S.view='detail'; S.draft={text:'',files:[]}; renderMain(); renderDrawer(); toast(t('ap_done')); break; }
    case 'sim': { const r = find(S.open); r.appeal.s = v; r.appeal.rt = new Date(NOW); r.appeal.replyKey = v==='approved'?'reply_ok':'reply_no';
      renderMain(); renderDrawer(); toast(t(v==='approved'?'sim_ok':'sim_no')); break; }
    case 'notes': modalKind='notes'; notesModal(); break;
    case 'mclose': case 'mclose-bg': modalKind=null; modal(''); break;
  }
});
$('filepick').onchange = e => {
  const names = [...e.target.files].map(f => f.name);
  const room = MAX_FILES - S.draft.files.length;
  if(names.length>room) toast(t('ap_max',{n:MAX_FILES}));
  S.draft.files.push(...names.slice(0,Math.max(0,room)));
  e.target.value = ''; renderDrawer();
};
ROOT.addEventListener('keydown', e => { if(e.key!=='Escape') return; if(modalKind){ modalKind=null; modal(''); } else if(S.open){ S.view==='appeal' ? (S.view='detail', renderDrawer()) : closeDrawer(); } });

IGV.onLang(l=>{S.lang=l;renderShell();renderMain();renderDrawer();if(modalKind==='notes')notesModal();if(modalKind==='confirm')confirmModal()});

})();
}catch(e){console.error('module penalties failed',e)}
</script>

function mkOrder(P,r,d,pi,forceOver){
  const C=P.cfg,p=C.products[pi],q=r(),qty=q<.85?1:q<.97?2:3;
  const o={id:'IGV'+iso(d).replace(/-/g,'').slice(2)+(SEQ++),d,p:pi,qty,amt:+(p.price*qty).toFixed(2),st:'done',mins:null,late:false,fault:null,reason:null,as:false,dis:false,disOpen:false,rev:0};
  if(forceOver){o.st='over';o.late=true;return o}
  const x=r(),ps=C.pSelOf?C.pSelOf(p,d):C.pSel;
  if(x<ps){o.st='ref';o.fault='seller';o.as=true;if(r()<.6){o.reason=REASONS.seller[0];o.late=true}else{o.reason=REASONS.seller[1];o.mins=lognorm(r,C.med,C.sig)}}
  else if(x<ps+C.pBuy){o.st='ref';o.fault='buyer';o.as=true;o.reason=REASONS.buyer[r()<.6?0:1];if(r()<.5)o.mins=lognorm(r,C.med,C.sig)}
  else{o.mins=lognorm(r,C.med,C.sig);if(r()<.07)o.as=true;if(r()<C.revP)o.rev=r()<C.badP?-1:1}
  if(o.mins!=null&&o.mins>C.promise)o.late=true;

}

function getP(key){
  if(DATA[key])return DATA[key];
  const C=CFG[key],r=rng(C.seed),start=END-C.days+1;
  const P={key,cfg:C,start,byDay:[],tr:C.products.map(()=>[])};
  for(let d=start;d<=END;d++){
    const day=[];P.byDay.push(day);
    C.products.forEach((p,pi)=>{
      const vr=C.vis(p,pi,d),vis=poisson(r,vr),cre=poisson(r,vis*C.conv(p,pi,d));
      let paid=0;for(let i=0;i<cre;i++)if(r()<.92)paid++;
      P.tr[pi].push([Math.round(vis/p.ctr*(.9+.2*r())),vis,cre]);
      for(let i=0;i<paid;i++)day.push(mkOrder(P,r,d,pi));

}

  for(const o of os){

    else if(o.st==='ref'){m.refN++;m.refAmt+=o.amt;o.fault==='seller'?m.selRef++:m.buyRef++;m.reasons[o.reason]=(m.reasons[o.reason]||0)+1}
    else{m.pendN++;m.pendAmt+=o.amt}

  }

function buckets(a,b,g){const out=[];if(g==='day'){for(let d=a;d<=b;d++)out.push([d,d])}else{let e=b;while(e>=a){const s=Math.max(a,e-6);out.unshift([s,e]);e=s-1}}return out}

function niceTicks(max){if(max<=0)max=1;const raw=max/4,p=Math.pow(10,Math.floor(Math.log10(raw))),c=[1,2,2.5,5,10].map(x=>x*p).find(x=>x>=raw),t=[];for(let v=0;v<max+c*.999;v+=c)t.push(+v.toFixed(6));return t}
function autoGran(a,b,f){const L=b-a+1;if(L<=14)return 'day';const n=ordersIn(P,a,b,f).filter(o=>o.st==='done').length;return n/L<1.5?'week':'day'}
function drawTrend(box,a,b,f,metric,gran,cmp,H,trailOnly){
  const bs=buckets(a,b,gran),cur=bs.map(([s,e])=>bval(s,e,f,metric)),prev=cmp?bs.map(([s,e])=>bval(s-cmp.off,e-cmp.off,f,metric)):null;
  if(!cur.some(c=>c.n)&&!(prev&&prev.some(c=>c.n))){box.innerHTML=`<div class="empty"><b>这段时间没有成交订单</b>有成交后，这里会按${gran==='week'?'周':'日'}显示成交走势</div>`;return {bs,cur}}
  const W=Math.max(360,box.clientWidth||900);H=H||250;const l=58,r=14,t=14,bt=30,n=bs.length,pw=W-l-r,ph=H-t-bt,bw=pw/n;
  const fmt=metric==='orders'?(v=>int(v)):axisMoney, fmtFull=metric==='orders'?(v=>v==null?'—':int(v)+' 单'):(v=>v==null?'无成交':money(v));
  const max=Math.max(1e-9,...cur.map(c=>c.v||0),...(prev?prev.map(c=>c.v||0):[0])),ticks=niceTicks(max),top=ticks[ticks.length-1];
  const X=i=>l+bw*(i+.5),Y=v=>t+ph-(v/top)*ph;
  let g='';
  ticks.forEach(v=>{g+=`<line x1="${l}" x2="${W-r}" y1="${Y(v)}" y2="${Y(v)}" stroke="#EDEFF4"/><text x="${l-8}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="#8990A3">${fmt(v)}</text>`});
  // 连续无成交区间
  const dayHas=[];for(let d=a;d<=b;d++)dayHas.push(ordersIn(P,d,d,f).some(o=>o.st==='done'));
  const xDay=(d,end)=>{const k=bs.findIndex(([s,e])=>d>=s&&d<=e),[s,e]=bs[k];return l+bw*(k+(d-s+(end?1:0))/(e-s+1))};
  let i=0;const LL=b-a+1;while(i<LL){if(!dayHas[i]){let j=i;while(j<LL&&!dayHas[j])j++;const days=j-i;if(!(i===0&&j===LL)&&((j===LL&&days>=7)||(!trailOnly&&days>=14))){const x0=xDay(a+i),x1=xDay(a+j-1,true);g+=`<rect x="${x0}" y="${t}" width="${x1-x0}" height="${ph}" fill="#FDEDEA" opacity=".7"/>`;if(x1-x0>=110)g+=`<text x="${(x0+x1)/2}" y="${t+16}" text-anchor="middle" font-size="11.5" fill="#D23F2E" font-weight="600">连续 ${days} 天无成交</text>`}i=j}else i++}
  const step=Math.max(1,Math.ceil(n/8));
  bs.forEach(([s,e],k)=>{if((n-1-k)%step===0)g+=`<text x="${X(k)}" y="${H-9}" text-anchor="middle" font-size="11" fill="#8990A3">${gran==='week'&&s!==e?mds(s)+'起':mds(s)}</text>`});
  const bars=gran==='week'||n<=14;
  if(bars){const w=Math.min(26,bw*(prev?.32:.5));
    cur.forEach((c,k)=>{if(prev&&prev[k].v)g+=`<rect x="${X(k)-w-1}" y="${Y(prev[k].v)}" width="${w}" height="${t+ph-Y(prev[k].v)}" rx="2" fill="#C5CAD6"/>`;
      if(c.v)g+=`<rect x="${prev?X(k)+1:X(k)-w/2}" y="${Y(c.v)}" width="${w}" height="${t+ph-Y(c.v)}" rx="2" fill="#1f5eff"/>`});
  }else{
    const path=arr=>{let d='',pen=false;arr.forEach((c,k)=>{if(c.v==null){pen=false;return}d+=(pen?'L':'M')+X(k).toFixed(1)+' '+Y(c.v).toFixed(1);pen=true});return d};
    if(prev)g+=`<path d="${path(prev)}" fill="none" stroke="#B4BAC8" stroke-width="1.5" stroke-dasharray="4 4"/>`;
    g+=`<path d="${path(cur)}" fill="none" stroke="#1f5eff" stroke-width="2" stroke-linejoin="round"/>`;

  }
  g+=`<line id="guide" x1="0" x2="0" y1="${t}" y2="${t+ph}" stroke="#1f5eff" stroke-opacity=".35" style="display:none"/>`;
  bs.forEach((_,k)=>{g+=`<rect class="hit" data-k="${k}" x="${l+bw*k}" y="${t}" width="${bw}" height="${ph+bt}" fill="transparent" style="cursor:pointer"/>`});
  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="成交趋势图">${g}</svg><div class="tip"></div>`;
  const tip=box.querySelector('.tip'),guide=box.querySelector('#guide');

      tip.style.display='block';const bx=box.getBoundingClientRect();let x=ev.clientX-bx.left+14;if(x+tip.offsetWidth>bx.width)x=ev.clientX-bx.left-tip.offsetWidth-14;tip.style.left=x+'px';tip.style.top=Math.max(0,ev.clientY-bx.top-10)+'px';
      guide.setAttribute('x1',X(k));guide.setAttribute('x2',X(k));guide.style.display='';

    h.addEventListener('click',()=>openDrawer((s===e?md(s):md(s)+' – '+md(e))+' 的成交订单',f==='all'?'全部商品':filtName(f),ordersIn(P,s,e,f).filter(o=>o.st==='done')));

function streak(){const os=ordersIn(P,P.start,END,S.filt).filter(o=>o.st==='done');if(!os.length)return null;return END-Math.max(...os.map(o=>o.d))}
function buildConclusion(){

  const all=ordersIn(P,P.start,END,S.filt);

    out.todos=[{k:'起步',t:'确认商品价格有竞争力：当前 2 个商品的价格排名都在后 20%',btn:'去调价',act:()=>jump('商品中心 · 价格设置')},{k:'起步',t:'补充库存并开启自动交付，缩短交付时间',btn:'去设置',act:()=>jump('商品中心 · 库存与交付')},{k:'起步',t:'上架更多面额，覆盖不同预算的买家',btn:'去上架',act:()=>jump('商品中心 · 发布商品')}];
    return out;
  }
  const L=rangeLabel();let s='';
  if(!M.paid){s=`${L}没有付款订单。`}

    if(M0&&M0.net>0){const x=M.net/M0.net-1;
      if(Math.abs(x)<.05)s+=`，与${cmpLabel()}基本持平。`;
      else{s+=`，比${cmpLabel()}<b class="${x<0?'dn':'up'}">${x<0?'少':'多'} ${pct(Math.abs(x))}</b>。`;
        if(M.done&&M0.done){const dN=M.done-M0.done,dA=M.aov/M0.aov-1,eN=dN*M0.aov,eA=M.done*(M.aov-M0.aov);
          const tN=`成交订单${dN<0?'减少':'增加'} ${int(Math.abs(dN))} 单（${int(M0.done)} → ${int(M.done)} 单）`,tA=`客单价${dA<0?'下降':'上涨'} ${pct(Math.abs(dA))}（${money(M0.aov,0)} → ${money(M.aov,0)}）`;
          const mainN=Math.abs(eN)>=Math.abs(eA),opp=(eN<0)!==(eA<0),minor=Math.abs(mainN?dA:dN/M0.done)<.03;
          s+=`主要因为${mainN?tN:tA}`+(minor?'。':`，${opp?'而':'同时'}${mainN?tA:tN}。`)}

  if(ov.length)T.push({k:'问题',t:`<b>${ov.length} 单</b>已超过承诺时间还未交付，可能被买家申请退款`,btn:'去交付',act:()=>openDrawer('超时未交付的订单','当前存量，不随时间范围变化',ov)});
  const dop=all.filter(o=>o.disOpen);
  if(dop.length)T.push({k:'问题',t:`<b>${dop.length} 单</b>正在平台介入中，需要在时限内回应`,btn:'去处理',act:()=>openDrawer('平台介入中的订单','需要你举证回应',dop)});
  if(st!=null&&st>=7){const oos=P.cfg.products.filter((p,pi)=>match(P,pi,S.filt)&&p.status!=='在售').length;T.push({k:'问题',t:`近 ${st} 天没有成交${oos?`，<b>${oos} 个商品</b>处于缺货或下架状态`:'，确认商品是否在售、库存是否充足'}`,btn:'检查商品',act:()=>{ROOT.getElementById('m5').scrollIntoView({behavior:'smooth',block:'start'})}})}
  if(M0&&M.selRef>=3&&M.selRef>M0.selRef*1.5){const by={};M.os.filter(o=>o.fault==='seller').forEach(o=>by[o.p]=(by[o.p]||0)+1);const top=Object.keys(by).sort((x,y)=>by[y]-by[x])[0];
    T.push({k:'问题',t:`卖家原因退款增加到 <b>${M.selRef} 单</b>（上期 ${M0.selRef} 单），其中 ${by[top]} 单来自「${esc(P.cfg.products[top].name)}」`,btn:'查看订单',act:()=>openDrawer('卖家原因退款的订单',rangeLabel(),M.os.filter(o=>o.fault==='seller'))})}

   <td>${o.refund?`<span class="chip bad">${L.refunded}</span>`:KEYS.map(k=>`<span class="chip ${o.g[k]?'ok':''}" style="margin-right:6px">${L.items[k]} ${o.g[k]?'+1':'· '+L.miss}</span>`).join('')}</td>

}
function drawer(){const L=t();const list=a=>a.map((r,i)=>`<div class="rule"><div class="k">${i+1}</div><div><b>${r[0]}</b><span>${r[1]}</span></div></div>`).join('');
  const body={earn:`<p>${L.rEarnP}</p><table class="rt"><thead><tr>${L.rth.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${KEYS.map(k=>`<tr><td><b>${L.items[k]}</b></td><td><span class="chip ok">+1</span></td><td>${L.rc[k]}</td></tr>`).join('')}</tbody></table><p style="color:var(--tx2);font-size:13px">${L.rEarnN}</p>`,level:list(L.rl),cycle:list(L.rcy),ben:list(L.rb)}[S.rt];

$('mask').onclick=closeAll;ROOT.addEventListener('keydown',e=>e.key==='Escape'&&closeAll());

})();

function qr(){let s='',seed=7;const r=()=>(seed=(seed*9301+49297)%233280)/233280;
  for(let y=0;y<21;y++)for(let x=0;x<21;x++){const c=(x<7&&y<7)||(x>13&&y<7)||(x<7&&y>13);
    const on=c?((x%7===0||x%7===6||y%7===0||y%7===6)||(x%7>1&&x%7<5&&y%7>1&&y%7<5)):r()>.5;
    if(on)s+=`<rect x="${x*5+5}" y="${y*5+5}" width="5" height="5"/>`}
  return `<svg width="115" height="115" viewBox="0 0 115 115" fill="#1b1e26" aria-hidden="true">${s}</svg>`}
const genCodes = () => Array.from({length:8},()=>rnd(4)+'-'+rnd(4));
const psteps = (n,cur) => `<div class="pstep">${Array.from({length:n},(_,i)=>`<i class="${i<cur?'on':''}"></i>`).join('')}</div>`;

ROOT.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const fn=A[el.dataset.a];if(!fn)return;
  if(el.dataset.a==='maskClose'&&e.target!==el)return; // clicks inside the dialog must not re-render
  if(el.tagName==='A')e.preventDefault();
  fn(el.dataset.arg,el,e);render();
});
const bind = e => {
  const el=e.target;
  if(el.dataset&&el.dataset.m&&S.modal){S.modal[el.dataset.m]=el.type==='checkbox'?el.checked:el.value}
  if(el.dataset&&'scn' in el.dataset&&e.type==='change'){applyScn(el.value);render();toast(L('已切换演示状态','Demo state switched'))}
};
ROOT.addEventListener('input',bind);ROOT.addEventListener('change',bind);
ROOT.addEventListener('keydown',e=>{
  if(!S.modal)return;
  if(e.key==='Escape'){S.modal=null;render()}
  if(e.key==='Enter'&&e.target.tagName==='INPUT'&&e.target.type!=='checkbox'){const b=ROOT.querySelector('.modal-f .btn.pri,.modal-f .btn.solid');if(b){e.preventDefault();b.click()}}
});
IGV.onLang(l=>{S.lang=l;render()});

})();
}catch(e){console.error('module security failed',e)}
</script>
